<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#111111">

  <title>AMO | حقائب نسائية</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #111111;
      --dark: #222222;
      --gray: #777777;
      --light-gray: #f5f5f5;
      --border: #e7e7e7;
      --white: #ffffff;
      --beige: #f4efe8;
      --gold: #b38b59;
      --danger: #c62828;
      --green: #16844a;
      --shadow: 0 8px 30px rgba(0,0,0,.08);
      --radius: 18px;
    }

    body {
      font-family:
        Arial,
        Tahoma,
        "Segoe UI",
        sans-serif;

      background: #fafafa;
      color: var(--black);
      min-height: 100vh;
    }

    body.no-scroll {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1250px;
      margin: auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .header-cart {
      position: relative;
      border: 1px solid var(--black);
      background: var(--black);
      color: white;
      border-radius: 14px;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .cart-count {
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      color: black;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      max-width: 1250px;
      margin: auto;
      padding: 35px 18px 20px;
    }

    .hero-box {
      background: var(--beige);
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
    }

    .hero-box h1 {
      font-size: clamp(28px, 6vw, 50px);
      margin-bottom: 10px;
      font-weight: 900;
    }

    .hero-box p {
      color: var(--gray);
      font-size: 16px;
      line-height: 1.8;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products-section {
      max-width: 1250px;
      margin: auto;
      padding: 20px 18px 130px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
    }

    .section-title h2 {
      font-size: 25px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.035);
      transition: .2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .product-image-wrap {
      position: relative;
      background: #f7f7f7;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 15px;
    }

    .product-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .product-price {
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 13px;
    }

    .product-meta {
      color: var(--gray);
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    /* =========================
       COLORS
    ========================= */

    .colors-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .colors {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 13px;
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid white;
      outline: 1px solid #ccc;
      position: relative;
      transition: .2s;
    }

    .color-btn.active {
      outline: 2px solid var(--black);
      transform: scale(1.08);
    }

    .color-btn::after {
      content: "";
      display: none;
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 2px solid white;
    }

    .color-btn.active::after {
      display: block;
    }

    .selected-color-name {
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 12px;
    }

    .add-button {
      width: 100%;
      background: var(--black);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-weight: 800;
      font-size: 14px;
    }

    .add-button:active {
      transform: scale(.98);
    }

    /* =========================
       FLOATING CART
    ========================= */

    .floating-cart {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      width: min(92%, 470px);
      background: var(--black);
      color: white;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .floating-cart.hidden {
      display: none;
    }

    .floating-cart-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .floating-cart-icon {
      font-size: 22px;
    }

    .floating-cart-text strong {
      display: block;
      font-size: 14px;
    }

    .floating-cart-text span {
      color: #ddd;
      font-size: 12px;
    }

    .floating-cart-total {
      font-weight: 900;
      white-space: nowrap;
    }

    /* =========================
       OVERLAY
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.52);
      z-index: 1500;
      display: none;
    }

    .overlay.show {
      display: block;
    }

    /* =========================
       CART DRAWER
    ========================= */

    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(440px, 94vw);
      height: 100vh;
      background: white;
      z-index: 1600;
      transform: translateX(110%);
      transition: transform .3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 35px rgba(0,0,0,.15);
    }

    .cart-drawer.open {
      transform: translateX(0);
    }

    .cart-header {
      padding: 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .cart-header h2 {
      font-size: 22px;
    }

    .close-button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: white;
      font-size: 20px;
    }

    .cart-body {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .empty-cart {
      min-height: 50vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--gray);
      gap: 10px;
    }

    .empty-cart-icon {
      font-size: 50px;
    }

    .cart-item {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 12px;
    }

    .cart-item-image {
      width: 76px;
      height: 76px;
      border-radius: 12px;
      object-fit: cover;
      background: #f5f5f5;
    }

    .cart-item-info {
      min-width: 0;
    }

    .cart-item-name {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .cart-item-color {
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 6px;
    }

    .cart-item-price {
      font-size: 14px;
      font-weight: 900;
    }

    .cart-item-actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .quantity-btn {
      width: 36px;
      height: 34px;
      border: none;
      background: #f6f6f6;
      font-size: 18px;
      font-weight: 900;
    }

    .quantity-value {
      width: 35px;
      text-align: center;
      font-weight: 900;
    }

    .remove-btn {
      border: none;
      background: transparent;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================
       DELIVERY PROGRESS
    ========================= */

    .free-delivery-box {
      background: #f7f7f7;
      border-radius: 15px;
      padding: 13px;
      margin-bottom: 15px;
    }

    .free-delivery-text {
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .progress {
      height: 7px;
      background: #ddd;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--green);
      border-radius: inherit;
      transition: .3s;
    }

    /* =========================
       CART FOOTER
    ========================= */

    .cart-footer {
      border-top: 1px solid var(--border);
      padding: 15px;
      background: white;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      font-size: 14px;
    }

    .summary-row.total {
      font-size: 19px;
      font-weight: 900;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 10px;
    }

    .checkout-button {
      width: 100%;
      border: none;
      background: var(--black);
      color: white;
      border-radius: 13px;
      padding: 15px;
      font-size: 16px;
      font-weight: 900;
      margin-top: 13px;
    }

    .continue-button {
      width: 100%;
      border: 1px solid var(--black);
      background: white;
      color: var(--black);
      border-radius: 13px;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      margin-top: 8px;
    }

    /* =========================
       CHECKOUT MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.58);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .checkout-modal {
      background: white;
      width: min(620px, 100%);
      max-height: 94vh;
      overflow-y: auto;
      border-radius: 25px 25px 0 0;
      padding: 20px;
      animation: slideUp .25s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .checkout-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .checkout-header h2 {
      font-size: 22px;
    }

    .step-indicator {
      display: flex;
      gap: 7px;
      margin-bottom: 20px;
    }

    .step {
      flex: 1;
      height: 5px;
      border-radius: 99px;
      background: #ddd;
    }

    .step.active {
      background: var(--black);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      outline: none;
      background: white;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--black);
    }

    .form-group textarea {
      min-height: 85px;
      resize: vertical;
    }

    .required {
      color: var(--danger);
    }

    .checkout-summary {
      background: #f7f7f7;
      border-radius: 16px;
      padding: 14px;
      margin: 15px 0;
    }

    .review-product {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .review-product:last-child {
      border-bottom: none;
    }

    .review-product img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 10px;
    }

    .review-product-info {
      flex: 1;
    }

    .review-product-info strong {
      display: block;
      font-size: 13px;
    }

    .review-product-info span {
      display: block;
      color: var(--gray);
      font-size: 11px;
      margin-top: 4px;
    }

    .checkout-actions {
      display: flex;
      gap: 9px;
      margin-top: 15px;
    }

    .checkout-actions button {
      flex: 1;
      border-radius: 13px;
      padding: 14px;
      font-weight: 900;
      font-size: 14px;
    }

    .back-button {
      border: 1px solid var(--black);
      background: white;
      color: var(--black);
    }

    .next-button,
    .send-button {
      border: none;
      background: var(--black);
      color: white;
    }

    .send-button {
      background: #16844a;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translate(-50%, 20px);
      background: var(--black);
      color: white;
      padding: 12px 18px;
      border-radius: 13px;
      font-size: 13px;
      z-index: 5000;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: var(--gray);
    }

    .error-box {
      background: #fff0f0;
      color: var(--danger);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      line-height: 1.8;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 1000px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product-info {
        padding: 11px;
      }

      .product-name {
        font-size: 14px;
      }

      .product-price {
        font-size: 16px;
      }

      .product-meta {
        font-size: 11px;
      }

      .add-button {
        padding: 11px 8px;
      }

      .color-btn {
        width: 25px;
        height: 25px;
      }

      .hero {
        padding-top: 15px;
      }

      .hero-box {
        padding: 25px 15px;
      }

      .section-title h2 {
        font-size: 21px;
      }
    }

    @media (max-width: 430px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .header-inner {
        padding: 11px 13px;
      }

      .logo {
        font-size: 23px;
      }

      .header-cart {
        padding: 9px 11px;
        font-size: 12px;
      }

      .cart-drawer {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>
    <div class="header-inner">

      <div class="logo">
        AMO
      </div>

      <button
        class="header-cart"
        type="button"
        onclick="openCart()"
      >
        🛒 السلة
        <span
          id="headerCartCount"
          class="cart-count"
        >
          0
        </span>
      </button>

    </div>
  </header>


  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">

    <div class="hero-box">

      <h1>AMO</h1>

      <p>
        اختاري شنطتك المفضلة وأضيفيها إلى السلة
        ثم أكملي الطلب بسهولة عبر WhatsApp.
      </p>

    </div>

  </section>


  <!-- =========================
       PRODUCTS
  ========================== -->

  <main class="products-section">

    <div class="section-title">

      <h2>
        منتجاتنا
      </h2>

      <span
        id="productsCount"
        style="color:#777;font-size:13px"
      >
        جاري التحميل...
      </span>

    </div>

    <div
      id="productsGrid"
      class="products-grid"
    >

      <div class="loading">
        جاري تحميل المنتجات...
      </div>

    </div>

  </main>


  <!-- =========================
       FLOATING CART
  ========================== -->

  <button
    id="floatingCart"
    class="floating-cart hidden"
    type="button"
    onclick="openCart()"
  >

    <div class="floating-cart-info">

      <div class="floating-cart-icon">
        🛒
      </div>

      <div class="floating-cart-text">

        <strong>
          عرض السلة
        </strong>

        <span id="floatingCartItems">
          0 منتجات
        </span>

      </div>

    </div>

    <div
      id="floatingCartTotal"
      class="floating-cart-total"
    >
      0.00 د.أ
    </div>

  </button>


  <!-- =========================
       OVERLAY
  ========================== -->

  <div
    id="overlay"
    class="overlay"
    onclick="closeAllOverlays()"
  ></div>


  <!-- =========================
       CART DRAWER
  ========================== -->

  <aside
    id="cartDrawer"
    class="cart-drawer"
  >

    <div class="cart-header">

      <h2>
        🛒 سلة المشتريات
      </h2>

      <button
        class="close-button"
        type="button"
        onclick="closeCart()"
      >
        ×
      </button>

    </div>


    <div
      id="cartBody"
      class="cart-body"
    ></div>


    <div
      id="cartFooter"
      class="cart-footer"
    ></div>

  </aside>


  <!-- =========================
       CHECKOUT MODAL
  ========================== -->

  <div
    id="checkoutModal"
    class="modal"
  >

    <div class="checkout-modal">

      <div class="checkout-header">

        <h2>
          إتمام الطلب
        </h2>

        <button
          class="close-button"
          type="button"
          onclick="closeCheckout()"
        >
          ×
        </button>

      </div>


      <div class="step-indicator">

        <div
          id="step1Indicator"
          class="step active"
        ></div>

        <div
          id="step2Indicator"
          class="step"
        ></div>

      </div>


      <!-- STEP 1 -->

      <div id="checkoutStep1">

        <div class="form-group">

          <label>
            الاسم الكامل
            <span class="required">*</span>
          </label>

          <input
            id="customerName"
            type="text"
            placeholder="مثال: محمد أحمد"
          >

        </div>


        <div class="form-group">

          <label>
            رقم الهاتف
            <span class="required">*</span>
          </label>

          <input
            id="customerPhone"
            type="tel"
            placeholder="07XXXXXXXX"
          >

        </div>


        <div class="form-group">

          <label>
            المحافظة
            <span class="required">*</span>
          </label>

          <select id="customerCity">

            <option value="">
              اختر المحافظة
            </option>

            <option>عمان</option>
            <option>الزرقاء</option>
            <option>إربد</option>
            <option>البلقاء</option>
            <option>مادبا</option>
            <option>جرش</option>
            <option>عجلون</option>
            <option>الكرك</option>
            <option>الطفيلة</option>
            <option>معان</option>
            <option>العقبة</option>
            <option>المفرق</option>

          </select>

        </div>


        <div class="form-group">

          <label>
            العنوان بالتفصيل
            <span class="required">*</span>
          </label>

          <textarea
            id="customerAddress"
            placeholder="المنطقة، الشارع، أقرب نقطة دالة..."
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            ملاحظات إضافية
          </label>

          <textarea
            id="customerNotes"
            placeholder="مثال: الاتصال قبل التوصيل..."
          ></textarea>

        </div>


        <div class="checkout-actions">

          <button
            class="back-button"
            type="button"
            onclick="closeCheckout()"
          >
            رجوع
          </button>

          <button
            class="next-button"
            type="button"
            onclick="goToReview()"
          >
            متابعة الطلب
          </button>

        </div>

      </div>


      <!-- STEP 2 -->

      <div
        id="checkoutStep2"
        style="display:none"
      >

        <h3 style="margin-bottom:12px">
          مراجعة الطلب
        </h3>


        <div
          id="reviewProducts"
          class="checkout-summary"
        ></div>


        <div
          id="reviewCustomer"
          class="checkout-summary"
        ></div>


        <div
          id="reviewTotals"
          class="checkout-summary"
        ></div>


        <div class="checkout-actions">

          <button
            class="back-button"
            type="button"
            onclick="goToCustomerData()"
          >
            تعديل البيانات
          </button>

          <button
            class="send-button"
            type="button"
            onclick="sendWhatsAppOrder()"
          >
            📲 إرسال الطلب
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       TOAST
  ========================== -->

  <div
    id="toast"
    class="toast"
  ></div>


  <script>

    /* =========================================================
       إعدادات الموقع
    ========================================================= */

    const REPO_OWNER = "llvll0";
    const REPO_NAME = "AMO";
    const BRANCH = "main";

    const WHATSAPP_NUMBER = "962790780914";

    const DELIVERY_PRICE = 2;
    const FREE_DELIVERY_FROM = 49;

    const CART_KEY = "amo_cart";


    /* =========================================================
       متغيرات
    ========================================================= */

    let products = [];
    let cart = loadCart();

    let toastTimer = null;


    /* =========================================================
       تحميل السلة
    ========================================================= */

    function loadCart() {

      try {

        const saved =
          localStorage.getItem(CART_KEY);

        if (!saved) {
          return [];
        }

        const parsed =
          JSON.parse(saved);

        return Array.isArray(parsed)
          ? parsed
          : [];

      } catch (error) {

        console.error(
          "Cart loading error:",
          error
        );

        return [];

      }

    }


    function saveCart() {

      localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
      );

      renderCart();
      updateCartUI();

    }


    /* =========================================================
       الصور
    ========================================================= */

    function makeImageUrl(
      path,
      folder = ""
    ) {

      if (!path) {
        return "";
      }

      path =
        String(path)
          .trim();

      if (
        /^(https?:\/\/|data:)/i
          .test(path)
      ) {

        return path;

      }

      path =
        path.replace(
          /^\/+/,
          ""
        );


      /*
       * المنتجات الجديدة
       */

      if (folder) {

        /*
         * دعم احتياطي إذا كان product.js
         * يحتوي على images/
         */

        path =
          path.replace(
            /^images\//i,
            ""
          );

        return (
          `https://raw.githubusercontent.com/` +
          `${REPO_OWNER}/${REPO_NAME}/${BRANCH}/` +
          `products-new/` +
          `${encodeURIComponent(folder)}/` +
          `${encodeURIComponent(path)}`
        );

      }


      /*
       * المنتجات القديمة
       */

      if (
        path.startsWith("products/") ||
        path.startsWith("images/")
      ) {

        return (
          `https://${REPO_OWNER}.github.io/` +
          `${REPO_NAME}/${path}`
        );

      }


      return (
        `https://${REPO_OWNER}.github.io/` +
        `${REPO_NAME}/images/${path}`
      );

    }


    function productImage(
      product,
      image
    ) {

      return makeImageUrl(
        image,
        product?.folder || ""
      );

    }


    /* =========================================================
       تحميل المنتجات القديمة
    ========================================================= */

    async function loadOldProducts() {

      try {

        const url =
          `https://raw.githubusercontent.com/` +
          `${REPO_OWNER}/${REPO_NAME}/${BRANCH}/products.js`;

        const response =
          await fetch(
            url,
            { cache: "no-store" }
          );

        if (!response.ok) {
          return [];
        }

        const text =
          await response.text();

        /*
         * products.js الحالي عندك:
         *
         * const products = [];
         */

        const parsed =
          new Function(
            text +
            "\nreturn products;"
          )();

        if (!Array.isArray(parsed)) {
          return [];
        }

        return parsed.map(product => ({
          ...product,
          folder: product.folder || ""
        }));

      } catch (error) {

        console.warn(
          "Old products failed:",
          error
        );

        return [];

      }

    }


    /* =========================================================
       تحميل المنتجات الجديدة تلقائيًا
    ========================================================= */

    async function loadNewProducts() {

      const apiUrl =
        `https://api.github.com/repos/` +
        `${REPO_OWNER}/${REPO_NAME}/contents/` +
        `products-new?ref=${BRANCH}`;


      const response =
        await fetch(
          apiUrl,
          {
            cache: "no-store",
            headers: {
              "Accept":
                "application/vnd.github+json"
            }
          }
        );


      if (!response.ok) {

        throw new Error(
          "تعذر قراءة مجلد المنتجات الجديدة"
        );

      }


      const entries =
        await response.json();


      /*
       * نأخذ فقط المجلدات التي اسمها رقم
       *
       * 1
       * 7
       * 8
       * 9
       * 11
       * ...
       */

      const folders =
        entries

          .filter(
            item =>
              item.type === "dir" &&
              /^\d+$/.test(item.name)
          )

          .sort(
            (a,b) =>
              Number(a.name) -
              Number(b.name)
          );


      const loaded = [];


      for (
        const folder of folders
      ) {

        try {

          const productUrl =
            `https://raw.githubusercontent.com/` +
            `${REPO_OWNER}/${REPO_NAME}/${BRANCH}/` +
            `products-new/` +
            `${encodeURIComponent(folder.name)}/product.js`;


          const productResponse =
            await fetch(
              productUrl,
              { cache: "no-store" }
            );


          if (!productResponse.ok) {
            continue;
          }


          const productCode =
            await productResponse.text();


          /*
           * قراءة:
           *
           * const product = {...}
           */

          const product =
            new Function(
              productCode +
              "\nreturn product;"
            )();


          if (!product) {
            continue;
          }


          loaded.push({
            ...product,
            id: String(
              product.id ||
              folder.name
            ),
            folder: folder.name
          });


        } catch (error) {

          console.warn(
            `خطأ في المنتج ${folder.name}:`,
            error
          );

        }

      }


      return loaded;

    }


    /* =========================================================
       تحميل كل المنتجات
    ========================================================= */

    async function loadProducts() {

      const grid =
        document.getElementById(
          "productsGrid"
        );


      try {

        grid.innerHTML = `
          <div class="loading">
            جاري تحميل المنتجات...
          </div>
        `;


        const [
          oldProducts,
          newProducts
        ] = await Promise.all([
          loadOldProducts(),
          loadNewProducts()
        ]);


        /*
         * المنتجات الجديدة لها الأولوية
         *
         * لو كان نفس ID موجود قديمًا
         * لن يظهر مرتين.
         */

        const map =
          new Map();


        for (
          const product of oldProducts
        ) {

          map.set(
            String(product.id),
            product
          );

        }


        for (
          const product of newProducts
        ) {

          map.set(
            String(product.id),
            product
          );

        }


        products =
          Array.from(
            map.values()
          );


        products.sort(
          (a,b) =>
            Number(a.id) -
            Number(b.id)
        );


        renderProducts();


      } catch (error) {

        console.error(error);

        grid.innerHTML = `
          <div class="error-box">
            حدث خطأ أثناء تحميل المنتجات.
            <br>
            تأكدي أن مجلد
            <b>products-new</b>
            موجود في GitHub.
          </div>
        `;

      }

    }


    /* =========================================================
       رسم المنتجات
    ========================================================= */

    function renderProducts() {

      const grid =
        document.getElementById(
          "productsGrid"
        );


      document.getElementById(
        "productsCount"
      ).textContent =
        `${products.length} منتجات`;


      if (!products.length) {

        grid.innerHTML = `
          <div class="loading">
            لا توجد منتجات حاليًا.
          </div>
        `;

        return;

      }


      grid.innerHTML = "";


      products.forEach(
        product => {

          const card =
            document.createElement(
              "article"
            );

          card.className =
            "product-card";


          const colors =
            Array.isArray(product.colors)
              ? product.colors
              : [];


          let selectedColor =
            colors.length
              ? colors[0]
              : null;


          let selectedImage =
            selectedColor?.image ||
            product.image ||
            product.gallery?.[0] ||
            "";


          card.innerHTML = `

            <div class="product-image-wrap">

              <img
                class="product-image"
                src="${productImage(product, selectedImage)}"
                alt="${escapeHtml(product.name || "AMO")}"
                loading="lazy"
              >

            </div>


            <div class="product-info">

              <div class="product-name">
                ${escapeHtml(
                  product.name ||
                  `شنطة AMO #${product.id}`
                )}
              </div>


              <div class="product-price">
                ${Number(product.price || 0).toFixed(2)}
                د.أ
              </div>


              ${
                product.dimensions
                  ? `
                    <div class="product-meta">
                      📐 ${escapeHtml(
                        product.dimensions
                      )}
                    </div>
                  `
                  : ""
              }


              ${
                colors.length
                  ? `
                    <div class="colors-title">
                      اختاري اللون:
                    </div>

                    <div class="colors">

                      ${colors.map(
                        (color, index) => `
                          <button
                            type="button"
                            class="color-btn ${
                              index === 0
                                ? "active"
                                : ""
                            }"
                            data-color-index="${index}"
                            title="${escapeHtml(
                              color.name || ""
                            )}"
                            style="background:${color.value || "#ddd"}"
                          ></button>
                        `
                      ).join("")}

                    </div>

                    <div class="selected-color-name">
                      اللون:
                      <b class="selected-color-text">
                        ${escapeHtml(
                          selectedColor?.name || ""
                        )}
                      </b>
                    </div>
                  `
                  : ""
              }


              <button
                type="button"
                class="add-button"
              >
                🛒 إضافة للسلة
              </button>

            </div>
          `;


          /*
           * تغيير اللون
           */

          card
            .querySelectorAll(
              ".color-btn"
            )
            .forEach(
              button => {

                button.addEventListener(
                  "click",
                  () => {

                    const index =
                      Number(
                        button.dataset
                          .colorIndex
                      );


                    selectedColor =
                      colors[index];


                    selectedImage =
                      selectedColor.image ||
                      product.image ||
                      "";


                    card
                      .querySelector(
                        ".product-image"
                      )
                      .src =
                      productImage(
                        product,
                        selectedImage
                      );


                    card
                      .querySelectorAll(
                        ".color-btn"
                      )
                      .forEach(
                        btn =>
                          btn.classList.remove(
                            "active"
                          )
                      );


                    button.classList.add(
                      "active"
                    );


                    const colorText =
                      card.querySelector(
                        ".selected-color-text"
                      );


                    if (colorText) {

                      colorText.textContent =
                        selectedColor.name ||
                        "";

                    }

                  }
                );

              }
            );


          /*
           * إضافة للسلة
           */

          card
            .querySelector(
              ".add-button"
            )
            .addEventListener(
              "click",
              () => {

                addToCart(
                  product,
                  selectedColor?.name || "",
                  selectedImage
                );

              }
            );


          grid.appendChild(card);

        }
      );

    }


    /* =========================================================
       إضافة منتج للسلة
    ========================================================= */

    function addToCart(
      product,
      colorName = "",
      colorImage = ""
    ) {

      const productId =
        String(product.id);


      /*
       * نفس المنتج + نفس اللون
       * = زيادة الكمية
       */

      const existingIndex =
        cart.findIndex(
          item =>
            String(item.productId) ===
              productId &&
            String(item.color || "") ===
              String(colorName || "")
        );


      if (
        existingIndex !== -1
      ) {

        cart[existingIndex].qty += 1;

      } else {

        cart.push({

          productId,

          name:
            product.name ||
            `شنطة AMO #${productId}`,

          price:
            Number(
              product.price || 0
            ),

          color:
            colorName,

          image:
            colorImage ||
            product.image ||
            product.gallery?.[0] ||
            "",

          folder:
            product.folder || "",

          qty: 1

        });

      }


      saveCart();


      showToast(
        "تمت إضافة المنتج إلى السلة 🛒"
      );

    }


    /* =========================================================
       تغيير الكمية
    ========================================================= */

    function changeQuantity(
      index,
      amount
    ) {

      if (!cart[index]) {
        return;
      }


      cart[index].qty =
        Number(cart[index].qty || 1) +
        amount;


      if (
        cart[index].qty <= 0
      ) {

        cart.splice(
          index,
          1
        );

      }


      saveCart();

    }


    /* =========================================================
       حذف منتج
    ========================================================= */

    function removeFromCart(index) {

      if (!cart[index]) {
        return;
      }


      cart.splice(
        index,
        1
      );


      saveCart();


      showToast(
        "تم حذف المنتج من السلة"
      );

    }


    /* =========================================================
       الحسابات
    ========================================================= */

    function getSubtotal() {

      return cart.reduce(
        (sum, item) =>
          sum +
          (
            Number(item.price || 0) *
            Number(item.qty || 0)
          ),
        0
      );

    }


    function getDelivery() {

      const subtotal =
        getSubtotal();


      if (
        subtotal >=
        FREE_DELIVERY_FROM
      ) {

        return 0;

      }


      if (
        subtotal <= 0
      ) {

        return 0;

      }


      return DELIVERY_PRICE;

    }


    function getCartCount() {

      return cart.reduce(
        (sum, item) =>
          sum +
          Number(item.qty || 0),
        0
      );

    }


    /* =========================================================
       تحديث واجهة السلة
    ========================================================= */

    function updateCartUI() {

      const count =
        getCartCount();


      const subtotal =
        getSubtotal();


      const headerCount =
        document.getElementById(
          "headerCartCount"
        );


      headerCount.textContent =
        count;


      const floating =
        document.getElementById(
          "floatingCart"
        );


      const floatingItems =
        document.getElementById(
          "floatingCartItems"
        );


      const floatingTotal =
        document.getElementById(
          "floatingCartTotal"
        );


      if (count > 0) {

        floating.classList.remove(
          "hidden"
        );


        floatingItems.textContent =
          `${count} ${
            count === 1
              ? "منتج"
              : "منتجات"
          }`;


        floatingTotal.textContent =
          `${subtotal.toFixed(2)} د.أ`;

      } else {

        floating.classList.add(
          "hidden"
        );

      }

    }


    /* =========================================================
       رسم السلة
    ========================================================= */

    function renderCart() {

      const body =
        document.getElementById(
          "cartBody"
        );


      const footer =
        document.getElementById(
          "cartFooter"
        );


      if (!cart.length) {

        body.innerHTML = `

          <div class="empty-cart">

            <div class="empty-cart-icon">
              🛒
            </div>

            <strong>
              السلة فارغة
            </strong>

            <span>
              اختاري المنتجات التي تعجبك
              وأضيفيها إلى السلة.
            </span>

            <button
              class="continue-button"
              style="max-width:220px"
              onclick="closeCart()"
            >
              تصفح المنتجات
            </button>

          </div>

        `;


        footer.innerHTML = "";


        updateCartUI();

        return;

      }


      body.innerHTML = "";


      cart.forEach(
        (item, index) => {

          const imageUrl =
            makeImageUrl(
              item.image,
              item.folder || ""
            );


          const itemTotal =
            Number(item.price || 0) *
            Number(item.qty || 0);


          const element =
            document.createElement(
              "div"
            );


          element.className =
            "cart-item";


          element.innerHTML = `

            <img
              class="cart-item-image"
              src="${imageUrl}"
              alt="${escapeHtml(item.name)}"
            >


            <div class="cart-item-info">

              <div class="cart-item-name">
                ${escapeHtml(item.name)}
              </div>


              ${
                item.color
                  ? `
                    <div class="cart-item-color">
                      اللون:
                      <b>
                        ${escapeHtml(item.color)}
                      </b>
                    </div>
                  `
                  : ""
              }


              <div class="cart-item-price">
                ${itemTotal.toFixed(2)}
                د.أ
              </div>

            </div>


            <div class="cart-item-actions">

              <div class="quantity-box">

                <button
                  class="quantity-btn"
                  type="button"
                  onclick="changeQuantity(${index}, -1)"
                >
                  −
                </button>

                <div class="quantity-value">
                  ${item.qty}
                </div>

                <button
                  class="quantity-btn"
                  type="button"
                  onclick="changeQuantity(${index}, 1)"
                >
                  +
                </button>

              </div>


              <button
                class="remove-btn"
                type="button"
                onclick="removeFromCart(${index})"
              >
                🗑 حذف
              </button>

            </div>

          `;


          body.appendChild(
            element
          );

        }
      );


      const subtotal =
        getSubtotal();


      const delivery =
        getDelivery();


      const total =
        subtotal + delivery;


      let deliveryMessage = "";


      if (
        subtotal >=
        FREE_DELIVERY_FROM
      ) {

        deliveryMessage = `
          <div class="free-delivery-text">
            🎉 مبروك!
            حصلتِ على التوصيل المجاني.
          </div>

          <div class="progress">
            <div
              class="progress-bar"
              style="width:100%"
            ></div>
          </div>
        `;

      } else {

        const remaining =
          FREE_DELIVERY_FROM -
          subtotal;


        const percentage =
          Math.min(
            100,
            (
              subtotal /
              FREE_DELIVERY_FROM
            ) * 100
          );


        deliveryMessage = `
          <div class="free-delivery-text">
            أضيفي
            <b>
              ${remaining.toFixed(2)} د.أ
            </b>
            لتحصلي على
            <b>توصيل مجاني</b> 🎁
          </div>

          <div class="progress">
            <div
              class="progress-bar"
              style="width:${percentage}%"
            ></div>
          </div>
        `;

      }


      footer.innerHTML = `

        <div class="free-delivery-box">
          ${deliveryMessage}
        </div>


        <div class="summary-row">

          <span>
            المجموع
          </span>

          <strong>
            ${subtotal.toFixed(2)} د.أ
          </strong>

        </div>


        <div class="summary-row">

          <span>
            التوصيل
          </span>

          <strong>
            ${
              delivery === 0
                ? "مجاني"
                : `${delivery.toFixed(2)} د.أ`
            }
          </strong>

        </div>


        <div class="summary-row total">

          <span>
            الإجمالي
          </span>

          <strong>
            ${total.toFixed(2)} د.أ
          </strong>

        </div>


        <button
          class="checkout-button"
          type="button"
          onclick="openCheckout()"
        >
          إكمال الطلب →
        </button>


        <button
          class="continue-button"
          type="button"
          onclick="closeCart()"
        >
          متابعة التسوق
        </button>

      `;


      updateCartUI();

    }


    /* =========================================================
       فتح / إغلاق السلة
    ========================================================= */

    function openCart() {

      renderCart();


      document
        .getElementById(
          "cartDrawer"
        )
        .classList.add(
          "open"
        );


      document
        .getElementById(
          "overlay"
        )
        .classList.add(
          "show"
        );


      document.body.classList.add(
        "no-scroll"
      );

    }


    function closeCart() {

      document
        .getElementById(
          "cartDrawer"
        )
        .classList.remove(
          "open"
        );


      document
        .getElementById(
          "overlay"
        )
        .classList.remove(
          "show"
        );


      document.body.classList.remove(
        "no-scroll"
      );

    }


    function closeAllOverlays() {

      closeCart();
      closeCheckout();

    }


    /* =========================================================
       Checkout
    ========================================================= */

    function openCheckout() {

      if (!cart.length) {

        showToast(
          "السلة فارغة"
        );

        return;

      }


      closeCart();


      document
        .getElementById(
          "checkoutModal"
        )
        .classList.add(
          "show"
        );


      document.body.classList.add(
        "no-scroll"
      );


      goToCustomerData();

    }


    function closeCheckout() {

      document
        .getElementById(
          "checkoutModal"
        )
        .classList.remove(
          "show"
        );


      document.body.classList.remove(
        "no-scroll"
      );

    }


    function goToCustomerData() {

      document.getElementById(
        "checkoutStep1"
      ).style.display = "block";


      document.getElementById(
        "checkoutStep2"
      ).style.display = "none";


      document.getElementById(
        "step1Indicator"
      ).classList.add(
        "active"
      );


      document.getElementById(
        "step2Indicator"
      ).classList.remove(
        "active"
      );

    }


    function goToReview() {

      const name =
        document.getElementById(
          "customerName"
        ).value.trim();


      const phone =
        document.getElementById(
          "customerPhone"
        ).value.trim();


      const city =
        document.getElementById(
          "customerCity"
        ).value;


      const address =
        document.getElementById(
          "customerAddress"
        ).value.trim();


      if (
        !name ||
        !phone ||
        !city ||
        !address
      ) {

        showToast(
          "يرجى تعبئة جميع البيانات المطلوبة"
        );

        return;

      }


      renderReview();


      document.getElementById(
        "checkoutStep1"
      ).style.display = "none";


      document.getElementById(
        "checkoutStep2"
      ).style.display = "block";


      document.getElementById(
        "step1Indicator"
      ).classList.add(
        "active"
      );


      document.getElementById(
        "step2Indicator"
      ).classList.add(
        "active"
      );

    }


    /* =========================================================
       مراجعة الطلب
    ========================================================= */

    function renderReview() {

      const productsBox =
        document.getElementById(
          "reviewProducts"
        );


      productsBox.innerHTML = `

        <strong>
          المنتجات
        </strong>

        <div style="margin-top:8px">

          ${cart.map(item => {

            const imageUrl =
              makeImageUrl(
                item.image,
                item.folder || ""
              );


            return `

              <div class="review-product">

                <img
                  src="${imageUrl}"
                  alt="${escapeHtml(item.name)}"
                >

                <div class="review-product-info">

                  <strong>
                    ${escapeHtml(item.name)}
                  </strong>

                  <span>
                    ${
                      item.color
                        ? `اللون: ${escapeHtml(item.color)} · `
                        : ""
                    }
                    الكمية: ${item.qty}
                  </span>

                </div>

                <strong>
                  ${
                    (
                      Number(item.price) *
                      Number(item.qty)
                    ).toFixed(2)
                  }
                  د.أ
                </strong>

              </div>

            `;

          }).join("")}

        </div>

      `;


      const name =
        document.getElementById(
          "customerName"
        ).value.trim();


      const phone =
        document.getElementById(
          "customerPhone"
        ).value.trim();


      const city =
        document.getElementById(
          "customerCity"
        ).value;


      const address =
        document.getElementById(
          "customerAddress"
        ).value.trim();


      const notes =
        document.getElementById(
          "customerNotes"
        ).value.trim();


      const customerBox =
        document.getElementById(
          "reviewCustomer"
        );


      customerBox.innerHTML = `

        <strong>
          بيانات التوصيل
        </strong>

        <div
          style="
            margin-top:10px;
            line-height:1.9;
            font-size:14px;
          "
        >

          👤 ${escapeHtml(name)}
          <br>

          📞 ${escapeHtml(phone)}
          <br>

          📍 ${escapeHtml(city)}
          <br>

          🏠 ${escapeHtml(address)}

          ${
            notes
              ? `
                <br>
                📝 ${escapeHtml(notes)}
              `
              : ""
          }

        </div>

      `;


      const subtotal =
        getSubtotal();


      const delivery =
        getDelivery();


      const total =
        subtotal + delivery;


      document.getElementById(
        "reviewTotals"
      ).innerHTML = `

        <div class="summary-row">

          <span>
            المجموع
          </span>

          <strong>
            ${subtotal.toFixed(2)} د.أ
          </strong>

        </div>


        <div class="summary-row">

          <span>
            التوصيل
          </span>

          <strong>
            ${
              delivery === 0
                ? "مجاني"
                : `${delivery.toFixed(2)} د.أ`
            }
          </strong>

        </div>


        <div class="summary-row total">

          <span>
            الإجمالي
          </span>

          <strong>
            ${total.toFixed(2)} د.أ
          </strong>

        </div>

      `;

    }


    /* =========================================================
       إرسال الطلب
    ========================================================= */

    async function sendWhatsAppOrder() {

      if (!cart.length) {

        showToast(
          "السلة فارغة"
        );

        return;

      }


      const name =
        document.getElementById(
          "customerName"
        ).value.trim();


      const phone =
        document.getElementById(
          "customerPhone"
        ).value.trim();


      const city =
        document.getElementById(
          "customerCity"
        ).value;


      const address =
        document.getElementById(
          "customerAddress"
        ).value.trim();


      const notes =
        document.getElementById(
          "customerNotes"
        ).value.trim();


      if (
        !name ||
        !phone ||
        !city ||
        !address
      ) {

        goToCustomerData();

        showToast(
          "يرجى تعبئة جميع البيانات المطلوبة"
        );

        return;

      }


      const subtotal =
        getSubtotal();


      const delivery =
        getDelivery();


      const total =
        subtotal + delivery;


      /*
       * إنشاء نص الطلب
       */

      let message =
        `🛍️ طلب جديد من AMO\n\n`;


      message +=
        `👤 الاسم: ${name}\n`;


      message +=
        `📞 الهاتف: ${phone}\n`;


      message +=
        `📍 المحافظة: ${city}\n`;


      message +=
        `🏠 العنوان: ${address}\n`;


      if (notes) {

        message +=
          `📝 الملاحظات: ${notes}\n`;

      }


      message +=
        `\n━━━━━━━━━━━━\n`;


      message +=
        `🛒 المنتجات:\n\n`;


      cart.forEach(
        item => {

          message +=
            `• ${item.name}`;


          if (item.color) {

            message +=
              ` | اللون: ${item.color}`;

          }


          message +=
            ` | الكمية: ${item.qty}`;


          message +=
            ` | ${(
              Number(item.price) *
              Number(item.qty)
            ).toFixed(2)} د.أ\n`;

        }
      );


      message +=
        `\n💰 المجموع: ${subtotal.toFixed(2)} د.أ\n`;


      message +=
        `🚚 التوصيل: ${
          delivery === 0
            ? "مجاني"
            : delivery.toFixed(2) + " د.أ"
        }\n`;


      message +=
        `💵 الإجمالي: ${total.toFixed(2)} د.أ`;


      /*
       * =====================================================
       * تحميل صور المنتجات المختارة
       * =====================================================
       */

      const files = [];


      showToast(
        "جاري تجهيز صور الطلب..."
      );


      try {

        for (
          const item of cart
        ) {

          if (!item.image) {
            continue;
          }


          const imageUrl =
            makeImageUrl(
              item.image,
              item.folder || ""
            );


          const response =
            await fetch(
              imageUrl,
              {
                cache: "no-store"
              }
            );


          if (!response.ok) {

            console.warn(
              "تعذر تحميل الصورة:",
              imageUrl
            );

            continue;

          }


          const blob =
            await response.blob();


          let extension =
            "jpg";


          if (
            blob.type.includes("png")
          ) {

            extension = "png";

          } else if (
            blob.type.includes("webp")
          ) {

            extension = "webp";

          } else if (
            blob.type.includes("jpeg")
          ) {

            extension = "jpg";

          }


          const safeProductName =
            String(
              item.name || "AMO"
            )
              .replace(
                /[^\w\u0600-\u06FF\- ]/g,
                ""
              )
              .replace(
                /\s+/g,
                "_"
              );


          const safeColor =
            String(
              item.color || ""
            )
              .replace(
                /[^\w\u0600-\u06FF\- ]/g,
                ""
              )
              .replace(
                /\s+/g,
                "_"
              );


          const fileName =
            `${safeProductName}_${safeColor}.${extension}`;


          const file =
            new File(
              [blob],
              fileName,
              {
                type:
                  blob.type ||
                  "image/jpeg"
              }
            );


          files.push(file);

        }


        /*
         * =====================================================
         * مشاركة الصور + نص الطلب
         * =====================================================
         */

        if (
          navigator.share &&
          navigator.canShare &&
          files.length &&
          navigator.canShare({
            files
          })
        ) {

          /*
           * مهم:
           * هذا الاستدعاء يحدث مباشرة
           * ضمن عملية الضغط على زر إرسال الطلب.
           */

          await navigator.share({

            title:
              "طلب جديد من AMO",

            text:
              message,

            files:
              files

          });


          showToast(
            "تم تجهيز الطلب للمشاركة ✅"
          );


          return;

        }


        /*
         * إذا الجهاز لا يدعم مشاركة الصور
         */

        showToast(
          "المتصفح لا يدعم إرسال الصور، سيتم فتح WhatsApp بالنص."
        );


        setTimeout(
          () => {

            openWhatsAppText(
              message
            );

          },
          900
        );


      } catch (error) {

        console.error(
          "Share error:",
          error
        );


        /*
         * إذا المستخدم أغلق شاشة المشاركة
         * لا نريد فتح WhatsApp تلقائيًا.
         */

        if (
          error &&
          error.name ===
          "AbortError"
        ) {

          showToast(
            "تم إلغاء المشاركة"
          );

          return;

        }


        /*
         * أي خطأ آخر:
         * نفتح WhatsApp بالنص.
         */

        showToast(
          "تعذر إرسال الصور، سيتم فتح WhatsApp بالطلب."
        );


        setTimeout(
          () => {

            openWhatsAppText(
              message
            );

          },
          900
        );

      }

    }


    /* =========================================================
       فتح WhatsApp بالنص
    ========================================================= */

    function openWhatsAppText(
      message
    ) {

      const url =
        `https://wa.me/${WHATSAPP_NUMBER}` +
        `?text=${encodeURIComponent(message)}`;


      window.open(
        url,
        "_blank"
      );

    }


    /* =========================================================
       Toast
    ========================================================= */

    function showToast(
      message
    ) {

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          2800
        );

    }


    /* =========================================================
       حماية النصوص
    ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================================
       تشغيل الموقع
    ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        renderCart();

        updateCartUI();

        loadProducts();

      }
    );


    /* =========================================================
       إغلاق نافذة checkout عند الضغط خارجها
    ========================================================= */

    document
      .getElementById(
        "checkoutModal"
      )
      .addEventListener(
        "click",
        event => {

          if (
            event.target.id ===
            "checkoutModal"
          ) {

            closeCheckout();

          }

        }
      );

  </script>
