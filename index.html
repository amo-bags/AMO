<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AMO | متجر الحقائب</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f6f1;
      color: #171717;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
      font-size: 14px;
    }

    .hero {
      min-height: 430px;
      padding: 80px 8%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #eee9df;
    }

    .hero h1 {
      font-size: 45px;
      margin-bottom: 18px;
    }

    .hero p {
      font-size: 18px;
      color: #555;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 14px 30px;
      border-radius: 30px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .products {
      padding: 60px 6%;
    }

    .section-title {
      text-align: center;
      font-size: 30px;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .product-image {
      height: 300px;
      background: #e9e6df;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 15px;
    }

    .product-info {
      padding: 20px;
    }

    .product-info h3 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .colors {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .color {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 0 1px #bbb;
      cursor: pointer;
    }

    .black { background: #111; }
    .beige { background: #d8c7a7; }
    .brown { background: #795548; }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 32px;
      }

      nav a {
        display: none;
      }

      .products {
        padding: 40px 5%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">AMO</div>

  <nav>
    <a href="#home">الرئيسية</a>
    <a href="#products">الحقائب</a>
    <a href="#contact">تواصل معنا</a>
  </nav>
</header>

<section class="hero" id="home">
  <div>
    <h1>اختاري شنطتك بستايلك الخاص</h1>

    <p>
      حقائب أنيقة تناسب كل إطلالة ✨
    </p>

    <a href="#products" class="btn">
      اكتشفي الحقائب
    </a>
  </div>
</section>

<section class="products" id="products">

  <h2 class="section-title">أحدث الحقائب</h2>

  <div class="grid">

    <div class="card">

      <div class="product-image">
        صورة الشنطة #664
      </div>

      <div class="product-info">

        <h3>شنطة AMO #664</h3>

        <div class="price">
          15 دينار
        </div>

        <p style="margin-bottom:10px;">اختاري اللون:</p>

        <div class="colors">
          <button class="color black"
            onclick="orderWhatsApp('أسود')"></button>

          <button class="color beige"
            onclick="orderWhatsApp('بيج')"></button>

          <button class="color brown"
            onclick="orderWhatsApp('بني')"></button>
        </div>

        <button class="btn"
          onclick="orderWhatsApp('أسود')">
          اطلب عبر واتساب
        </button>

      </div>

    </div>

  </div>

</section>

<footer id="contact">
  <div class="logo">AMO</div>
  <p style="margin-top:10px;">
    متجر الحقائب
  </p>
</footer>

<script>

  /*
    ضعي رقم واتساب المتجر هنا لاحقًا
    مثال:
    9627XXXXXXXX
  */

  const whatsappNumber = "9627XXXXXXXX";

  function orderWhatsApp(color) {

    const message =
      "مرحباً AMO 👋%0A%0A" +
      "أرغب بطلب:%0A" +
      "المنتج: شنطة AMO #664%0A" +
      "اللون: " + color + "%0A" +
      "السعر: 15 دينار";

    window.open(
      "https://wa.me/" + whatsappNumber + "?text=" + message,
      "_blank"
    );
  }

</script>

</body>
</html>
