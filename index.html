<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMO | متجر الحقائب</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f8f6f1;
  color: #171717;
}

header {
  background: #111;
  color: white;
  padding: 18px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 4px;
}

nav a {
  color: white;
  text-decoration: none;
  margin-right: 20px;
}

.hero {
  padding: 70px 20px;
  text-align: center;
  background: #eee9df;
}

.hero h1 {
  font-size: 42px;
  margin-bottom: 18px;
}

.hero p {
  font-size: 18px;
  color: #555;
  margin-bottom: 28px;
}

.btn {
  display: inline-block;
  background: #111;
  color: white;
  padding: 14px 28px;
  border-radius: 30px;
  border: 0;
  cursor: pointer;
  font-size: 15px;
  text-decoration: none;
}

.products {
  padding: 55px 5%;
}

.section-title {
  text-align: center;
  font-size: 30px;
  margin-bottom: 40px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
  max-width: 1200px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.product-image {
  width: 100%;
  height: 430px;
  background: #eee;
  overflow: hidden;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.gallery {
  display: flex;
  gap: 8px;
  padding: 12px 18px;
  overflow-x: auto;
}

.gallery img {
  width: 65px;
  height: 65px;
  min-width: 65px;
  object-fit: cover;
  border-radius: 9px;
  cursor: pointer;
  border: 2px solid transparent;
}

.gallery img.active {
  border-color: #111;
}

.product-info {
  padding: 20px;
}

.product-info h3 {
  font-size: 24px;
  margin-bottom: 14px;
}
