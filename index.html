<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AMO | حقائب نسائية</title>
  <meta name="description" content="AMO - متجر حقائب نسائية">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #111111;
      --white: #ffffff;
      --bg: #f7f6f3;
      --text: #171717;
      --muted: #777;
      --border: #e8e6e2;
      --radius: 20px;
    }

    body {
      font-family: Arial, "Tahoma", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      height: 78px;
      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #111;
      text-decoration: none;
    }

    .cart-button {
      border: 0;
      background: #111;
      color: #fff;

      min-width: 145px;
      height: 50px;
      padding: 0 20px;

      border-radius: 28px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      font-size: 18px;
      font-weight: bold;
    }

    .cart-count {
      background: #fff;
      color: #111;

      width: 30px;
      height: 30px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 15px;
    }

    /* =========================
       MAIN
    ========================== */

    main {
      max-width: 1200px;
      margin: auto;
      padding: 35px 20px 70px;
    }

    .page-title {
      text-align: center;
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 25px;
    }

    /* =========================
       SEARCH
    ========================== */

    .search-area {
      max-width: 700px;
      margin: 0 auto 35px;
    }

    .search-box {
      height: 58px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 30px;

      display: flex;
      align-items: center;

      padding: 0 20px;

      box-shadow: 0 5px 20px rgba(0, 0, 0, .04);
    }

    .search-icon {
      font-size: 23px;
      margin-left: 12px;
      color: #666;
    }

    .search-box input {
      width: 100%;
      height: 100%;

      border: 0;
      outline: 0;
      background: transparent;

      font-size: 17px;
      color: #111;
    }

    .search-box input::placeholder {
      color: #999;
    }

    .clear-search {
      border: 0;
      background: transparent;
      font-size: 20px;
      color: #777;
      display: none;
    }

    .results-count {
      text-align: center;
      margin-top: 10px;
      color: #888;
      font-size: 14px;
    }

    /* =========================
       PRODUCTS
    ========================== */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .product-card {
      background: #fff;
      border-radius: var(--radius);
      overflow: hidden;

      border: 1px solid #eee;

      transition:
        transform .2s ease,
        box-shadow .2s ease;

      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .08);
    }

    .product-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 1.05;
      background: #f4f4f2;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;

      transition: transform .3s ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.025);
    }

    .product-number {
      position: absolute;
      top: 12px;
      right: 12px;

      background: rgba(255, 255, 255, .92);
      color: #111;

      padding: 6px 10px;
      border-radius: 15px;

      font-size: 12px;
      font-weight: bold;
    }

    .product-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-name {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 8px;
      cursor: pointer;
      line-height: 1.4;
    }

    .product-price {
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .product-meta {
      color: #777;
      font-size: 14px;
      line-height: 1.8;
      min-height: 25px;
    }

    .colors-title {
      margin-top: 10px;
      font-size: 14px;
      color: #777;
    }

    .color-list {
      display: flex;
      gap: 7px;
      margin-top: 7px;
      flex-wrap: wrap;
    }

    .color-option {
      width: 27px;
      height: 27px;

      border-radius: 50%;

      border: 2px solid #ddd;

      position: relative;
      padding: 0;
    }

    .color-option.active {
      border: 2px solid #111;
      box-shadow: 0 0 0 2px #fff inset;
    }

    .add-cart {
      width: 100%;
      height: 48px;

      border: 0;
      border-radius: 14px;

      background: #111;
      color: #fff;

      font-size: 16px;
      font-weight: bold;

      margin-top: 15px;

      transition: .2s;
    }

    .add-cart:hover {
      background: #292929;
    }

    /* =========================
       EMPTY
    ========================== */

    .empty-products {
      text-align: center;
      padding: 60px 20px;
      color: #777;
      display: none;
    }

    .empty-products .icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .empty-products h3 {
      color: #222;
      margin-bottom: 8px;
    }

    /* =========================
       PRODUCT MODAL
    ========================== */

    .modal {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, .65);

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 500;

      padding: 15px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: #fff;

      width: min(900px, 100%);
      max-height: 92vh;

      border-radius: 24px;

      overflow-y: auto;

      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      left: 15px;

      width: 42px;
      height: 42px;

      border-radius: 50%;
      border: 0;

      background: #111;
      color: #fff;

      font-size: 24px;

      z-index: 5;
    }

    .modal-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;

      padding: 30px;
    }

    .modal-main-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;

      border-radius: 18px;
      background: #f4f4f2;
    }

    .gallery {
      display: flex;
      gap: 8px;
      margin-top: 10px;

      overflow-x: auto;
    }

    .gallery img {
      width: 70px;
      height: 70px;

      object-fit: cover;

      border-radius: 10px;

      border: 2px solid transparent;

      cursor: pointer;
      flex-shrink: 0;
    }

    .gallery img.active {
      border-color: #111;
    }

    .modal-info {
      padding: 10px 0;
    }

    .modal-name {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .modal-price {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .detail-row {
      border-bottom: 1px solid #eee;
      padding: 12px 0;

      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .detail-label {
      color: #777;
    }

    .detail-value {
      font-weight: bold;
    }

    .modal-colors {
      margin-top: 20px;
    }

    .modal-colors h4 {
      margin-bottom: 10px;
    }

    .modal-color {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      border: 1px solid #ddd;
      background: #fff;

      padding: 7px 12px;

      border-radius: 20px;

      margin: 0 5px 5px 0;
    }

    .modal-color.active {
      border-color: #111;
    }

    .modal-color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }

    .modal-add {
      width: 100%;
      height: 52px;

      border: 0;
      border-radius: 15px;

      background: #111;
      color: #fff;

      font-size: 17px;
      font-weight: bold;

      margin-top: 25px;
    }

    /* =========================
       CART
    ========================== */

    .cart-drawer {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, .55);

      z-index: 700;

      display: none;
    }

    .cart-drawer.show {
      display: block;
    }

    .cart-panel {
      position: absolute;
      top: 0;
      right: 0;

      width: min(460px, 100%);
      height: 100%;

      background: #fff;

      display: flex;
      flex-direction: column;
    }

    .cart-header {
      height: 75px;
      padding: 0 20px;

      border-bottom: 1px solid #eee;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cart-header h2 {
      font-size: 23px;
    }

    .close-cart {
      width: 40px;
      height: 40px;

      border: 0;
      border-radius: 50%;

      background: #f1f1f1;

      font-size: 23px;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .cart-item {
      display: flex;
      gap: 12px;

      padding: 12px 0;

      border-bottom: 1px solid #eee;
    }

    .cart-item-image {
      width: 75px;
      height: 75px;

      border-radius: 12px;

      object-fit: cover;
      flex-shrink: 0;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .cart-item-color {
      color: #777;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .cart-item-price {
      font-weight: bold;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-top: 8px;
    }

    .quantity button {
      width: 30px;
      height: 30px;

      border: 1px solid #ddd;
      background: #fff;

      border-radius: 8px;
      font-size: 18px;
    }

    .quantity span {
      min-width: 20px;
      text-align: center;
    }

    .remove-item {
      border: 0;
      background: transparent;
      color: #999;
      font-size: 12px;
      margin-top: 5px;
    }

    .cart-footer {
      border-top: 1px solid #eee;
      padding: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .summary-total {
      font-size: 21px;
      font-weight: 900;
    }

    .checkout-button {
      width: 100%;
      height: 52px;

      border: 0;
      border-radius: 15px;

      background: #111;
      color: #fff;

      font-size: 17px;
      font-weight: bold;

      margin-top: 10px;
    }

    .empty-cart {
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }

    /* =========================
       CHECKOUT
    ========================== */

    .checkout {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, .65);

      z-index: 800;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 15px;
    }

    .checkout.show {
      display: flex;
    }

    .checkout-box {
      width: min(600px, 100%);
      max-height: 92vh;

      background: #fff;
      border-radius: 24px;

      overflow-y: auto;

      padding: 25px;
    }

    .checkout-title {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;

      height: 48px;

      border: 1px solid #ddd;
      border-radius: 12px;

      padding: 0 13px;

      outline: none;

      font-size: 15px;
      background: #fff;
    }

    .form-group textarea {
      height: 90px;
      padding-top: 12px;
      resize: none;
    }

    .checkout-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .cancel-checkout,
    .send-order {
      flex: 1;
      height: 50px;

      border-radius: 13px;

      font-weight: bold;
      font-size: 16px;
    }

    .cancel-checkout {
      background: #eee;
      border: 0;
    }

    .send-order {
      background: #111;
      color: #fff;
      border: 0;
    }

    /* =========================
       LOADING
    ========================== */

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }

    .loader {
      width: 40px;
      height: 40px;

      border: 4px solid #ddd;
      border-top-color: #111;

      border-radius: 50%;

      animation: spin .8s linear infinite;

      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 900px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {

      .header-inner {
        height: 70px;
        padding: 0 14px;
      }

      .logo {
        font-size: 34px;
      }

      .cart-button {
        min-width: 120px;
        height: 45px;
        font-size: 16px;
        padding: 0 13px;
      }

      .cart-count {
        width: 27px;
        height: 27px;
      }

      main {
        padding: 25px 12px 50px;
      }

      .page-title {
        font-size: 30px;
        margin-bottom: 20px;
      }

      .search-area {
        margin-bottom: 22px;
      }

      .search-box {
        height: 52px;
      }

      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .product-card {
        border-radius: 17px;
      }

      .product-image-wrap {
        aspect-ratio: 1 / 1.02;
      }

      .product-info {
        padding: 11px;
      }

      .product-name {
        font-size: 15px;
        margin-bottom: 5px;
      }

      .product-price {
        font-size: 18px;
        margin-bottom: 5px;
      }

      .product-meta {
        font-size: 12px;
        line-height: 1.6;
      }

      .colors-title {
        font-size: 12px;
        margin-top: 7px;
      }

      .color-option {
        width: 24px;
        height: 24px;
      }

      .add-cart {
        height: 42px;
        border-radius: 12px;
        font-size: 14px;
        margin-top: 10px;
      }

      .product-number {
        top: 8px;
        right: 8px;
        font-size: 10px;
        padding: 5px 8px;
      }

      .modal-content {
        grid-template-columns: 1fr;
        gap: 15px;
        padding: 20px;
      }

      .modal-name {
        font-size: 24px;
      }

      .modal-price {
        font-size: 21px;
      }
    }

    @media (max-width: 380px) {

      .products-grid {
        gap: 8px;
      }

      .product-info {
        padding: 9px;
      }

      .product-name {
        font-size: 14px;
      }

      .product-price {
        font-size: 17px;
      }

      .add-cart {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-inner">

    <button
      class="cart-button"
      onclick="openCart()"
    >
      <span
        class="cart-count"
        id="cartCount"
      >
        0
      </span>

      <span>
        السلة 🛒
      </span>
    </button>

    <a
      href="#"
      class="logo"
    >
      AMO
    </a>

  </div>

</header>


<main>

  <h1 class="page-title">
    أحدث الحقائب
  </h1>


  <!-- البحث -->

  <div class="search-area">

    <div class="search-box">

      <span class="search-icon">
        🔍
      </span>

      <input
        type="search"
        id="searchInput"
        placeholder="ابحثي باسم أو رقم المنتج..."
        autocomplete="off"
      >

      <button
        class="clear-search"
        id="clearSearch"
        onclick="clearSearch()"
      >
        ✕
      </button>

    </div>

    <div
      class="results-count"
      id="resultsCount"
    ></div>

  </div>


  <!-- المنتجات -->

  <div
    class="loading"
    id="loading"
  >

    <div class="loader"></div>

    <p>
      جاري تحميل الحقائب...
    </p>

  </div>


  <div
    class="products-grid"
    id="productsGrid"
  ></div>


  <div
    class="empty-products"
    id="emptyProducts"
  >

    <div class="icon">
      🔍
    </div>

    <h3>
      لم نجد هذا المنتج
    </h3>

    <p>
      جربي البحث باسم أو رقم آخر.
    </p>

  </div>

</main>


<!-- =========================
     تفاصيل المنتج
========================= -->

<div
  class="modal"
  id="productModal"
  onclick="closeModalOutside(event)"
>

  <div class="modal-box">

    <button
      class="close-modal"
      onclick="closeProductModal()"
    >
      ×
    </button>

    <div
      class="modal-content"
      id="modalContent"
    ></div>

  </div>

</div>


<!-- =========================
     السلة
========================= -->

<div
  class="cart-drawer"
  id="cartDrawer"
  onclick="closeCartOutside(event)"
>

  <div class="cart-panel">

    <div class="cart-header">

      <h2>
        سلة المشتريات 🛒
      </h2>

      <button
        class="close-cart"
        onclick="closeCart()"
      >
        ×
      </button>

    </div>


    <div
      class="cart-items"
      id="cartItems"
    ></div>


    <div
      class="cart-footer"
      id="cartFooter"
    ></div>

  </div>

</div>


<!-- =========================
     الدفع / معلومات التوصيل
========================= -->

<div
  class="checkout"
  id="checkoutModal"
>

  <div class="checkout-box">

    <h2 class="checkout-title">
      معلومات التوصيل
    </h2>


    <div class="form-group">

      <label>
        الاسم الكامل
      </label>

      <input
        type="text"
        id="customerName"
        placeholder="اكتبي اسمك"
      >

    </div>


    <div class="form-group">

      <label>
        رقم الهاتف
      </label>

      <input
        type="tel"
        id="customerPhone"
        placeholder="07xxxxxxxx"
      >

    </div>


    <div class="form-group">

      <label>
        المحافظة
      </label>

      <select id="customerCity">

        <option value="">
          اختاري المحافظة
        </option>

        <option>عمان</option>
        <option>الزرقاء</option>
        <option>إربد</option>
        <option>البلقاء</option>
        <option>مادبا</option>
        <option>جرش</option>
        <option>عجلون</option>
        <option>الكرك</option>
        <option>الطفيلة</option>
        <option>معان</option>
        <option>العقبة</option>
        <option>المفرق</option>

      </select>

    </div>


    <div class="form-group">

      <label>
        العنوان بالتفصيل
      </label>

      <textarea
        id="customerAddress"
        placeholder="المنطقة، الشارع، أقرب نقطة دالة..."
      ></textarea>

    </div>


    <div class="form-group">

      <label>
        ملاحظات إضافية
      </label>

      <textarea
        id="customerNotes"
        placeholder="أي ملاحظات على الطلب..."
      ></textarea>

    </div>


    <div
      id="checkoutSummary"
      style="margin-top:20px;"
    ></div>


    <div class="checkout-actions">

      <button
        class="cancel-checkout"
        onclick="closeCheckout()"
      >
        رجوع
      </button>

      <button
        class="send-order"
        onclick="sendOrder()"
      >
        إرسال الطلب واتساب
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   الإعدادات
===================================================== */

const REPO_OWNER = "llvll0";
const REPO_NAME = "AMO";
const BRANCH = "main";

const WHATSAPP_NUMBER = "962790780914";

const DELIVERY_PRICE = 2;
const FREE_DELIVERY_FROM = 49;


/* =====================================================
   المتغيرات
===================================================== */

let allProducts = [];
let filteredProducts = [];

let cart = [];

let selectedProduct = null;
let selectedColor = null;


/* =====================================================
   LOCAL STORAGE
===================================================== */

function saveCart() {

  localStorage.setItem(
    "amo_cart",
    JSON.stringify(cart)
  );

}


function loadCart() {

  try {

    const saved =
      localStorage.getItem("amo_cart");

    if (saved) {

      cart = JSON.parse(saved);

      if (!Array.isArray(cart)) {
        cart = [];
      }

    }

  } catch (error) {

    cart = [];

  }

}


/* =====================================================
   IMAGE URL
===================================================== */

function makeImageUrl(
  path,
  folder = ""
) {

  if (!path) {
    return "";
  }

  path = String(path).trim();

  if (
    path.startsWith("http://") ||
    path.startsWith("https://") ||
    path.startsWith("data:")
  ) {

    return path;

  }

  path = path.replace(/^\/+/, "");

  if (folder) {

    return `https://${REPO_OWNER}.github.io/${REPO_NAME}/products-new/${encodeURIComponent(folder)}/${path}`;

  }

  if (
    path.startsWith("products/")
  ) {

    return `https://${REPO_OWNER}.github.io/${REPO_NAME}/${path}`;

  }

  if (
    path.startsWith("images/")
  ) {

    return `https://${REPO_OWNER}.github.io/${REPO_NAME}/${path}`;

  }

  return `https://${REPO_OWNER}.github.io/${REPO_NAME}/images/${path}`;

}


/* =====================================================
   NORMALIZE PRODUCT
===================================================== */

function normalizeProduct(
  product,
  folder = ""
) {

  if (!product) {
    return null;
  }

  const p = {
    ...product
  };


  p.id =
    String(
      p.id ??
      p.productId ??
      p.number ??
      ""
    );


  p.name =
    p.name ||
    `شنطة AMO #${p.id}`;


  p.price =
    Number(p.price) || 0;


  p.image =
    p.image ||
    p.mainImage ||
    (
      Array.isArray(p.gallery)
        ? p.gallery[0]
        : ""
    );


  if (!Array.isArray(p.gallery)) {

    p.gallery =
      p.image
        ? [p.image]
        : [];

  }


  p.gallery =
    p.gallery
      .filter(Boolean)
      .map(
        img =>
          makeImageUrl(
            img,
            folder
          )
      );


  p.image =
    makeImageUrl(
      p.image,
      folder
    );


  if (
    !p.image &&
    p.gallery.length
  ) {

    p.image =
      p.gallery[0];

  }


  if (!Array.isArray(p.colors)) {
    p.colors = [];
  }


  p.colors =
    p.colors.map(
      color => ({

        ...color,

        name:
          color.name ||
          "لون",

        value:
          color.value ||
          "#ddd",

        image:
          color.image
            ? makeImageUrl(
                color.image,
                folder
              )
            : p.image

      })
    );


  if (!Array.isArray(p.sizes)) {

    p.sizes =
      p.size
        ? [p.size]
        : [];

  }


  p.folder = folder;

  return p;

}


/* =====================================================
   المنتجات القديمة
===================================================== */

async function loadOldProducts() {

  const url =
    `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/products.js?cache=${Date.now()}`;


  try {

    const response =
      await fetch(url);


    if (!response.ok) {
      return [];
    }


    const code =
      await response.text();


    const factory =
      new Function(
        code +
        `
        return (
          typeof products !== "undefined"
            ? products
            : typeof PRODUCTS !== "undefined"
              ? PRODUCTS
              : typeof productList !== "undefined"
                ? productList
                : []
        );
        `
      );


    const data =
      factory();


    if (!Array.isArray(data)) {
      return [];
    }


    return data
      .map(
        product =>
          normalizeProduct(product)
      )
      .filter(Boolean);


  } catch (error) {

    console.warn(
      "Old products error:",
      error
    );

    return [];

  }

}


/* =====================================================
   المنتجات الجديدة
===================================================== */

async function loadNewProducts() {

  const api =
    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/products-new?ref=${BRANCH}`;


  try {

    const response =
      await fetch(api);


    if (!response.ok) {
      return [];
    }


    const folders =
      await response.json();


    if (!Array.isArray(folders)) {
      return [];
    }


    const productFolders =
      folders.filter(
        item =>
          item.type === "dir"
      );


    const results = [];


    for (
      const folder of productFolders
    ) {

      try {

        /*
          مهم:
          لا نضيف ?ref=main
          إلى folder.url
        */

        const folderResponse =
          await fetch(folder.url);


        if (!folderResponse.ok) {
          continue;
        }


        const files =
          await folderResponse.json();


        const productFile =
          files.find(
            file =>
              file.type === "file" &&
              file.name
                .toLowerCase() ===
                "product.js"
          );


        if (!productFile) {
          continue;
        }


        const productResponse =
          await fetch(
            productFile.download_url
          );


        if (!productResponse.ok) {
          continue;
        }


        const code =
          await productResponse.text();


        const factory =
          new Function(
            code +
            `
            return (
              typeof product !== "undefined"
                ? product
                : typeof PRODUCT !== "undefined"
                  ? PRODUCT
                  : null
            );
            `
          );


        const product =
          factory();


        if (!product) {
          continue;
        }


        const normalized =
          normalizeProduct(
            product,
            folder.name
          );


        if (normalized) {
          results.push(
            normalized
          );
        }


      } catch (error) {

        console.warn(
          "Product folder error:",
          folder.name,
          error
        );

      }

    }


    return results;


  } catch (error) {

    console.warn(
      "New products error:",
      error
    );

    return [];

  }

}


/* =====================================================
   تحميل كل المنتجات
===================================================== */

async function loadProducts() {

  const loading =
    document.getElementById(
      "loading"
    );


  try {

    const [
      oldProducts,
      newProducts
    ] =
      await Promise.all([
        loadOldProducts(),
        loadNewProducts()
      ]);


    const map =
      new Map();


    oldProducts.forEach(
      product =>
        map.set(
          String(product.id),
          product
        )
    );


    newProducts.forEach(
      product =>
        map.set(
          String(product.id),
          product
        )
    );


    allProducts =
      Array.from(
        map.values()
      );


    allProducts.sort(
      (a, b) => {

        const aId =
          parseInt(a.id) || 0;

        const bId =
          parseInt(b.id) || 0;

        return bId - aId;

      }
    );


    filteredProducts =
      [...allProducts];


    loading.style.display =
      "none";


    renderProducts();


  } catch (error) {

    console.error(error);


    loading.innerHTML = `
      <p>
        حدث خطأ أثناء تحميل المنتجات.
        <br>
        حاولي تحديث الصفحة.
      </p>
    `;

  }

}

   البحث
===================================================== */

const searchInput =
  document.getElementById(
    "searchInput"
  );


const clearSearchButton =
  document.getElementById(
    "clearSearch"
  );


searchInput.addEventListener(
  "input",
  function () {

    const query =
      this.value
        .trim()
        .toLowerCase();


    clearSearchButton.style.display =
      query
        ? "block"
        : "none";


    if (!query) {

      filteredProducts =
        [...allProducts];

    } else {

      filteredProducts =
        allProducts.filter(
          product => {

            const text =
              [
                product.name,
                product.id,
                product.number,

                ...(product.colors || [])
                  .map(
                    c =>
                      c.name
                  )
              ]
              .join(" ")
              .toLowerCase();


            return text.includes(
              query
            );

          }
        );

    }


    renderProducts();

  }
);


function clearSearch() {

  searchInput.value = "";

  clearSearchButton.style.display =
    "none";


  filteredProducts =
    [...allProducts];


  renderProducts();


  searchInput.focus();

}


/* =====================================================
   اختيار اللون من بطاقة المنتج
===================================================== */

function changeCardColor(
  productId,
  image,
  button
) {

  const card =
    button.closest(
      ".product-card"
    );


  if (!card) {
    return;
  }


  const img =
    card.querySelector(
      ".product-image"
    );


  if (img) {
    img.src = image;
  }


  /*
    إزالة التحديد
  */

  card
    .querySelectorAll(
      ".color-option"
    )
    .forEach(
      item => {

        item.classList.remove(
          "active"
        );

      }
    );


  /*
    تحديد اللون الجديد
  */

  button.classList.add(
    "active"
  );

}


/* =====================================================
   إضافة المنتج من البطاقة
   مع اللون المحدد
===================================================== */

function addToCartFromCard(
  productId,
  button
) {

  const card =
    button.closest(
      ".product-card"
    );


  if (!card) {
    return;
  }


  const product =
    allProducts.find(
      p =>
        String(p.id) ===
        String(productId)
    );


  if (!product) {
    return;
  }


  let selectedColor =
    null;


  /*
    نبحث عن دائرة اللون
    التي عليها active
  */

  const activeColor =
    card.querySelector(
      ".color-option.active"
    );


  if (activeColor) {

    const colorName =
      activeColor.dataset.colorName;


    selectedColor =
      product.colors.find(
        color =>
          String(color.name) ===
          String(colorName)
      );

  }


  /*
    إذا لم يكن للمنتج ألوان
    لا مشكلة
  */

  if (
    !selectedColor &&
    product.colors.length
  ) {

    selectedColor =
      product.colors[0];

  }


  /*
    إضافة اللون المختار
  */

  addToCart(
    productId,
    selectedColor
  );

}

  const product =
    allProducts.find(

        String(p.id) ===
        String(id)
    );


  if (!product) {
    return;
  }


  selectedProduct =
    product;


  selectedColor =

  renderProductModal();


  document
    .getElementById(

    )
    .classList.add(

  document.body.style.overflow =

}

/* =====================================================

===================================================== */

function changeModalImage(
  image,
  element
) {

  document
    .getElementById(
      "modalMainImage"
    )
    .src = image;


  document
    .querySelectorAll(
      ".gallery img"
    )
    .forEach(
      img =>
        img.classList.remove(
          "active"
        )
    );


  element.classList.add(
    "active"
  );

}


/* =====================================================
   اختيار اللون من التفاصيل
===================================================== */

function selectModalColor(
  index,
  button
) {

  selectedColor =
    selectedProduct.colors[
      index
    ];


  document
    .getElementById(
      "modalMainImage"
    )
    .src =
      selectedColor.image ||
      selectedProduct.image;


  document
    .querySelectorAll(
      ".modal-color"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );

}

/* =====================================================
   إضافة للسلة
===================================================== */

function addToCart(
  productId,
  color = null
) {

  const product =
    allProducts.find(
      p =>
        String(p.id) ===
        String(productId)
    );


  if (!product) {
    return;
  }


  /*
    اللون المختار
  */

  const colorName =
    color?.name ||
    "";


  const colorImage =
    color?.image ||
    product.image;


  /*
    نفس المنتج + نفس اللون
    = نفس السطر وزيادة الكمية
  */

  const existing =
    cart.find(
      item =>
        String(item.id) ===
          String(product.id) &&

        String(
          item.color || ""
        ) ===
          String(
            colorName || ""
          )
    );


  if (existing) {

    existing.quantity += 1;

  } else {

    cart.push({

      id: product.id,

      name: product.name,

      price: product.price,

      image: colorImage,

      color: colorName,

      quantity: 1

    });

  }


  saveCart();

  updateCartCount();

}


/* =====================================================
   عدد السلة
===================================================== */

function updateCartCount() {

  const count =
    cart.reduce(
      (
        sum,
        item
      ) =>
        sum +
        Number(
          item.quantity || 0
        ),
      0
    );


  document
    .getElementById(
      "cartCount"
    )
    .textContent =
      count;

}

/* =====================================================
   الكمية
===================================================== */

function changeQuantity(
  index,
  amount
) {

  if (!cart[index]) {
    return;
  }


  cart[index].quantity +=
    amount;


  if (
    cart[index].quantity <= 0
  ) {

    cart.splice(
      index,
      1
    );

  }


  saveCart();

  updateCartCount();

  renderCart();

}


/* =====================================================
   حذف منتج من السلة
===================================================== */

function removeCartItem(
  index
) {

  cart.splice(
    index,
    1
  );


  saveCart();

  updateCartCount();

  renderCart();

}


/* =====================================================
   المجموع
===================================================== */

function calculateSubtotal() {

  return cart.reduce(
    (
      sum,
      item
    ) =>
      sum +
      (
        Number(item.price) *
        Number(item.quantity)
      ),
    0
  );

}


/* =====================================================
   التوصيل
===================================================== */

function calculateDelivery(
  subtotal
) {

  return subtotal >=
    FREE_DELIVERY_FROM
      ? 0
      : DELIVERY_PRICE;

}

                    ${index},
                    1
                  )
                "
              >
                +
              </button>

            </div>


            <button
              type="button"
              class="remove-item"

              onclick="
                removeCartItem(
                  ${index}
                )
              "
            >
              حذف المنتج
            </button>

          </div>

        </div>

      `
    )
    .join("");


  const subtotal =
    calculateSubtotal();


  const delivery =
    calculateDelivery(
      subtotal
    );


  const total =
    subtotal +
    delivery;


  footer.innerHTML = `

    <div class="summary-row">

      <span>
        المجموع
      </span>

      <strong>
        ${formatPrice(
          subtotal
        )}
      </strong>

    </div>


    <div class="summary-row">

      <span>
        التوصيل
      </span>

      <strong>

        ${
          delivery === 0
            ? "مجاني"
            : formatPrice(
                delivery
              )
        }

      </strong>

    </div>


    <div
      class="summary-row summary-total"
    >

      <span>
        الإجمالي
      </span>

      <span>
        ${formatPrice(
          total
        )}
      </span>

    </div>


    ${
      delivery > 0
        ? `
          <div
            style="
              font-size:12px;
              color:#777;
              margin-top:5px;
            "
          >
            التوصيل مجاني للطلبات
            ${FREE_DELIVERY_FROM}
            د.أ فأكثر
          </div>
        `
        : ""
    }


    <button
      type="button"
      class="checkout-button"

      onclick="
        openCheckout()
      "
    >
      متابعة الطلب
    </button>

  `;

}


/* =====================================================
   صفحة معلومات التوصيل
===================================================== */

function openCheckout() {

  if (!cart.length) {
    return;
  }


  closeCart();


  renderCheckoutSummary();


  document
    .getElementById(
      "checkoutModal"
    )
    .classList.add(
      "show"
    );


  document.body.style.overflow =
    "hidden";

}


function closeCheckout() {

  document
    .getElementById(
      "checkoutModal"
    )
    .classList.remove(
      "show"
    );


  document.body.style.overflow =
    "";

}


/* =====================================================
   ملخص الطلب
===================================================== */

function renderCheckoutSummary() {

  const container =
    document.getElementById(
      "checkoutSummary"
    );


  const subtotal =
    calculateSubtotal();


  const delivery =
    calculateDelivery(
      subtotal
    );


  const total =
    subtotal +
    delivery;


  container.innerHTML = `

    <div
      style="
        background:#f7f7f5;
        padding:15px;
        border-radius:14px;
      "
    >

      <div class="summary-row">

        <span>
          المنتجات
        </span>

        <strong>
          ${formatPrice(
            subtotal
          )}
        </strong>

      </div>


      <div class="summary-row">

        <span>
          التوصيل
        </span>

        <strong>

          ${
            delivery === 0
              ? "مجاني"
              : formatPrice(
                  delivery
                )
          }

        </strong>

      </div>


      <div
        class="summary-row"

        style="
          font-size:19px;
          font-weight:900;
          margin-bottom:0;
        "
      >

        <span>
          الإجمالي
        </span>

        <span>
          ${formatPrice(
            total
          )}
        </span>

      </div>

    </div>

  `;

}


/* =====================================================
   إرسال الطلب إلى واتساب
===================================================== */

function sendOrder() {

  if (!cart.length) {
    return;
  }


  const name =
    document
      .getElementById(
        "customerName"
      )
      .value
      .trim();


  const phone =
    document
      .getElementById(
        "customerPhone"
      )
      .value
      .trim();


  const city =
    document
      .getElementById(
        "customerCity"
      )
      .value
      .trim();


  const address =
    document
      .getElementById(
        "customerAddress"
      )
      .value
      .trim();


  const notes =
    document
      .getElementById(
        "customerNotes"
      )
      .value
      .trim();


  if (!name) {

    alert(
      "يرجى كتابة الاسم."
    );

    return;

  }


  if (!phone) {

    alert(
      "يرجى كتابة رقم الهاتف."
    );

    return;

  }


  if (!city) {

    alert(
      "يرجى اختيار المحافظة."
    );

    return;

  }


  if (!address) {

    alert(
      "يرجى كتابة العنوان."
    );

    return;

  }


  const subtotal =
    calculateSubtotal();


  const delivery =
    calculateDelivery(
      subtotal
    );


  const total =
    subtotal +
    delivery;


  let message =
    "👜 *طلب جديد من متجر AMO*%0A";


  message +=
    "━━━━━━━━━━━━━━%0A";


  message +=
    `👤 الاسم: ${encodeURIComponent(
      name
    )}%0A`;


  message +=
    `📱 الهاتف: ${encodeURIComponent(
      phone
    )}%0A`;


  message +=
    `📍 المحافظة: ${encodeURIComponent(
      city
    )}%0A`;


  message +=
    `🏠 العنوان: ${encodeURIComponent(
      address
    )}%0A`;


  if (notes) {

    message +=
      `📝 الملاحظات: ${encodeURIComponent(
        notes
      )}%0A`;

  }


  message +=
    "%0A🛍️ *الطلب:*%0A";


  cart.forEach(
    (
      item,
      index
    ) => {

      message +=
        `${index + 1}. ${encodeURIComponent(
          item.name
        )}%0A`;


      message +=
        `   الكمية: ${item.quantity}%0A`;


      if (item.color) {

        message +=
          `   اللون: ${encodeURIComponent(
            item.color
          )}%0A`;

      }


      message +=
        `   السعر: ${item.price} د.أ%0A`;

    }
  );


  message +=
    "%0A━━━━━━━━━━━━━━%0A";


  message +=
    `💰 المجموع: ${subtotal.toFixed(
      2
    )} د.أ%0A`;


  message +=
    `🚚 التوصيل: ${
      delivery === 0
        ? "مجاني"
        : delivery.toFixed(2) +
          " د.أ"
    }%0A`;


  message +=
    `💵 *الإجمالي: ${total.toFixed(
      2
    )} د.أ*%0A`;


  const whatsappURL =
    `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;


  window.open(
    whatsappURL,
    "_blank"
  );

}


/* =====================================================
   أدوات مساعدة
===================================================== */

function formatPrice(
  price
) {

  return `
    ${Number(price).toFixed(2)}
    د.أ
  `;

}


function escapeHTML(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJS(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );

}
