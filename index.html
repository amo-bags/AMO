<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AMO | شنط نسائية</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f8f6f2;
      color: #222;
      direction: rtl;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* ================= HEADER ================= */

    header {
      background: #fff;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #111;
    }

    .cart-btn {
      border: none;
      background: #111;
      color: white;
      padding: 11px 18px;
      border-radius: 25px;
      font-size: 15px;
    }

    /* ================= HERO ================= */

    .hero {
      max-width: 1200px;
      margin: 25px auto;
      padding: 55px 20px;
      background: #e9e2d8;
      border-radius: 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #555;
      font-size: 17px;
    }

    /* ================= PRODUCTS ================= */

    .section {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-title {
      text-align: center;
      font-size: 28px;
      margin-bottom: 30px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 25px;
    }

    .product-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      transition: .25s;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-main-image {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .product-info {
      padding: 18px;
    }

    .product-info h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .details {
      color: #666;
      line-height: 1.8;
      font-size: 14px;
      margin-bottom: 12px;
    }

    /* ================= THUMBNAILS ================= */

    .thumbs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 10px 12px 5px;
      background: #fff;
    }

    .thumbs img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid transparent;
      flex-shrink: 0;
      cursor: zoom-in;
      transition: .2s;
    }

    .thumbs img:hover {
      border-color: #111;
      transform: scale(1.05);
    }

    .thumbs img.active {
      border-color: #111;
    }

    /* ================= COLORS ================= */

    .colors {
      margin: 12px 0;
    }

    .colors-title {
      font-size: 14px;
      margin-bottom: 8px;
      color: #555;
    }

    .color-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .color-option {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .color-option.selected {
      border-color: #111;
      box-shadow: 0 0 0 1px #111;
    }

    .color-dot {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      border: 1px solid #ccc;
    }

    /* ================= BUTTON ================= */

    .add-cart {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      margin-top: 10px;
    }

    .add-cart:hover {
      background: #333;
    }

    /* ================= CART ================= */

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 2000;
    }

    .overlay.active {
      display: block;
    }

    .cart {
      position: fixed;
      top: 0;
      right: -450px;
      width: min(430px, 100%);
      height: 100vh;
      background: white;
      z-index: 2100;
      transition: .3s;
      display: flex;
      flex-direction: column;
    }

    .cart.active {
      right: 0;
    }

    .cart-header {
      padding: 18px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .close-cart {
      border: none;
      background: transparent;
      font-size: 25px;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 75px;
      height: 85px;
      object-fit: cover;
      border-radius: 10px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .cart-item-meta {
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity button {
      width: 27px;
      height: 27px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 5px;
    }

    .delete-item {
      border: none;
      background: transparent;
      color: #b00020;
      font-size: 18px;
    }

    .cart-footer {
      padding: 18px;
      border-top: 1px solid #eee;
    }

    .continue-shopping {
      width: 100%;
      padding: 11px;
      border: 1px solid #111;
      background: white;
      border-radius: 9px;
      margin-bottom: 15px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    .final-total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* ================= FORM ================= */

    .checkout-form {
      padding: 15px;
      border-top: 1px solid #eee;
      max-height: 45vh;
      overflow-y: auto;
    }

    .checkout-form h3 {
      margin-bottom: 15px;
    }

    .checkout-form input,
    .checkout-form textarea,
    .checkout-form select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 10px;
      font-family: inherit;
      font-size: 14px;
    }

    .checkout-form textarea {
      resize: vertical;
      min-height: 70px;
    }

    .whatsapp-btn {
      width: 100%;
      border: none;
      background: #25d366;
      color: white;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 5px;
    }

    /* ================= LIGHTBOX ================= */

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.94);
      z-index: 5000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-image {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 8px;
      cursor: zoom-out;
    }

    .lightbox-close {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      color: white;
      font-size: 30px;
      z-index: 2;
    }

    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      color: white;
      font-size: 28px;
      z-index: 2;
    }

    .lightbox-prev {
      left: 15px;
    }

    .lightbox-next {
      right: 15px;
    }

    /* ================= FOOTER ================= */

    footer {
      text-align: center;
      padding: 35px 20px;
      color: #777;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      .hero {
        margin: 15px;
        padding: 40px 15px;
      }

      .hero h1 {
        font-size: 27px;
      }

      .section {
        padding: 0 12px;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-main-image {
        height: 230px;
      }

      .product-info {
        padding: 12px;
      }

      .product-info h3 {
        font-size: 17px;
      }

      .price {
        font-size: 18px;
      }

      .thumbs img {
        width: 50px;
        height: 50px;
      }

      .lightbox-image {
        max-width: 94vw;
        max-height: 82vh;
      }

      .lightbox-prev,
      .lightbox-next {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo">AMO</div>

      <button class="cart-btn" onclick="openCart()">
        🛒 السلة
        <span id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>اختاري شنطتك بستايلك الخاص</h1>
    <p>شنط AMO بتصاميم أنيقة تناسب كل إطلالة</p>
  </section>

  <!-- PRODUCTS -->
  <section class="section">
    <h2 class="section-title">أحدث الحقائب</h2>

    <div id="productsGrid" class="products-grid">
      <p style="text-align:center;width:100%;">جاري تحميل المنتجات...</p>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>AMO © جميع الحقوق محفوظة</p>
  </footer>


  <!-- CART OVERLAY -->
  <div id="overlay" class="overlay" onclick="closeCart()"></div>

  <!-- CART -->
  <aside id="cart" class="cart">

    <div class="cart-header">
      <h2>🛒 سلة التسوق</h2>
      <button class="close-cart" onclick="closeCart()">×</button>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="checkout-form">

      <h3>بيانات الطلب</h3>

      <input
        id="customerName"
        type="text"
        placeholder="الاسم الكامل"
      >

      <input
        id="customerPhone"
        type="tel"
        placeholder="رقم الهاتف"
      >

      <select id="customerCity">
        <option value="">اختر المحافظة</option>
        <option>عمّان</option>
        <option>الزرقاء</option>
        <option>إربد</option>
        <option>البلقاء</option>
        <option>الكرك</option>
        <option>الطفيلة</option>
        <option>معان</option>
        <option>العقبة</option>
        <option>مادبا</option>
        <option>جرش</option>
        <option>عجلون</option>
        <option>المفرق</option>
      </select>

      <textarea
        id="customerAddress"
        placeholder="العنوان بالتفصيل"
      ></textarea>

      <textarea
        id="customerNotes"
        placeholder="ملاحظات إضافية (اختياري)"
      ></textarea>

    </div>

    <div class="cart-footer">

      <button
        class="continue-shopping"
        onclick="closeCart()"
      >
        🛍️ إضافة المزيد من المنتجات
      </button>

      <div class="total-row">
        <span>مجموع المنتجات</span>
        <strong id="productsTotal">0.00 د.أ</strong>
      </div>

      <div class="total-row">
        <span>التوصيل</span>
        <strong id="deliveryTotal">0.00 د.أ</strong>
      </div>

      <div class="total-row final-total">
        <span>المجموع النهائي</span>
        <strong id="finalTotal">0.00 د.أ</strong>
      </div>

      <button
        class="whatsapp-btn"
        onclick="sendWhatsAppOrder()"
      >
        📱 إرسال الطلب عبر واتساب
      </button>

    </div>

  </aside>


  <!-- LIGHTBOX -->
  <div
    id="lightbox"
    class="lightbox"
    onclick="closeLightbox(event)"
  >

    <div class="lightbox-content">

      <button
        class="lightbox-close"
        onclick="closeLightbox()"
      >
        ×
      </button>

      <button
        class="lightbox-prev"
        onclick="previousLightboxImage(event)"
      >
        ‹
      </button>

      <img
        id="lightboxImage"
        class="lightbox-image"
        src=""
        alt="صورة المنتج"
        onclick="event.stopPropagation()"
      >

      <button
        class="lightbox-next"
        onclick="nextLightboxImage(event)"
      >
        ›
      </button>

    </div>

  </div>


<script>

/* =========================================================
   إعدادات
========================================================= */

const GITHUB_API =
  "https://api.github.com/repos/llvll0/AMO/contents/products?ref=main";

const WHATSAPP_NUMBER = "962790780914";

let products = [];
let cart = [];

let currentLightboxGallery = [];
let currentLightboxIndex = 0;


/* =========================================================
   تحميل المنتجات تلقائياً من مجلد products
========================================================= */

async function loadProducts() {

  const grid = document.getElementById("productsGrid");

  try {

    const response = await fetch(GITHUB_API);

    if (!response.ok) {
      throw new Error("GitHub API error");
    }

    const files = await response.json();

    const productFiles = files
      .filter(file =>
        file.name.startsWith("product-") &&
        file.name.endsWith(".js")
      )
      .sort((a, b) => {

        const idA =
          parseInt(a.name.match(/\d+/)?.[0] || 0);

        const idB =
          parseInt(b.name.match(/\d+/)?.[0] || 0);

        return idB - idA;
      });


    products = [];

    for (const file of productFiles) {

      try {

        const source =
          await fetch(file.download_url)
            .then(r => r.text());

        const product =
          new Function(
            source + "\nreturn product;"
          )();

        if (product && product.id) {
          products.push(product);
        }

      } catch (error) {

        console.error(
          "خطأ في تحميل المنتج:",
          file.name,
          error
        );

      }

    }


    renderProducts();

  } catch (error) {

    console.error(error);

    grid.innerHTML = `
      <p style="text-align:center;width:100%;">
        حدث خطأ أثناء تحميل المنتجات.
      </p>
    `;

  }
}


/* =========================================================
   عرض المنتجات
========================================================= */

function renderProducts() {

  const grid =
    document.getElementById("productsGrid");

  if (!products.length) {

    grid.innerHTML = `
      <p style="text-align:center;width:100%;">
        لا توجد منتجات حالياً.
      </p>
    `;

    return;
  }


  grid.innerHTML =
    products.map(product => {

      const gallery =
        product.gallery?.length
          ? product.gallery
          : [product.image];


      const colors =
        product.colors?.length
          ? product.colors
          : [];


      return `

        <article
          class="product-card"
          data-product-id="${product.id}"
        >

          <img
            id="main-image-${product.id}"
            class="product-main-image"
            src="${product.image}"
            alt="${escapeHtml(product.name)}"
            onclick="openProductLightbox('${product.id}', 0)"
          >


          <div class="thumbs">

            ${gallery.map((img, index) => `

              <img
                src="${img}"
                alt="${escapeHtml(product.name)}"
                class="${index === 0 ? "active" : ""}"
                onclick="changeImage('${product.id}', ${index}, '${escapeAttribute(img)}')"
              >

            `).join("")}

          </div>


          <div class="product-info">

            <h3>
              ${escapeHtml(product.name)}
            </h3>

            <div class="price">
              ${Number(product.price).toFixed(2)} د.أ
            </div>


            <div class="details">

              ${
                product.size
                  ? `الحجم: ${escapeHtml(product.size)}<br>`
                  : ""
              }

              ${
                product.dimensions
                  ? `الأبعاد: ${escapeHtml(product.dimensions)}`
                  : ""
              }

            </div>


            ${
              colors.length
                ? `

                  <div class="colors">

                    <div class="colors-title">
                      اللون:
                    </div>

                    <div
                      class="color-options"
                      id="colors-${product.id}"
                    >

                      ${colors.map((color, index) => `

                        <button
                          class="color-option ${index === 0 ? "selected" : ""}"
                          onclick="selectColor(
                            '${product.id}',
                            ${index}
                          )"
                          data-color-index="${index}"
                        >

                          <span
                            class="color-dot"
                            style="background:${color.value || "#ccc"}"
                          ></span>

                          <span>
                            ${escapeHtml(color.name)}
                          </span>

                        </button>

                      `).join("")}

                    </div>

                  </div>

                `
                : ""
            }


            <button
              class="add-cart"
              onclick="addToCart('${product.id}')"
            >
              أضف إلى السلة 🛒
            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================================================
   تغيير الصورة الرئيسية + فتحها مكبرة
========================================================= */

function changeImage(productId, index, imageUrl) {

  const mainImage =
    document.getElementById(
      `main-image-${productId}`
    );

  if (mainImage) {
    mainImage.src = imageUrl;
  }


  const card =
    document.querySelector(
      `[data-product-id="${productId}"]`
    );


  if (card) {

    card
      .querySelectorAll(".thumbs img")
      .forEach(img =>
        img.classList.remove("active")
      );

    const thumbnails =
      card.querySelectorAll(".thumbs img");

    if (thumbnails[index]) {
      thumbnails[index].classList.add("active");
    }

  }


  /*
    التعديل المهم:
    عند الضغط على الصورة الصغيرة
    تفتح الصورة مباشرة بالحجم الكبير
  */

  openProductLightbox(productId, index);
}


/* =========================================================
   اختيار اللون
========================================================= */

function selectColor(productId, colorIndex) {

  const product =
    products.find(p => p.id === productId);

  if (!product || !product.colors) {
    return;
  }


  const buttons =
    document.querySelectorAll(
      `#colors-${productId} .color-option`
    );


  buttons.forEach(btn =>
    btn.classList.remove("selected")
  );


  if (buttons[colorIndex]) {
    buttons[colorIndex].classList.add("selected");
  }


  const color =
    product.colors[colorIndex];

  if (color && color.image) {

    const mainImage =
      document.getElementById(
        `main-image-${productId}`
      );

    if (mainImage) {
      mainImage.src = color.image;
    }

  }

}


/* =========================================================
   فتح Lightbox
========================================================= */

function openProductLightbox(productId, index) {

  const product =
    products.find(p => p.id === productId);

  if (!product) {
    return;
  }


  currentLightboxGallery =
    product.gallery?.length
      ? product.gallery
      : [product.image];


  currentLightboxIndex = index || 0;


  showLightboxImage();


  document
    .getElementById("lightbox")
    .classList.add("active");


  document.body.style.overflow = "hidden";
}


/* =========================================================
   عرض الصورة داخل Lightbox
========================================================= */

function showLightboxImage() {

  const image =
    document.getElementById("lightboxImage");

  if (!image) {
    return;
  }


  if (!currentLightboxGallery.length) {
    return;
  }


  image.src =
    currentLightboxGallery[
      currentLightboxIndex
    ];
}


/* =========================================================
   الصورة السابقة
========================================================= */

function previousLightboxImage(event) {

  if (event) {
    event.stopPropagation();
  }


  if (!currentLightboxGallery.length) {
    return;
  }


  currentLightboxIndex--;

  if (currentLightboxIndex < 0) {
    currentLightboxIndex =
      currentLightboxGallery.length - 1;
  }


  showLightboxImage();
}


/* =========================================================
   الصورة التالية
========================================================= */

function nextLightboxImage(event) {

  if (event) {
    event.stopPropagation();
  }


  if (!currentLightboxGallery.length) {
    return;
  }


  currentLightboxIndex++;

  if (
    currentLightboxIndex >=
    currentLightboxGallery.length
  ) {
    currentLightboxIndex = 0;
  }


  showLightboxImage();
}


/* =========================================================
   إغلاق Lightbox
========================================================= */

function closeLightbox(event) {

  if (
    event &&
    event.target &&
    event.target.id !== "lightbox"
  ) {
    return;
  }


  document
    .getElementById("lightbox")
    .classList.remove("active");


  document.body.style.overflow = "";
}


/* =========================================================
   لوحة المفاتيح للصور
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    const lightbox =
      document.getElementById("lightbox");

    if (!lightbox.classList.contains("active")) {
      return;
    }


    if (event.key === "Escape") {
      closeLightbox();
    }


    if (event.key === "ArrowLeft") {
      previousLightboxImage();
    }


    if (event.key === "ArrowRight") {
      nextLightboxImage();
    }

  }
);


/* =========================================================
   السلة
========================================================= */

function addToCart(productId) {

  const product =
    products.find(p => p.id === productId);

  if (!product) {
    return;
  }


  const selectedColor =
    getSelectedColor(productId);


  const existing =
    cart.find(item =>
      item.productId === productId &&
      item.colorName ===
      (selectedColor?.name || "")
    );


  if (existing) {

    existing.quantity++;

  } else {

    cart.push({

      productId: product.id,

      name: product.name,

      price: Number(product.price),

      image:
        selectedColor?.image ||
        product.image,

      colorName:
        selectedColor?.name ||
        "",

      size:
        product.size ||
        "",

      dimensions:
        product.dimensions ||
        "",

      quantity: 1

    });

  }


  saveCart();

  renderCart();

  openCart();

}


/* =========================================================
   اللون المختار
========================================================= */

function getSelectedColor(productId) {

  const product =
    products.find(p => p.id === productId);

  if (!product || !product.colors?.length) {
    return null;
  }


  const selected =
    document.querySelector(
      `#colors-${productId} .color-option.selected`
    );


  if (!selected) {
    return product.colors[0];
  }


  const index =
    Number(
      selected.dataset.colorIndex
    );


  return product.colors[index] ||
    product.colors[0];

}


/* =========================================================
   حفظ السلة
========================================================= */

function saveCart() {

  localStorage.setItem(
    "amo_cart",
    JSON.stringify(cart)
  );

}


/* =========================================================
   تحميل السلة
========================================================= */

function loadCart() {

  try {

    const saved =
      localStorage.getItem("amo_cart");

    cart =
      saved
        ? JSON.parse(saved)
        : [];

  } catch {

    cart = [];

  }

}


/* =========================================================
   عرض السلة
========================================================= */

function renderCart() {

  const container =
    document.getElementById("cartItems");

  if (!cart.length) {

    container.innerHTML = `
      <div
        style="
          text-align:center;
          padding:40px 10px;
          color:#777;
        "
      >
        السلة فارغة 🛍️
      </div>
    `;

  } else {

    container.innerHTML =
      cart.map((item, index) => `

        <div class="cart-item">

          <img
            src="${item.image}"
            alt="${escapeHtml(item.name)}"
          >

          <div class="cart-item-info">

            <div class="cart-item-title">
              ${escapeHtml(item.name)}
            </div>

            <div class="cart-item-meta">

              ${
                item.colorName
                  ? `اللون: ${escapeHtml(item.colorName)}<br>`
                  : ""
              }

              ${
                item.size
                  ? `الحجم: ${escapeHtml(item.size)}<br>`
                  : ""
              }

              ${
                item.dimensions
                  ? `الأبعاد: ${escapeHtml(item.dimensions)}<br>`
                  : ""
              }

              السعر:
              ${item.price.toFixed(2)} د.أ

            </div>


            <div class="quantity">

              <button
                onclick="changeQuantity(${index}, -1)"
              >
                −
              </button>

              <span>
                ${item.quantity}
              </span>

              <button
                onclick="changeQuantity(${index}, 1)"
              >
                +
              </button>

              <button
                class="delete-item"
                onclick="removeFromCart(${index})"
              >
                🗑️
              </button>

            </div>

          </div>

        </div>

      `).join("");

  }


  updateCartTotals();

}


/* =========================================================
   تغيير الكمية
========================================================= */

function changeQuantity(index, change) {

  if (!cart[index]) {
    return;
  }


  cart[index].quantity += change;


  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }


  saveCart();

  renderCart();

}


/* =========================================================
   حذف المنتج
========================================================= */

function removeFromCart(index) {

  cart.splice(index, 1);

  saveCart();

  renderCart();

}


/* =========================================================
   حساب الإجمالي
========================================================= */

function calculateProductsTotal() {

  return cart.reduce(
    (total, item) =>
      total +
      item.price *
      item.quantity,
    0
  );

}


/* =========================================================
   التوصيل
========================================================= */

function calculateDelivery(total) {

  if (total <= 0) {
    return 0;
  }


  return total >= 49
    ? 0
    : 2;

}


/* =========================================================
   تحديث إجماليات السلة
========================================================= */

function updateCartTotals() {

  const productsTotal =
    calculateProductsTotal();


  const delivery =
    calculateDelivery(productsTotal);


  const finalTotal =
    productsTotal + delivery;


  document.getElementById(
    "productsTotal"
  ).textContent =
    productsTotal.toFixed(2) + " د.أ";


  document.getElementById(
    "deliveryTotal"
  ).textContent =
    delivery === 0
      ? "مجاني"
      : delivery.toFixed(2) + " د.أ";


  document.getElementById(
    "finalTotal"
  ).textContent =
    finalTotal.toFixed(2) + " د.أ";


  document.getElementById(
    "cartCount"
  ).textContent =
    cart.reduce(
      (sum, item) =>
        sum + item.quantity,
      0
    );

}


/* =========================================================
   فتح السلة
========================================================= */

function openCart() {

  document
    .getElementById("cart")
    .classList.add("active");


  document
    .getElementById("overlay")
    .classList.add("active");


  document.body.style.overflow = "hidden";

}


/* =========================================================
   إغلاق السلة
========================================================= */

function closeCart() {

  document
    .getElementById("cart")
    .classList.remove("active");


  document
    .getElementById("overlay")
    .classList.remove("active");


  document.body.style.overflow = "";

}

        : delivery.toFixed(2) + " د.أ"

  message +=

      `%0A📝 *ملاحظات:* ${encodeURIComponent(notes)}%0A`;

  }


  message +=
    "%0Aشكراً لطلبك من AMO 🤍";


  const url =
    `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;


  window.open(
    url,
    "_blank"
  );

}


/* =========================================================
   حماية النصوص
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}


/* =========================================================
   تشغيل الموقع
========================================================= */

loadCart();

renderCart();

loadProducts();

</script>
