<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AMO | شنط نسائية</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f8f6f2;
    color:#222;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =====================================================
   HEADER
===================================================== */

header{
    background:#fff;
    border-bottom:1px solid #eee;

    position:sticky;
    top:0;

    z-index:1000;
}

.header{
    max-width:1200px;
    margin:auto;

    padding:14px 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
}

.cart-button{
    background:#111;
    color:#fff;

    border:0;
    border-radius:25px;

    padding:11px 18px;

    font-size:15px;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    max-width:1200px;

    margin:20px auto;

    padding:55px 20px;

    background:#e9e2d8;

    border-radius:20px;

    text-align:center;
}

.hero h1{
    font-size:34px;
    margin-bottom:12px;
}

.hero p{
    color:#555;
    font-size:17px;
}


/* =====================================================
   PRODUCTS
===================================================== */

.products-section{
    max-width:1200px;

    margin:40px auto;

    padding:0 18px;
}

.section-title{
    text-align:center;

    font-size:28px;

    margin-bottom:30px;
}

.products-grid{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(250px,1fr));

    gap:22px;
}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card{

    background:#fff;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
}

.main-product-image{

    width:100%;

    height:320px;

    object-fit:cover;

    display:block;

    cursor:zoom-in;
}


/* =====================================================
   THUMBNAILS
===================================================== */

.thumbnails{

    display:flex;

    gap:7px;

    padding:10px;

    overflow-x:auto;

    background:#fff;
}

.thumbnails img{

    width:58px;
    height:58px;

    object-fit:cover;

    border-radius:8px;

    border:2px solid transparent;

    flex-shrink:0;

    cursor:zoom-in;

    transition:.2s;
}

.thumbnails img:hover{

    transform:scale(1.05);

    border-color:#111;
}

.thumbnails img.active{

    border-color:#111;
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info{

    padding:17px;
}

.product-name{

    font-size:20px;

    font-weight:bold;

    margin-bottom:8px;
}

.product-price{

    font-size:21px;

    font-weight:bold;

    margin-bottom:12px;
}

.product-details{

    color:#666;

    line-height:1.9;

    font-size:14px;

    margin-bottom:12px;
}


/* =====================================================
   COLORS
===================================================== */

.colors-title{

    font-size:14px;

    color:#555;

    margin-bottom:7px;
}

.colors{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-bottom:10px;
}

.color-button{

    display:flex;

    align-items:center;

    gap:6px;

    border:1px solid #ddd;

    background:#fff;

    border-radius:20px;

    padding:6px 10px;

    font-size:13px;
}

.color-button.selected{

    border-color:#111;

    box-shadow:
        0 0 0 1px #111;
}

.color-circle{

    width:17px;
    height:17px;

    border-radius:50%;

    border:1px solid #ccc;
}


/* =====================================================
   ADD CART
===================================================== */

.add-cart{

    width:100%;

    border:0;

    background:#111;

    color:#fff;

    padding:13px;

    border-radius:10px;

    font-size:15px;

    margin-top:5px;
}

.add-cart:active{

    transform:scale(.98);
}


/* =====================================================
   CART OVERLAY
===================================================== */

.cart-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.5);

    display:none;

    z-index:3000;
}

.cart-overlay.show{

    display:block;
}


/* =====================================================
   CART
===================================================== */

.cart{

    position:fixed;

    top:0;

    right:-460px;

    width:min(450px,100%);

    height:100vh;

    background:#fff;

    z-index:3100;

    display:flex;

    flex-direction:column;

    transition:.3s;
}

.cart.show{

    right:0;
}

.cart-header{

    padding:17px;

    border-bottom:1px solid #eee;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.cart-header h2{

    font-size:20px;
}

.close-cart{

    border:0;

    background:transparent;

    font-size:30px;
}


/* =====================================================
   CART ITEMS
===================================================== */

.cart-items{

    flex:1;

    overflow-y:auto;

    padding:15px;
}

.empty-cart{

    text-align:center;

    color:#777;

    padding:50px 10px;
}

.cart-item{

    display:flex;

    gap:10px;

    padding:12px 0;

    border-bottom:1px solid #eee;
}

.cart-item-image{

    width:75px;
    height:85px;

    object-fit:cover;

    border-radius:10px;
}

.cart-item-info{

    flex:1;
}

.cart-item-name{

    font-weight:bold;

    margin-bottom:5px;
}

.cart-item-details{

    color:#777;

    font-size:13px;

    line-height:1.7;
}

.quantity{

    display:flex;

    align-items:center;

    gap:8px;

    margin-top:8px;
}

.quantity button{

    width:28px;
    height:28px;

    border:1px solid #ddd;

    background:#fff;

    border-radius:6px;
}

.delete-button{

    margin-right:auto;

    border:0;

    background:transparent;

    color:#b00020;

    font-size:18px;
}


/* =====================================================
   CHECKOUT
===================================================== */

.checkout{

    border-top:1px solid #eee;

    padding:15px;

    max-height:46vh;

    overflow-y:auto;
}

.checkout h3{

    margin-bottom:13px;
}

.checkout input,
.checkout textarea,
.checkout select{

    width:100%;

    padding:12px;

    border:1px solid #ddd;

    border-radius:9px;

    margin-bottom:10px;

    font-size:14px;

    outline:none;
}

.checkout textarea{

    min-height:75px;

    resize:vertical;
}


/* =====================================================
   CART FOOTER
===================================================== */

.cart-footer{

    padding:15px;

    border-top:1px solid #eee;
}

.continue-shopping{

    width:100%;

    padding:11px;

    background:#fff;

    border:1px solid #111;

    border-radius:9px;

    margin-bottom:12px;
}

.total-line{

    display:flex;

    justify-content:space-between;

    margin-bottom:7px;
}

.final-total{

    font-size:20px;

    font-weight:bold;

    margin-top:10px;
}

.delivery-note{

    text-align:center;

    background:#f4f0e8;

    padding:10px;

    border-radius:10px;

    margin:10px 0;

    font-size:14px;
}

.checkout-button{

    width:100%;

    border:0;

    background:#111;

    color:#fff;

    padding:14px;

    border-radius:9px;

    font-size:16px;

    font-weight:bold;
}


/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.95);

    z-index:6000;

    display:none;

    align-items:center;

    justify-content:center;
}

.lightbox.show{

    display:flex;
}

.lightbox-image{

    max-width:90vw;

    max-height:88vh;

    object-fit:contain;

    border-radius:8px;
}

.lightbox-close{

    position:absolute;

    top:15px;

    right:15px;

    width:45px;
    height:45px;

    border:0;

    border-radius:50%;

    background:rgba(255,255,255,.15);

    color:#fff;

    font-size:30px;
}

.lightbox-prev,
.lightbox-next{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    width:50px;
    height:50px;

    border:0;

    border-radius:50%;

    background:rgba(255,255,255,.15);

    color:#fff;

    font-size:30px;
}

.lightbox-prev{

    left:15px;
}

.lightbox-next{

    right:15px;
}


/* =====================================================
   CONFIRMATION MODAL
===================================================== */

.confirm-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.65);

    z-index:7000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;
}

.confirm-overlay.show{

    display:flex;
}

.confirm-box{

    width:min(500px,100%);

    max-height:90vh;

    overflow-y:auto;

    background:#fff;

    border-radius:20px;

    padding:20px;
}

.confirm-title{

    text-align:center;

    font-size:24px;

    margin-bottom:8px;
}

.confirm-subtitle{

    text-align:center;

    color:#777;

    margin-bottom:20px;
}

.confirm-product{

    display:flex;

    gap:12px;

    padding:12px 0;

    border-bottom:1px solid #eee;
}

.confirm-product img{

    width:70px;
    height:80px;

    object-fit:cover;

    border-radius:10px;
}

.confirm-product-info{

    flex:1;
}

.confirm-product-name{

    font-weight:bold;

    margin-bottom:5px;
}

.confirm-product-details{

    color:#666;

    font-size:13px;

    line-height:1.7;
}

.confirm-customer{

    background:#f7f5f1;

    border-radius:12px;

    padding:13px;

    margin-top:15px;

    line-height:1.9;

    font-size:14px;
}

.confirm-totals{

    margin-top:15px;

    padding-top:12px;

    border-top:1px solid #ddd;
}

.confirm-total-line{

    display:flex;

    justify-content:space-between;

    margin-bottom:8px;
}

.confirm-final{

    font-size:21px;

    font-weight:bold;

    margin-top:10px;
}

.confirm-actions{

    display:flex;

    gap:10px;

    margin-top:18px;
}

.confirm-edit{

    flex:1;

    border:1px solid #111;

    background:#fff;

    padding:13px;

    border-radius:10px;

    font-size:15px;
}

.confirm-send{

    flex:1;

    border:0;

    background:#25d366;

    color:#fff;

    padding:13px;

    border-radius:10px;

    font-size:15px;

    font-weight:bold;
}


/* =====================================================
   SUCCESS
===================================================== */

.success-box{

    text-align:center;

    padding:25px 10px;
}

.success-icon{

    font-size:55px;

    margin-bottom:10px;
}

.success-title{

    font-size:25px;

    font-weight:bold;

    margin-bottom:10px;
}

.success-text{

    color:#666;

    line-height:1.8;

    margin-bottom:20px;
}

.success-close{

    width:100%;

    border:0;

    background:#111;

    color:#fff;

    padding:13px;

    border-radius:10px;

    font-size:16px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .hero{

        margin:15px;

        padding:40px 15px;
    }

    .hero h1{

        font-size:27px;
    }

    .products-section{

        padding:0 10px;
    }

    .products-grid{

        grid-template-columns:
            repeat(2,1fr);

        gap:10px;
    }

    .main-product-image{

        height:230px;
    }

    .product-info{

        padding:11px;
    }

    .product-name{

        font-size:16px;
    }

    .product-price{

        font-size:18px;
    }

    .thumbnails img{

        width:50px;
        height:50px;
    }

    .lightbox-image{

        max-width:94vw;

        max-height:82vh;
    }

    .lightbox-prev,
    .lightbox-next{

        width:42px;
        height:42px;

        font-size:25px;
    }

    .confirm-actions{

        flex-direction:column;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header">

        <div class="logo">
            AMO

        <button

            🛒 السلة

            <span id="cartCount">

<!-- =====================================================

<section class="hero">

<section class="products-section">

<!-- =====================================================

<div

    <div

<script>

/* =====================================================
   SETTINGS
===================================================== */

const PRODUCTS_API =
"https://api.github.com/repos/llvll0/AMO/contents/products?ref=main";

const WHATSAPP =
"962790780914";

const CART_STORAGE_KEY =
"amo_cart_v2";


/* =====================================================
   VARIABLES
===================================================== */

let products = [];

let cart = [];

let lightboxGallery = [];

let lightboxIndex = 0;


/* =====================================================
   LOAD CART FROM DEVICE
===================================================== */

function loadCart(){

    try{

        const saved =
            localStorage.getItem(
                CART_STORAGE_KEY
            );


        if(saved){

            const parsed =
                JSON.parse(saved);


            if(Array.isArray(parsed)){

                cart = parsed;

            }else{

                cart = [];

            }

        }else{

            cart = [];

        }

    }catch(error){

        console.error(
            "Cart loading error:",
            error
        );

        cart = [];

    }

}


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(){

    try{

        localStorage.setItem(
            CART_STORAGE_KEY,
            JSON.stringify(cart)
        );

    }catch(error){

        console.error(
            "Cart saving error:",
            error
        );

    }

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const grid =
        document.getElementById(
            "productsGrid"
        );


    try{

        const response =
            await fetch(
                PRODUCTS_API
            );


        if(!response.ok){

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
            await response.json();


        const productFiles =
            files
            .filter(
                file =>
                    file.name.startsWith(
                        "product-"
                    ) &&
                    file.name.endsWith(
                        ".js"
                    )
            )
            .sort(
                (a,b)=>{

                    const aID =
                        parseInt(
                            a.name.match(
                                /\d+/
                            )?.[0] || 0
                        );


                    const bID =
                        parseInt(
                            b.name.match(
                                /\d+/
                            )?.[0] || 0
                        );


                    return bID-aID;

                }
            );


        products=[];


        for(
            const file
            of productFiles
        ){

            try{

                const source =
                    await fetch(
                        file.download_url
                    ).then(
                        r=>r.text()
                    );


                const product =
                    new Function(
                        source +
                        "\nreturn product;"
                    )();


                if(
                    product &&
                    product.id
                ){

                    normalizeProductImages(
                        product
                    );


                    products.push(
                        product
                    );

                }

            }catch(error){

                console.error(
                    "Product error:",
                    file.name,
                    error
                );

            }

        }


        renderProducts();

        renderCart();


    }catch(error){

        console.error(error);


        grid.innerHTML = `

            <p
                style="
                text-align:center;
                width:100%;
                padding:30px;
                "
            >

                تعذر تحميل المنتجات

            </p>

        `;

    }

}


/* =====================================================
   IMAGE URL
===================================================== */

function normalizeImageUrl(url){

    if(!url){

        return "";

    }


    if(
        url.startsWith("http://") ||
        url.startsWith("https://")
    ){

        return url;

    }


    return (
        "https://llvll0.github.io/AMO/" +
        url.replace(/^\/+/,"")
    );

}


function normalizeProductImages(product){

    product.image =
        normalizeImageUrl(
            product.image
        );


    if(product.gallery){

        product.gallery =
            product.gallery.map(
                normalizeImageUrl
            );

    }


    if(product.colors){

        product.colors =
            product.colors.map(
                color=>({

                    ...color,

                    image:
                        normalizeImageUrl(
                            color.image
                        )

                })
            );

    }

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJS(value){

    return String(
        value ?? ""
    )
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    const grid =
        document.getElementById(
            "productsGrid"
        );


    if(!products.length){

        grid.innerHTML = `

            <p
                style="
                text-align:center;
                width:100%;
                padding:30px;
                "
            >

                لا توجد منتجات حالياً

            </p>

        `;

        return;

    }


    grid.innerHTML =
        products.map(
            product=>{

                const gallery =
                    product.gallery?.length
                    ? product.gallery
                    : [product.image];


                const colors =
                    product.colors?.length
                    ? product.colors
                    : [];


                return `

                    <article
                        class="product-card"
                        data-product-id="${escapeHTML(product.id)}"
                    >


                        <img
                            id="main-${escapeHTML(product.id)}"

/* =====================================================
   IMAGE CLICK
===================================================== */

function changeProductImage(
    productId,
    index
){

    const product =
        products.find(
            p=>p.id === productId
        );


    if(!product){

        return;

    }


    const gallery =
        product.gallery?.length
        ? product.gallery
        : [product.image];


    const image =
        gallery[index];


    const main =
        document.getElementById(
            `main-${productId}`
        );


    if(main && image){

        main.src = image;

    }


    const card =
        document.querySelector(
            `[data-product-id="${productId}"]`
        );


    if(card){

        const thumbs =
            card.querySelectorAll(
                ".thumbnails img"
            );


        thumbs.forEach(
            thumb =>
                thumb.classList.remove(
                    "active"
                )
        );


        if(thumbs[index]){

            thumbs[index]
                .classList.add(
                    "active"
                );

        }

    }


    openLightbox(
        productId,
        index
    );

}


/* =====================================================
   LIGHTBOX
===================================================== */

function openLightbox(
    productId,
    index
){

    const product =
        products.find(
            p=>p.id === productId
        );


    if(!product){

        return;

    }


    lightboxGallery =
        product.gallery?.length
        ? product.gallery
        : [product.image];


    lightboxIndex =
        Number(index) || 0;


    showLightboxImage();


    document
        .getElementById(
            "lightbox"
        )
        .classList.add(
            "show"
        );


    document.body.style.overflow =
        "hidden";

}


function showLightboxImage(){

    const image =
        document.getElementById(
            "lightboxImage"
        );


    if(
        !image ||
        !lightboxGallery.length
    ){

        return;

    }


    image.src =
        lightboxGallery[
            lightboxIndex
        ];

}


function nextImage(event){

    if(event){

        event.stopPropagation();

    }


    if(!lightboxGallery.length){

        return;

    }


    lightboxIndex++;


    if(
        lightboxIndex >=
        lightboxGallery.length
    ){

        lightboxIndex=0;

    }


    showLightboxImage();

}


function previousImage(event){

    if(event){

        event.stopPropagation();

    }


    if(!lightboxGallery.length){

        return;

    }


    lightboxIndex--;


    if(lightboxIndex<0){

        lightboxIndex =
            lightboxGallery.length-1;

    }


    showLightboxImage();

}


function closeLightbox(event){

    if(
        event &&
        event.target.id !==
        "lightbox"
    ){

        return;

    }


    document
        .getElementById(
            "lightbox"
        )
        .classList.remove(
            "show"
        );


    document.body.style.overflow =
        "";

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        const lightbox =
            document.getElementById(
                "lightbox"
            );


        if(
            !lightbox.classList.contains(
                "show"
            )
        ){

            return;

        }


        if(
            event.key ===
            "Escape"
        ){

            closeLightbox();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            previousImage();

        }


        if(
            event.key ===
            "ArrowRight"
        ){

            nextImage();

        }

    }
);


/* =====================================================
   COLOR
===================================================== */

function selectColor(
    productId,
    colorIndex
){

    const product =
        products.find(
            p=>p.id === productId
        );


    if(
        !product ||
        !product.colors
    ){

        return;

    }


    const buttons =
        document.querySelectorAll(
            `#colors-${productId} .color-button`
        );


    buttons.forEach(
        button =>
            button.classList.remove(
                "selected"
            )
    );


    if(buttons[colorIndex]){

        buttons[colorIndex]
            .classList.add(
                "selected"
            );

    }


    const color =
        product.colors[colorIndex];


    if(
        color &&
        color.image
    ){

        const main =
            document.getElementById(
                `main-${productId}`
            );


        if(main){

            main.src =
                color.image;

        }

    }

}


/* =====================================================
   GET COLOR
===================================================== */

function getSelectedColor(
    productId
){

    const product =
        products.find(
            p=>p.id === productId
        );


    if(
        !product ||
        !product.colors?.length
    ){

        return null;

    }


    const selected =
        document.querySelector(
            `#colors-${productId} .color-button.selected`
        );


    if(!selected){

        return product.colors[0];

    }


    const buttons =
        document.querySelectorAll(
            `#colors-${productId} .color-button`
        );


    const index =
        Array.from(buttons)
            .indexOf(selected);


    return (
        product.colors[index] ||
        product.colors[0]
    );

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(productId){

    const product =
        products.find(
            p=>p.id === productId
        );


    if(!product){

        return;

    }


    const color =
        getSelectedColor(
            productId
        );


    const colorName =
        color?.name || "";


    const existing =
        cart.find(
            item =>
                item.productId === productId &&
                item.colorName === colorName
        );


    if(existing){

        existing.quantity++;

    }else{

        cart.push({

            productId:
                product.id,

            name:
                product.name,

            price:
                Number(
                    product.price
                ),

            image:
                color?.image ||
                product.image,

            colorName:
                colorName,

            size:
                product.size || "",

            dimensions:
                product.dimensions || "",

            quantity:
                1

        });

    }


    saveCart();

    renderCart();

    openCart();

}

/* =====================================================
   QUANTITY
===================================================== */

function changeQuantity(
    index,
    change
){

    if(!cart[index]){

        return;

    }


    cart[index].quantity +=
        change;


    if(
        cart[index].quantity <= 0
    ){

        cart.splice(
            index,
            1
        );

    }


    saveCart();

    renderCart();

}


/* =====================================================
   REMOVE
===================================================== */

function removeCartItem(index){

    if(!cart[index]){

        return;

    }


    cart.splice(
        index,
        1
    );


    saveCart();

    renderCart();

}


/* =====================================================
   TOTAL
===================================================== */

function getProductsTotal(){

    return cart.reduce(
        (
            total,
            item
        ) =>
            total +
            item.price *
            item.quantity,

        0
    );

}


function getDelivery(
    total
){

    if(total <= 0){

        return 0;

    }


    return total >= 49
        ? 0
        : 2;

}


function updateTotals(){

    const productsTotal =
        getProductsTotal();


    const delivery =
        getDelivery(
            productsTotal
        );


    const finalTotal =
        productsTotal +
        delivery;


    document.getElementById(
        "productsTotal"
    ).textContent =
        productsTotal.toFixed(2) +
        " د.أ";


    document.getElementById(
        "deliveryTotal"
    ).textContent =
        delivery === 0
        ? "مجاني"
        : delivery.toFixed(2) +
          " د.أ";


    document.getElementById(
        "finalTotal"
    ).textContent =
        finalTotal.toFixed(2) +
        " د.أ";


    document.getElementById(
        "cartCount"
    ).textContent =
        cart.reduce(
            (
                total,
                item
            ) =>
                total +
                item.quantity,

            0
        );

}

        .classList.add(
            "show"
        );

}


/* =====================================================
   CLOSE SUCCESS
===================================================== */

function closeSuccess(){

    document
        .getElementById(
            "confirmOverlay"
        )
        .classList.remove(
            "show"
        );

}


/* =====================================================
   START
===================================================== */

loadCart();

renderCart();

loadProducts();

</script>

</body>

</html>
