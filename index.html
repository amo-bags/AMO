<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#111111">

  <title>AMO | حقائب نسائية</title>


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    :root {

      --black: #111111;
      --dark: #222222;
      --gray: #777777;
      --light-gray: #f5f5f5;
      --border: #e7e7e7;
      --white: #ffffff;
      --beige: #f4efe8;
      --green: #16844a;
      --danger: #c62828;

      --shadow:
        0 8px 30px rgba(0,0,0,.08);

      --radius: 18px;

    }


    html {
      height: 100%;
      overflow-x: hidden;
    }


    body {

      font-family:
        Arial,
        Tahoma,
        "Segoe UI",
        sans-serif;

      background: #fafafa;

      color: var(--black);

      min-height: 100%;

      overflow-x: hidden;

    }


    body.no-scroll {
      overflow: hidden;
      height: 100%;
    }


    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }


    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }


    img {
      max-width: 100%;
      display: block;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    header {

      position: sticky;

      top: 0;

      z-index: 1000;

      background:
        rgba(255,255,255,.97);

      backdrop-filter:
        blur(12px);

      border-bottom:
        1px solid var(--border);

    }


    .header-inner {

      max-width: 1250px;

      margin: auto;

      padding: 14px 18px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

    }


    .logo {

      font-size: 28px;

      font-weight: 900;

      letter-spacing: 4px;

    }


    .header-cart {

      border:
        1px solid var(--black);

      background:
        var(--black);

      color: white;

      border-radius: 14px;

      padding: 11px 16px;

      display: flex;

      align-items: center;

      gap: 8px;

      font-weight: 700;

    }


    .cart-count {

      min-width: 22px;

      height: 22px;

      border-radius: 50%;

      background: white;

      color: black;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      font-size: 12px;

      font-weight: 900;

    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {

      max-width: 1250px;

      margin: auto;

      padding: 35px 18px 20px;

    }


    .hero-box {

      background:
        var(--beige);

      border-radius: 25px;

      padding: 35px 25px;

      text-align: center;

    }


    .hero-box h1 {

      font-size:
        clamp(28px, 6vw, 50px);

      margin-bottom: 10px;

      font-weight: 900;

    }


    .hero-box p {

      color:
        var(--gray);

      font-size: 16px;

      line-height: 1.8;

    }


    /* =====================================================
       PRODUCTS
    ===================================================== */

    .products-section {

      max-width: 1250px;

      margin: auto;

      padding:
        20px 18px 130px;

    }


    .section-title {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 20px;

      gap: 15px;

    }


    .section-title h2 {

      font-size: 25px;

    }


    .products-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;

    }


    .product-card {

      background: white;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      overflow: hidden;

      box-shadow:
        0 4px 18px
        rgba(0,0,0,.035);

      transition:
        .2s ease;

    }


    .product-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        var(--shadow);

    }


    .product-image-wrap {

      position: relative;

      background: #f7f7f7;

      aspect-ratio: 1 / 1;

      overflow: hidden;

    }


    .product-image {

      width: 100%;

      height: 100%;

      object-fit: cover;

    }


    .product-info {

      padding: 15px;

    }


    .product-name {

      font-size: 17px;

      font-weight: 800;

      margin-bottom: 7px;

    }


    .product-price {

      font-size: 19px;

      font-weight: 900;

      margin-bottom: 13px;

    }


    .product-meta {

      color:
        var(--gray);

      font-size: 13px;

      line-height: 1.7;

      margin-bottom: 10px;

    }


    /* =====================================================
       COLORS
    ===================================================== */

    .colors-title {

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 8px;

    }


    .colors {

      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      margin-bottom: 13px;

    }


    .color-btn {

      width: 28px;

      height: 28px;

      border-radius: 50%;

      border:
        2px solid white;

      outline:
        1px solid #ccc;

      position: relative;

      transition:
        .2s;

    }


    .color-btn.active {

      outline:
        2px solid var(--black);

      transform:
        scale(1.08);

    }


    .color-btn::after {

      content: "";

      display: none;

      position: absolute;

      inset: 5px;

      border-radius: 50%;

      border:
        2px solid white;

    }


    .color-btn.active::after {

      display: block;

    }


    .selected-color-name {

      font-size: 12px;

      color:
        var(--gray);

      margin-bottom: 12px;

    }


    .add-button {

      width: 100%;

      background:
        var(--black);

      color: white;

      border: none;

      border-radius: 12px;

      padding: 13px;

      font-weight: 800;

      font-size: 14px;

    }


    .add-button:active {

      transform:
        scale(.98);

    }


    /* =====================================================
       FLOATING CART
    ===================================================== */

    .floating-cart {

      position: fixed;

      bottom: 18px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 900;

      width:
        min(92%, 470px);

      background:
        var(--black);

      color: white;

      border-radius: 18px;

      box-shadow:
        0 12px 40px
        rgba(0,0,0,.25);

      padding:
        13px 16px;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 10px;

    }


    .floating-cart.hidden {
      display: none;
    }


    .floating-cart-info {

      display: flex;

      align-items: center;

      gap: 10px;

    }


    .floating-cart-icon {

      font-size: 22px;

    }


    .floating-cart-text strong {

      display: block;

      font-size: 14px;

    }


    .floating-cart-text span {

      color: #ddd;

      font-size: 12px;

    }


    .floating-cart-total {

      font-weight: 900;

      white-space: nowrap;

    }


    /* =====================================================
       OVERLAY
    ===================================================== */

    .overlay {

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.52);

      z-index: 1500;

      display: none;

    }


    .overlay.show {

      display: block;

    }


    /* =====================================================
       CART DRAWER
       FIXED MOBILE VERSION
    ===================================================== */

    .cart-drawer {

      position: fixed;

      top: 0;

      right: 0;

      width:
        min(440px, 94vw);

      /*
       * مهم جدًا:
       * استخدام dvh للموبايل
       */
      height: 100dvh;

      min-height: 0;

      background: white;

      z-index: 1600;

      transform:
        translateX(110%);

      transition:
        transform .3s ease;

      display: flex;

      flex-direction: column;

      box-shadow:
        -10px 0 35px
        rgba(0,0,0,.15);

      /*
       * يمنع خروج أي شيء
       * خارج السلة
       */
      overflow: hidden;

    }


    .cart-drawer.open {

      transform:
        translateX(0);

    }


    /* =====================================================
       CART HEADER
    ===================================================== */

    .cart-header {

      flex:
        0 0 auto;

      height: 76px;

      padding:
        15px 18px;

      border-bottom:
        1px solid var(--border);

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 10px;

      background: white;

      z-index: 2;

    }


    .cart-header h2 {

      font-size: 22px;

    }


    .close-button {

      width: 42px;

      height: 42px;

      flex-shrink: 0;

      border-radius: 50%;

      border:
        1px solid var(--border);

      background: white;

      font-size: 22px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /* =====================================================
       CART BODY
       هذا الجزء هو الذي يتحرك
    ===================================================== */

    .cart-body {

      flex:
        1 1 0;

      min-height: 0;

      overflow-y: auto;

      overflow-x: hidden;

      padding: 15px;

      /*
       * تمرير ممتاز على Android
       */
      -webkit-overflow-scrolling:
        touch;

      overscroll-behavior:
        contain;

      scrollbar-width:
        thin;

    }


    .empty-cart {

      min-height: 45vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      color:
        var(--gray);

      gap: 10px;

    }


    .empty-cart-icon {

      font-size: 50px;

    }


    /* =====================================================
       CART ITEM
    ===================================================== */

    .cart-item {

      border:
        1px solid var(--border);

      border-radius: 16px;

      padding: 10px;

      margin-bottom: 12px;

      display: grid;

      grid-template-columns:
        76px 1fr;

      gap: 12px;

    }


    .cart-item-image {

      width: 76px;

      height: 76px;

      border-radius: 12px;

      object-fit: cover;

      background:
        #f5f5f5;

    }


    .cart-item-info {

      min-width: 0;

    }


    .cart-item-name {

      font-size: 14px;

      font-weight: 800;

      margin-bottom: 5px;

    }


    .cart-item-color {

      font-size: 12px;

      color:
        var(--gray);

      margin-bottom: 6px;

    }


    .cart-item-price {

      font-size: 14px;

      font-weight: 900;

    }


    .cart-item-actions {

      grid-column:
        1 / -1;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 10px;

    }


    .quantity-box {

      display: flex;

      align-items: center;

      border:
        1px solid var(--border);

      border-radius: 10px;

      overflow: hidden;

    }


    .quantity-btn {

      width: 38px;

      height: 36px;

      border: none;

      background:
        #f6f6f6;

      font-size: 18px;

      font-weight: 900;

    }


    .quantity-value {

      width: 38px;

      text-align: center;

      font-weight: 900;

    }


    .remove-btn {

      border: none;

      background: transparent;

      color:
        var(--danger);

      font-size: 12px;

      font-weight: 700;

    }


    /* =====================================================
       FREE DELIVERY
    ===================================================== */

    .free-delivery-box {

      background:
        #f7f7f7;

      border-radius: 15px;

      padding: 13px;

      margin-bottom: 15px;

    }


    .free-delivery-text {

      font-size: 13px;

      line-height: 1.6;

      margin-bottom: 8px;

    }


    .progress {

      height: 7px;

      background:
        #ddd;

      border-radius: 99px;

      overflow: hidden;

    }


    .progress-bar {

      height: 100%;

      width: 0;

      background:
        var(--green);

      border-radius:
        inherit;

      transition:
        .3s;

    }


    /* =====================================================
       CART FOOTER
       يبقى داخل الشاشة
    ===================================================== */

    .cart-footer {

      flex:
        0 0 auto;

      border-top:
        1px solid var(--border);

      padding:
        15px;

      background:
        white;

      /*
       * لا يسمح للـ footer
       * أن يكبر بلا حدود
       */
      max-height:
        46dvh;

      overflow-y: auto;

      -webkit-overflow-scrolling:
        touch;

      overscroll-behavior:
        contain;

      padding-bottom:
        calc(
          15px +
          env(safe-area-inset-bottom)
        );

    }


    .summary-row {

      display: flex;

      justify-content:
        space-between;

      margin-bottom: 9px;

      font-size: 14px;

    }


    .summary-row.total {

      font-size: 19px;

      font-weight: 900;

      border-top:
        1px solid var(--border);

      padding-top: 12px;

      margin-top: 10px;

    }


    .checkout-button {

      width: 100%;

      border: none;

      background:
        var(--black);

      color: white;

      border-radius: 13px;

      padding: 15px;

      min-height: 58px;

      font-size: 16px;

      font-weight: 900;

      margin-top: 13px;

    }


    .continue-button {

      width: 100%;

      border:
        1px solid var(--black);

      background: white;

      color:
        var(--black);

      border-radius: 13px;

      padding: 12px;

      min-height: 48px;

      font-size: 14px;

      font-weight: 800;

      margin-top: 8px;

    }


    /* =====================================================
       CHECKOUT MODAL
    ===================================================== */

    .modal {

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.58);

      z-index: 2000;

      display: none;

      align-items: flex-end;

      justify-content: center;

    }


    .modal.show {

      display: flex;

    }


    .checkout-modal {

      background: white;

      width:
        min(620px, 100%);

      max-height:
        94dvh;

      overflow-y: auto;

      border-radius:
        25px 25px 0 0;

      padding: 20px;

      animation:
        slideUp .25s ease;

      padding-bottom:
        calc(
          20px +
          env(safe-area-inset-bottom)
        );

    }


    @keyframes slideUp {

      from {

        transform:
          translateY(30px);

        opacity: 0;

      }

      to {

        transform:
          translateY(0);

        opacity: 1;

      }

    }


    .checkout-header {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 20px;

    }


    .checkout-header h2 {

      font-size: 22px;

    }


    .step-indicator {

      display: flex;

      gap: 7px;

      margin-bottom: 20px;

    }


    .step {

      flex: 1;

      height: 5px;

      border-radius: 99px;

      background:
        #ddd;

    }


    .step.active {

      background:
        var(--black);

    }


    /* =====================================================
       FORM
    ===================================================== */

    .form-group {

      margin-bottom: 14px;

    }


    .form-group label {

      display: block;

      font-size: 13px;

      font-weight: 800;

      margin-bottom: 7px;

    }


    .form-group input,
    .form-group select,
    .form-group textarea {

      width: 100%;

      border:
        1px solid #ddd;

      border-radius: 12px;

      padding: 13px;

      font-size: 14px;

      outline: none;

      background: white;

    }


    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {

      border-color:
        var(--black);

    }


    .form-group textarea {

      min-height: 85px;

      resize: vertical;

    }


    .required {

      color:
        var(--danger);

    }


    /* =====================================================
       REVIEW
    ===================================================== */

    .checkout-summary {

      background:
        #f7f7f7;

      border-radius: 16px;

      padding: 14px;

      margin: 15px 0;

    }


    .review-product {

      display: flex;

      gap: 10px;

      align-items: center;

      padding: 9px 0;

      border-bottom:
        1px solid #e5e5e5;

    }


    .review-product:last-child {

      border-bottom: none;

    }


    .review-product img {

      width: 55px;

      height: 55px;

      object-fit: cover;

      border-radius: 10px;

    }


    .review-product-info {

      flex: 1;

    }


    .review-product-info strong {

      display: block;

      font-size: 13px;

    }


    .review-product-info span {

      display: block;

      color:
        var(--gray);

      font-size: 11px;

      margin-top: 4px;

    }


    /* =====================================================
       CHECKOUT BUTTONS
    ===================================================== */

    .checkout-actions {

      display: flex;

      gap: 9px;

      margin-top: 15px;

    }


    .checkout-actions button {

      flex: 1;

      border-radius: 13px;

      padding: 14px;

      min-height: 50px;

      font-weight: 900;

      font-size: 14px;

    }


    .back-button {

      border:
        1px solid var(--black);

      background: white;

      color:
        var(--black);

    }


    .next-button {

      border: none;

      background:
        var(--black);

      color: white;

    }


    .send-button {

      border: none;

      background:
        var(--green);

      color: white;

    }


    /* =====================================================
       TOAST
    ===================================================== */

    .toast {

      position: fixed;

      bottom: 90px;

      left: 50%;

      transform:
        translate(-50%, 20px);

      background:
        var(--black);

      color: white;

      padding:
        12px 18px;

      border-radius: 13px;

      font-size: 13px;

      z-index: 5000;

      opacity: 0;

      pointer-events: none;

      transition: .25s;

      max-width: 90%;

      text-align: center;

    }


    .toast.show {

      opacity: 1;

      transform:
        translate(-50%, 0);

    }


    /* =====================================================
       LOADING
    ===================================================== */

    .loading {

      text-align: center;

      padding: 50px 20px;

      color:
        var(--gray);

    }


    .error-box {

      background:
        #fff0f0;

      color:
        var(--danger);

      padding: 20px;

      border-radius: 15px;

      text-align: center;

      line-height: 1.8;

    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 1000px) {

      .products-grid {

        grid-template-columns:
          repeat(3, 1fr);

      }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {


      .products-grid {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 10px;

      }


      .product-info {

        padding: 11px;

      }


      .product-name {

        font-size: 14px;

      }


      .product-price {

        font-size: 16px;

      }


      .product-meta {

        font-size: 11px;

      }


      .add-button {

        padding: 11px 8px;

      }


      .color-btn {

        width: 25px;

        height: 25px;

      }


      .hero {

        padding-top: 15px;

      }


      .hero-box {

        padding:
          25px 15px;

      }


      .section-title h2 {

        font-size: 21px;

      }


      /* =========================================
         MOBILE CART FIX
      ========================================= */


      .cart-drawer {

        width: 100%;

        height: 100dvh;

        min-height: 0;

        overflow: hidden;

      }


      .cart-header {

        flex-shrink: 0;

        height: 70px;

      }


      .cart-body {

        flex:
          1 1 0;

        min-height: 0;

        overflow-y: auto;

        overflow-x: hidden;

        padding:
          12px;

        padding-bottom:
          20px;

      }


      .cart-footer {

        flex-shrink: 0;

        max-height:
          48dvh;

        overflow-y: auto;

        padding:
          12px;

        padding-bottom:
          calc(
            12px +
            env(safe-area-inset-bottom)
          );

      }


      .checkout-button {

        min-height:
          58px;

      }


      .continue-button {

        min-height:
          48px;

      }


      .cart-item {

        grid-template-columns:
          70px 1fr;

        gap: 10px;

      }


      .cart-item-image {

        width: 70px;

        height: 70px;

      }


      .quantity-btn {

        width: 38px;

        height: 36px;

      }


      .quantity-value {

        width: 38px;

      }


    }


    /* =====================================================
       SMALL MOBILE
    ===================================================== */

    @media (max-width: 430px) {


      .header-inner {

        padding:
          11px 13px;

      }


      .logo {

        font-size: 23px;

      }


      .header-cart {

        padding:
          9px 11px;

        font-size: 12px;

      }


      .cart-drawer {

        width: 100%;

      }


      .cart-header h2 {

        font-size: 20px;

      }


      .cart-footer {

        max-height:
          50dvh;

      }


    }


    /* =====================================================
       VERY SHORT SCREENS
    ===================================================== */

    @media
      (max-width: 700px)
      and
      (max-height: 700px) {


      .cart-header {

        height: 62px;

      }


      .cart-footer {

        max-height:
          52dvh;

      }


      .free-delivery-box {

        padding:
          9px;

        margin-bottom:
          9px;

      }


      .summary-row {

        margin-bottom:
          6px;

      }


      .summary-row.total {

        padding-top:
          8px;

        margin-top:
          7px;

      }


      .checkout-button {

        margin-top:
          8px;

        padding:
          11px;

      }


      .continue-button {

        margin-top:
          6px;

        padding:
          9px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       HEADER
  ===================================================== -->

  <header>

    <div class="header-inner">


      <div class="logo">

        AMO

      </div>


      <button
        class="header-cart"
        type="button"
        onclick="openCart()"
      >

        🛒 السلة

        <span
          id="headerCartCount"
          class="cart-count"
        >
          0
        </span>

      </button>


    </div>

  </header>


  <!-- =====================================================
       HERO
  ===================================================== -->

  <section class="hero">

    <div class="hero-box">


      <h1>
        AMO

  <script>


    /* =====================================================
       SETTINGS
    ===================================================== */


    const REPO_OWNER =
      "llvll0";


    const REPO_NAME =
      "AMO";


    const BRANCH =
      "main";


    const WHATSAPP_NUMBER =
      "962790780914";


    const DELIVERY_PRICE =
      2;


    const FREE_DELIVERY_FROM =
      49;


    const CART_KEY =
      "amo_cart";


    /* =====================================================
       VARIABLES
    ===================================================== */


    let products = [];


    let cart =
      loadCart();


    let toastTimer =
      null;


    /* =====================================================
       LOAD CART
    ===================================================== */


    function loadCart() {


      try {


        const saved =
          localStorage.getItem(
            CART_KEY
          );


        if (!saved) {

          return [];

        }


        const parsed =
          JSON.parse(saved);


        return Array.isArray(parsed)
          ? parsed
          : [];


      } catch (error) {


        console.error(
          "Cart loading error:",
          error
        );


        return [];

      }

    }


    /* =====================================================
       SAVE CART
    ===================================================== */


    function saveCart() {


      localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
      );


      renderCart();


      updateCartUI();

    }


    /* =====================================================
       IMAGE URL
    ===================================================== */


    function makeImageUrl(
      path,
      folder = ""
    ) {


      if (!path) {

        return "";

      }


      path =
        String(path).trim();


      if (
        /^(https?:\/\/|data:)/i
          .test(path)
      ) {

        return path;

      }


      path =
        path.replace(
          /^\/+/,
          ""
        );


      /*
       * NEW PRODUCTS
       */

      if (folder) {


        path =
          path.replace(
            /^images\//i,
            ""
          );


        return (
          "https://raw.githubusercontent.com/" +
          REPO_OWNER +
          "/" +
          REPO_NAME +
          "/" +
          BRANCH +
          "/products-new/" +
          encodeURIComponent(folder) +
          "/" +
          encodeURIComponent(path)
        );

      }


      /*
       * OLD PRODUCTS
       */

      if (
        path.startsWith(
          "products/"
        ) ||
        path.startsWith(
          "images/"
        )
      ) {


        return (
          "https://" +
          REPO_OWNER +
          ".github.io/" +
          REPO_NAME +
          "/" +
          path
        );

      }


      return (
        "https://" +
        REPO_OWNER +
        ".github.io/" +
        REPO_NAME +
        "/images/" +
        path
      );

    }


    function productImage(
      product,
      image
    ) {


      return makeImageUrl(
        image,
        product?.folder || ""
      );

    }


    /* =====================================================
       OLD PRODUCTS
    ===================================================== */


    async function loadOldProducts() {


      try {


        const url =
          "https://raw.githubusercontent.com/" +
          REPO_OWNER +
          "/" +
          REPO_NAME +
          "/" +
          BRANCH +
          "/products.js";


        const response =
          await fetch(
            url,
            {
              cache:
                "no-store"
            }
          );


        if (!response.ok) {

          return [];

        }


        const text =
          await response.text();


        const parsed =
          new Function(
            text +
            "\nreturn products;"
          )();


        if (
          !Array.isArray(parsed)
        ) {

          return [];

        }


        return parsed.map(
          product => ({

            ...product,

            folder:
              product.folder ||
              ""

          })
        );


      } catch (error) {


        console.warn(
          "Old products failed:",
          error
        );


        return [];

      }

    }


    /* =====================================================
       NEW PRODUCTS
    ===================================================== */


    async function loadNewProducts() {


      const apiUrl =
        "https://api.github.com/repos/" +
        REPO_OWNER +
        "/" +
        REPO_NAME +
        "/contents/products-new?ref=" +
        BRANCH;


      const response =
        await fetch(
          apiUrl,
          {
            cache:
              "no-store",

            headers: {

              "Accept":
                "application/vnd.github+json"

            }

          }
        );


      if (!response.ok) {


        throw new Error(
          "تعذر قراءة مجلد المنتجات الجديدة"
        );

      }


      const entries =
        await response.json();


      const folders =
        entries

          .filter(
            item =>

              item.type ===
                "dir" &&

              /^\d+$/.test(
                item.name
              )
          )

          .sort(
            (a,b) =>

              Number(a.name) -
              Number(b.name)
          );


      const loaded = [];


      for (
        const folder of folders
      ) {


        try {


          const productUrl =
            "https://raw.githubusercontent.com/" +
            REPO_OWNER +
            "/" +
            REPO_NAME +
            "/" +
            BRANCH +
            "/products-new/" +
            encodeURIComponent(
              folder.name
            ) +
            "/product.js";


          const productResponse =
            await fetch(
              productUrl,
              {
                cache:
                  "no-store"
              }
            );


          if (
            !productResponse.ok
          ) {

            continue;

          }


          const productCode =
            await productResponse.text();


          const product =
            new Function(
              productCode +
              "\nreturn product;"
            )();


          if (!product) {

            continue;

          }


          loaded.push({

            ...product,

            id:
              String(
                product.id ||
                folder.name
              ),

            folder:
              folder.name

          });


        } catch (error) {


          console.warn(
            "خطأ في المنتج " +
            folder.name,
            error
          );


        }

      }


      return loaded;

    }


    /* =====================================================
       LOAD ALL PRODUCTS
    ===================================================== */


    async function loadProducts() {


      const grid =
        document.getElementById(
          "productsGrid"
        );


      try {


        grid.innerHTML = `

          <div class="loading">

            جاري تحميل المنتجات...

          </div>

        `;


        const [
          oldProducts,
          newProducts
        ] =
          await Promise.all([

            loadOldProducts(),

            loadNewProducts()

          ]);


        const map =
          new Map();


        for (
          const product of oldProducts
        ) {


          map.set(
            String(product.id),
            product
          );


        }


        for (
          const product of newProducts
        ) {


          map.set(
            String(product.id),
            product
          );


        }


        products =
          Array.from(
            map.values()
          );


        products.sort(
          (a,b) =>

            Number(a.id) -
            Number(b.id)
        );


        renderProducts();


      } catch (error) {


        console.error(
          error
        );


        grid.innerHTML = `

          <div
            class="error-box"
          >

            حدث خطأ أثناء
            تحميل المنتجات.

            <br>

            تأكدي أن مجلد
            <b>products-new</b>
            موجود في GitHub.

          </div>

        `;

      }

    }


    /* =====================================================
       RENDER PRODUCTS
    ===================================================== */


    function renderProducts() {


      const grid =
        document.getElementById(
          "productsGrid"
        );


      document.getElementById(
        "productsCount"
      ).textContent =

        products.length +
        " منتجات";


      if (!products.length) {


        grid.innerHTML = `

          <div class="loading">

            لا توجد منتجات حاليًا.

          </div>

        `;


        return;

      }


      grid.innerHTML = "";


      products.forEach(
        product => {


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "product-card";


          const colors =
            Array.isArray(
              product.colors
            )
              ? product.colors
              : [];


          let selectedColor =
            colors.length
              ? colors[0]
              : null;


          let selectedImage =
            selectedColor?.image ||
            product.image ||
            product.gallery?.[0] ||
            "";


          card.innerHTML = `

            <div
              class="product-image-wrap"
            >

              <img
                class="product-image"

                src="${productImage(
                  product,
                  selectedImage
                )}"

                alt="${escapeHtml(
                  product.name ||
                  "AMO"
                )}"

                loading="lazy"
              >

            </div>


            <div
              class="product-info"
            >


              <div
                class="product-name"
              >

                ${escapeHtml(
                  product.name ||
                  "شنطة AMO #" +
                  product.id
                )}

              </div>


              <div
                class="product-price"
              >

                ${Number(
                  product.price || 0
                ).toFixed(2)}

                د.أ

              </div>


              ${
                product.dimensions

                ?

                `

                  <div
                    class="product-meta"
                  >

                    📐
                    ${escapeHtml(
                      product.dimensions
                    )}

                  </div>

                `

                :

                ""

              }


              ${
                colors.length

                ?

                `

                  <div
                    class="colors-title"
                  >

                    اختاري اللون:

                  </div>


                  <div
                    class="colors"
                  >

                    ${colors.map(
                      (
                        color,
                        index
                      ) => `

                        <button
                          type="button"

                          class="color-btn ${
                            index === 0
                              ? "active"
                              : ""
                          }"

                          data-color-index="${index}"

                          title="${escapeHtml(
                            color.name ||
                            ""
                          )}"

                          style="
                            background:
                            ${color.value ||
                              "#ddd"}
                          "
                        ></button>

                      `
                    ).join("")}

                  </div>


                  <div
                    class="selected-color-name"
                  >

                    اللون:

                    <b
                      class="selected-color-text"
                    >

                      ${escapeHtml(
                        selectedColor?.name ||
                        ""
                      )}

                    </b>

                  </div>

                `

                :

                ""

              }


              <button
                type="button"

                class="add-button"
              >

                🛒 إضافة للسلة

              </button>


            </div>

          `;


          /*
           * CHANGE COLOR
           */

          card
            .querySelectorAll(
              ".color-btn"
            )
            .forEach(
              button => {


                button.addEventListener(
                  "click",
                  () => {


                    const index =
                      Number(
                        button.dataset
                          .colorIndex
                      );


                    selectedColor =
                      colors[index];


                    selectedImage =
                      selectedColor.image ||
                      product.image ||
                      "";


                    card
                      .querySelector(
                        ".product-image"
                      )
                      .src =
                      productImage(
                        product,
                        selectedImage
                      );


                    card
                      .querySelectorAll(
                        ".color-btn"
                      )
                      .forEach(
                        btn =>
                          btn.classList
                            .remove(
                              "active"
                            )
                      );


                    button.classList.add(
                      "active"
                    );


                    const colorText =
                      card.querySelector(
                        ".selected-color-text"
                      );


                    if (colorText) {


                      colorText.textContent =
                        selectedColor.name ||
                        "";

                    }


                  }
                );

              }
            );


          /*
           * ADD TO CART
           */

          card
            .querySelector(
              ".add-button"
            )
            .addEventListener(
              "click",
              () => {


                addToCart(

                  product,

                  selectedColor?.name ||
                    "",

                  selectedImage

                );


              }
            );


          grid.appendChild(
            card
          );


        }
      );

    }


    /* =====================================================
       ADD TO CART
    ===================================================== */


    function addToCart(
      product,
      colorName = "",
      colorImage = ""
    ) {


      const productId =
        String(
          product.id
        );


      const existingIndex =
        cart.findIndex(
          item =>

            String(
              item.productId
            ) ===
            productId &&

            String(
              item.color || ""
            ) ===
            String(
              colorName || ""
            )
        );


      if (
        existingIndex !== -1
      ) {


        cart[
          existingIndex
        ].qty += 1;


      } else {


        cart.push({

          productId:
            productId,

          name:
            product.name ||
            "شنطة AMO #" +
            productId,

          price:
            Number(
              product.price ||
              0
            ),

          color:
            colorName,

          /*
           * الصورة تستخدم للموقع
           * والسلة فقط.
           *
           * لا ترسل إلى WhatsApp.
           */

          image:
            colorImage ||
            product.image ||
            product.gallery?.[0] ||
            "",

          folder:
            product.folder ||
            "",

          qty: 1

        });


      }


      saveCart();


      showToast(
        "تمت إضافة المنتج إلى السلة 🛒"
      );


    }


    /* =====================================================
       CHANGE QUANTITY
    ===================================================== */


    function changeQuantity(
      index,
      amount
    ) {


      if (!cart[index]) {

        return;

      }


      cart[index].qty =

        Number(
          cart[index].qty ||
          1
        ) +

        amount;


      if (
        cart[index].qty <= 0
      ) {


        cart.splice(
          index,
          1
        );


      }


      saveCart();

    }


    /* =====================================================
       REMOVE
    ===================================================== */


    function removeFromCart(
      index
    ) {


      if (!cart[index]) {

        return;

      }


      cart.splice(
        index,
        1
      );


      saveCart();


      showToast(
        "تم حذف المنتج من السلة"
      );


    }


    /* =====================================================
       CALCULATIONS
    ===================================================== */


    function getSubtotal() {


      return cart.reduce(

        (
          sum,
          item
        ) =>

          sum +

          (
            Number(
              item.price ||
              0
            ) *

            Number(
              item.qty ||
              0
            )
          ),

        0

      );

    }


    function getDelivery() {


      const subtotal =
        getSubtotal();


      if (
        subtotal >=
        FREE_DELIVERY_FROM
      ) {

        return 0;

      }


      if (
        subtotal <= 0
      ) {

        return 0;

      }


      return DELIVERY_PRICE;

    }


    function getCartCount() {


      return cart.reduce(

        (
          sum,
          item
        ) =>

          sum +

          Number(
            item.qty ||
            0
          ),

        0

      );

    }


    /* =====================================================
       UPDATE CART UI
    ===================================================== */


    function updateCartUI() {


      const count =
        getCartCount();


      const subtotal =
        getSubtotal();


      document.getElementById(
        "headerCartCount"
      ).textContent =
        count;


      const floating =
        document.getElementById(
          "floatingCart"
        );


      const floatingItems =
        document.getElementById(
          "floatingCartItems"
        );


      const floatingTotal =
        document.getElementById(
          "floatingCartTotal"
        );


      if (
        count > 0
      ) {


        floating.classList.remove(
          "hidden"
        );


        floatingItems.textContent =

          count +

          (
            count === 1
              ? " منتج"
              : " منتجات"
          );


        floatingTotal.textContent =

          subtotal.toFixed(2) +
          " د.أ";


      } else {


        floating.classList.add(
          "hidden"
        );

      }


    }


    /* =====================================================
       RENDER CART
    ===================================================== */


    function renderCart() {


      const body =
        document.getElementById(
          "cartBody"
        );


      const footer =
        document.getElementById(
          "cartFooter"
        );


      if (!cart.length) {


        body.innerHTML = `

          <div
            class="empty-cart"
          >


            <div
              class="empty-cart-icon"
            >

              🛒

            </div>


            <strong>

              السلة فارغة

            </strong>


            <span>

              اختاري المنتجات
              التي تعجبك
              وأضيفيها إلى السلة.

            </span>


            <button
              class="continue-button"

              style="
                max-width:220px
              "

              onclick="closeCart()"
            >

              تصفح المنتجات

            </button>


          </div>

        `;


        footer.innerHTML =
          "";


        updateCartUI();


        return;

      }


      body.innerHTML =
        "";


      cart.forEach(
        (
          item,
          index
        ) => {


          const imageUrl =
            makeImageUrl(
              item.image,
              item.folder ||
              ""
            );


          const itemTotal =

            Number(
              item.price ||
              0
            ) *

            Number(
              item.qty ||
              0
            );


          const element =
            document.createElement(
              "div"
            );


          element.className =
            "cart-item";


          element.innerHTML = `

            <img
              class="cart-item-image"

              src="${imageUrl}"

              alt="${escapeHtml(
                item.name
              )}"
            >


            <div
              class="cart-item-info"
            >


              <div
                class="cart-item-name"
              >

                ${escapeHtml(
                  item.name
                )}

              </div>


              ${
                item.color

                ?

                `

                  <div
                    class="cart-item-color"
                  >

                    اللون:

                    <b>

                      ${escapeHtml(
                        item.color
                      )}

                    </b>

                  </div>

                `

                :

                ""

              }


              <div
                class="cart-item-price"
              >

                ${itemTotal.toFixed(2)}
                د.أ

              </div>


            </div>


            <div
              class="cart-item-actions"
            >


              <div
                class="quantity-box"
              >


                <button
                  class="quantity-btn"

                  type="button"

                  onclick="
                    changeQuantity(
                      ${index},
                      -1
                    )
                  "
                >

                  −

                </button>


                <div
                  class="quantity-value"
                >

                  ${item.qty}

                </div>


                <button
                  class="quantity-btn"

                  type="button"

                  onclick="
                    changeQuantity(
                      ${index},
                      1
                    )
                  "
                >

                  +

                </button>


              </div>


              <button
                class="remove-btn"

                type="button"

                onclick="
                  removeFromCart(
                    ${index}
                  )
                "
              >

                🗑 حذف

              </button>


            </div>


          `;


          body.appendChild(
            element
          );


        }
      );


      const subtotal =
        getSubtotal();


      const delivery =
        getDelivery();


      const total =
        subtotal +
        delivery;


      let deliveryMessage =
        "";


      if (
        subtotal >=
        FREE_DELIVERY_FROM
      ) {


        deliveryMessage = `

          <div
            class="free-delivery-text"
          >

            🎉 مبروك!

            حصلتِ على
            <b>
              التوصيل المجاني
            </b>.

          </div>


          <div
            class="progress"
          >

            <div
              class="progress-bar"

              style="
                width:100%
              "
            ></div>

          </div>

        `;


      } else {


        const remaining =
          FREE_DELIVERY_FROM -
          subtotal;


        const percentage =

          Math.min(

            100,

            (
              subtotal /
              FREE_DELIVERY_FROM
            ) * 100

          );


        deliveryMessage = `

          <div
            class="free-delivery-text"
          >

            أضيفي

            <b>

              ${remaining.toFixed(2)}
              د.أ

            </b>

            لتحصلي على

            <b>
              توصيل مجاني
            </b>

            🎁

          </div>


          <div
            class="progress"
          >

            <div
              class="progress-bar"

              style="
                width:${percentage}%
              "
            ></div>

          </div>

        `;

      }


      footer.innerHTML = `


        <div
          class="free-delivery-box"
        >

          ${deliveryMessage}

        </div>


        <div
          class="summary-row"
        >

          <span>

            المجموع

          </span>


          <strong>

            ${subtotal.toFixed(2)}
            د.أ

          </strong>

        </div>


        <div
          class="summary-row"
        >

          <span>

            التوصيل

          </span>


          <strong>

            ${
              delivery === 0

                ? "مجاني"

                :

                delivery.toFixed(2) +
                " د.أ"

            }

          </strong>

        </div>


        <div
          class="summary-row total"
        >

          <span>

            الإجمالي

          </span>


          <strong>

            ${total.toFixed(2)}
            د.أ

          </strong>

        </div>


        <button
          class="checkout-button"

          type="button"

          onclick="
            openCheckout()
          "
        >

          إكمال الطلب →

        </button>


        <button
          class="continue-button"

          type="button"

          onclick="
            closeCart()
          "
        >

          متابعة التسوق

        </button>


      `;


      updateCartUI();

    }


    /* =====================================================
       OPEN CART
    ===================================================== */


    function openCart() {


      renderCart();


      document
        .getElementById(
          "cartDrawer"
        )
        .classList.add(
          "open"
        );


      document
        .getElementById(
          "overlay"
        )
        .classList.add(
          "show"
        );


      document.body.classList.add(
        "no-scroll"
      );


    }


    /* =====================================================
       CLOSE CART
    ===================================================== */


    function closeCart() {


      document
        .getElementById(
          "cartDrawer"
        )
        .classList.remove(
          "open"
        );


      document
        .getElementById(
          "overlay"
        )
        .classList.remove(
          "show"
        );


      document.body.classList.remove(
        "no-scroll"
      );


    }


    function closeAllOverlays() {

      closeCart();

      closeCheckout();

    }


    /* =====================================================
       OPEN CHECKOUT
    ===================================================== */


    function openCheckout() {


      if (!cart.length) {


        showToast(
          "السلة فارغة"
        );


        return;

      }


      closeCart();


      document
        .getElementById(
          "checkoutModal"
        )
        .classList.add(
          "show"
        );


      document.body.classList.add(
        "no-scroll"
      );


      goToCustomerData();

    }


    /* =====================================================
       CLOSE CHECKOUT
    ===================================================== */


    function closeCheckout() {


      document
        .getElementById(
          "checkoutModal"
        )
        .classList.remove(
          "show"
        );


      document.body.classList.remove(
        "no-scroll"
      );

    }


    /* =====================================================
       CUSTOMER DATA
    ===================================================== */


    function goToCustomerData() {


      document.getElementById(
        "checkoutStep1"
      ).style.display =
        "block";


      document.getElementById(
        "checkoutStep2"
      ).style.display =
        "none";


      document.getElementById(
        "step1Indicator"
      ).classList.add(
        "active"
      );


      document.getElementById(
        "step2Indicator"
      ).classList.remove(
        "active"
      );

    }


    /* =====================================================
       REVIEW
    ===================================================== */


    function goToReview() {


      const name =
        document.getElementById(
          "customerName"
        ).value.trim();


      const phone =
        document.getElementById(
          "customerPhone"
        ).value.trim();


      const city =
        document.getElementById(
          "customerCity"
        ).value;


      const address =
        document.getElementById(
          "customerAddress"
        ).value.trim();


      if (
        !name ||
        !phone ||
        !city ||
        !address
      ) {


        showToast(
          "يرجى تعبئة جميع البيانات المطلوبة"
        );


        return;

      }


      renderReview();


      document.getElementById(
        "checkoutStep1"
      ).style.display =
        "none";


      document.getElementById(
        "checkoutStep2"
      ).style.display =
        "block";


      document.getElementById(
        "step1Indicator"
      ).classList.add(
        "active"
      );


      document.getElementById(
        "step2Indicator"
      ).classList.add(
        "active"
      );

    }


    /* =====================================================
       RENDER REVIEW
    ===================================================== */


    function renderReview() {


      const productsBox =
        document.getElementById(
          "reviewProducts"
        );


      productsBox.innerHTML = `

        <strong>

          المنتجات

        </strong>


        <div
          style="
            margin-top:8px
          "
        >

          ${cart.map(
            item => {


              const imageUrl =
                makeImageUrl(
                  item.image,
                  item.folder ||
                  ""
                );


              return `

                <div
                  class="review-product"
                >


                  <img
                    src="${imageUrl}"

                    alt="${escapeHtml(
                      item.name
                    )}"
                  >


                  <div
                    class="review-product-info"
                  >


                    <strong>

                      ${escapeHtml(
                        item.name
                      )}

                    </strong>


                    <span>

                      ${
                        item.color

                        ?

                        "اللون: " +
                        escapeHtml(
                          item.color
                        ) +
                        " · "

                        :

                        ""

                      }

                      الكمية:
                      ${item.qty}

                    </span>


                  </div>


                  <strong>

                    ${
                      (
                        Number(
                          item.price
                        ) *

                        Number(
                          item.qty
                        )
                      ).toFixed(2)
                    }

                    د.أ

                  </strong>


                </div>

              `;

            }
          ).join("")}

        </div>

      `;


      const name =
        document.getElementById(
          "customerName"
        ).value.trim();


      const phone =
        document.getElementById(
          "customerPhone"
        ).value.trim();


      const city =
        document.getElementById(
          "customerCity"
        ).value;


      const address =
        document.getElementById(
          "customerAddress"
        ).value.trim();


      const notes =
        document.getElementById(
          "customerNotes"
        ).value.trim();


      document.getElementById(
        "reviewCustomer"
      ).innerHTML = `

        <strong>

          بيانات التوصيل

        </strong>


        <div
          style="
            margin-top:10px;
            line-height:1.9;
            font-size:14px;
          "
        >

          👤
          ${escapeHtml(name)}

          <br>

          📞
          ${escapeHtml(phone)}

          <br>

          📍
          ${escapeHtml(city)}

          <br>

          🏠
          ${escapeHtml(address)}

          ${
            notes

            ?

            `

              <br>

              📝
              ${escapeHtml(notes)}

            `

            :

            ""

          }

        </div>

      `;


      const subtotal =
        getSubtotal();


      const delivery =
        getDelivery();


      const total =
        subtotal +
        delivery;


      document.getElementById(
        "reviewTotals"
      ).innerHTML = `


        <div
          class="summary-row"
        >

          <span>
            المجموع
          </span>


          <strong>

            ${subtotal.toFixed(2)}
            د.أ

          </strong>

        </div>


        <div
          class="summary-row"
        >

          <span>
            التوصيل
          </span>


          <strong>

            ${
              delivery === 0

              ?

              "مجاني"

              :

              delivery.toFixed(2) +
              " د.أ"

            }

          </strong>

        </div>


        <div
          class="summary-row total"
        >

          <span>
            الإجمالي
          </span>


          <strong>

            ${total.toFixed(2)}
            د.أ

          </strong>

        </div>


      `;

    }


    /* =====================================================
       SEND WHATSAPP
       TEXT ONLY
    ===================================================== */


    function sendWhatsAppOrder() {


      if (!cart.length) {


        showToast(
          "السلة فارغة"
        );


        return;

      }


      const name =
        document.getElementById(
          "customerName"
        ).value.trim();


      const phone =
        document.getElementById(
          "customerPhone"
        ).value.trim();


      const city =
        document.getElementById(
          "customerCity"
        ).value;


      const address =
        document.getElementById(
          "customerAddress"
        ).value.trim();


      const notes =
        document.getElementById(
          "customerNotes"
        ).value.trim();


      if (
        !name ||
        !phone ||
        !city ||
        !address
      ) {


        goToCustomerData();


        showToast(
          "يرجى تعبئة جميع البيانات المطلوبة"
        );


        return;

      }


      const subtotal =
        getSubtotal();


      const delivery =
        getDelivery();


      const total =
        subtotal +
        delivery;


      /*
       * MESSAGE
       */

      let message =
        "🛍️ طلب جديد من AMO\n\n";


      message +=
        "👤 الاسم: " +
        name +
        "\n";


      message +=
        "📞 الهاتف: " +
        phone +
        "\n";


      message +=
        "📍 المحافظة: " +
        city +
        "\n";


      message +=
        "🏠 العنوان: " +
        address +
        "\n";


      if (notes) {


        message +=
          "📝 الملاحظات: " +
          notes +
          "\n";

      }


      message +=
        "\n━━━━━━━━━━━━\n";


      message +=
        "🛒 المنتجات:\n\n";


      cart.forEach(
        item => {


          message +=
            "• " +
            item.name;


          if (item.color) {


            message +=
              " | اللون: " +
              item.color;

          }


          message +=
            " | الكمية: " +
            item.qty;


          message +=
            " | " +


            (
              Number(
                item.price
              ) *

              Number(
                item.qty
              )
            ).toFixed(2) +


            " د.أ\n";


        }
      );


      message +=
        "\n━━━━━━━━━━━━\n";


      message +=
        "💰 المجموع: " +
        subtotal.toFixed(2) +
        " د.أ\n";


      message +=
        "🚚 التوصيل: " +

        (
          delivery === 0

          ?

          "مجاني"

          :

          delivery.toFixed(2) +
          " د.أ"

        ) +

        "\n";


      message +=
        "💵 الإجمالي: " +
        total.toFixed(2) +
        " د.أ";


      /*
       * WHATSAPP
       *
       * لا توجد صور هنا نهائيًا.
       */

      const whatsappUrl =

        "https://wa.me/" +

        WHATSAPP_NUMBER +

        "?text=" +

        encodeURIComponent(
          message
        );


      window.open(
        whatsappUrl,
        "_blank"
      );


      showToast(
        "تم تجهيز الطلب على WhatsApp ✅"
      );


    }


    /* =====================================================
       TOAST
    ===================================================== */


    function showToast(
      message
    ) {


      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          () => {


            toast.classList.remove(
              "show"
            );


          },
          2800
        );


    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */


    function escapeHtml(
      value
    ) {


      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       START
    ===================================================== */


    document.addEventListener(
      "DOMContentLoaded",
      () => {


        renderCart();


        updateCartUI();


        loadProducts();


      }
    );


    /* =====================================================
       CLOSE CHECKOUT OUTSIDE
    ===================================================== */


    document
      .getElementById(
        "checkoutModal"
      )
      .addEventListener(
        "click",
        event => {


          if (
            event.target.id ===
            "checkoutModal"
          ) {


            closeCheckout();


          }

        }
      );


  </script>


</body>

</html>
