<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AMO | متجر الحقائب</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f8f6f1;
  color:#171717;
}

button{
  font-family:Arial,sans-serif;
  cursor:pointer;
}


/* HEADER */

header{
  background:#111;
  color:white;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  letter-spacing:4px;
}

nav a{
  color:white;
  text-decoration:none;
  margin-right:18px;
  font-size:14px;
}

.cart-button{
  background:white;
  color:#111;
  border:0;
  padding:10px 16px;
  border-radius:25px;
  font-size:14px;
  font-weight:bold;
}

.cart-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#111;
  color:white;
  width:22px;
  height:22px;
  border-radius:50%;
  margin-right:5px;
  font-size:12px;
}


/* HERO */

.hero{
  text-align:center;
  padding:65px 20px;
  background:#eee9df;
}

.hero h1{
  font-size:40px;
  margin-bottom:18px;
}

.hero p{
  font-size:18px;
  color:#555;
  margin-bottom:25px;
}

.btn{
  background:#111;
  color:white;
  border:0;
  padding:14px 25px;
  border-radius:30px;
  font-size:15px;
  text-decoration:none;
}


/* PRODUCTS */

.products{
  padding:50px 5%;
}

.title{
  text-align:center;
  font-size:30px;
  margin-bottom:35px;
}

.grid{
  max-width:700px;
  margin:auto;
}


/* PRODUCT CARD */

.card{
  background:white;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 5px 25px #0001;
  margin-bottom:30px;
}

.main{
  width:100%;
  height:500px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}


/* GALLERY */

.gallery{
  display:flex;
  gap:9px;
  padding:12px;
  overflow-x:auto;
}

.gallery img{
  width:70px;
  height:70px;
  min-width:70px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid transparent;
}

.gallery img.active{
  border-color:#111;
}


/* INFO */

.info{
  padding:25px;
}

.info h2{
  font-size:27px;
  margin-bottom:14px;
}

.price{
  font-size:27px;
  font-weight:bold;
  margin-bottom:20px;
}


/* SIZE */

.product-size-box{
  background:#f7f5f0;
  border-radius:15px;
  padding:15px;
  margin-bottom:20px;
}

.product-size-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 0;
  font-size:15px;
}

.product-size-row span{
  color:#666;
}


/* COLORS */

.color-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:12px;
}

.colors{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:22px;
}

.color-option{
  display:flex;
  align-items:center;
  gap:8px;
  background:white;
  border:1px solid #ddd;
  padding:8px 13px;
  border-radius:30px;
  font-size:14px;
}

.color-option.selected{
  border:2px solid #111;
  padding:7px 12px;
  background:#f7f7f7;
}

.color-circle{
  width:24px;
  height:24px;
  min-width:24px;
  border-radius:50%;
  border:2px solid white;
  box-shadow:0 0 0 1px #aaa;
}

.color-name{
  font-weight:bold;
}

.add-button{
  width:100%;
  font-size:16px;
  padding:16px;
}


/* LIGHTBOX */

.lightbox{
  display:none;
  position:fixed;
  inset:0;
  background:#000e;
  z-index:10000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.lightbox.show{
  display:flex;
}

.lightbox-image{
  max-width:92vw;
  max-height:88vh;
  object-fit:contain;
  border-radius:10px;
}

.lightbox-close,
.lightbox-prev,
.lightbox-next{
  position:absolute;
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:white;
  color:#111;
  font-size:25px;
  z-index:10002;
}

.lightbox-close{
  top:18px;
  right:20px;
  font-size:28px;
}

.lightbox-prev{
  right:20px;
  top:50%;
  transform:translateY(-50%);
}

.lightbox-next{
  left:20px;
  top:50%;
  transform:translateY(-50%);
}

.lightbox-counter{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:#0008;
  padding:8px 15px;
  border-radius:20px;
}


/* CART */

.cart-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0007;
  z-index:9998;
}

.cart{
  position:fixed;
  top:0;
  right:0;
  width:100%;
  max-width:450px;
  height:100vh;
  background:white;
  z-index:9999;
  padding:22px;
  overflow-y:auto;
  box-shadow:-5px 0 25px #0004;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  padding-bottom:15px;
  border-bottom:1px solid #ddd;
}

.close-cart{
  width:38px;
  height:38px;
  border:0;
  background:#eee;
  border-radius:50%;
  font-size:22px;
}


/* CART ITEM */

.cart-item{
  border-bottom:1px solid #ddd;
  padding:18px 0;
}

.cart-product{
  display:flex;
  gap:12px;
  align-items:center;
}

.cart-product-image{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:12px;
}

.cart-product-info{
  flex:1;
}

.cart-item h3{
  font-size:18px;
  margin-bottom:8px;
}

.cart-item p{
  margin:5px 0;
  color:#555;
}


/* QUANTITY */

.quantity{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:12px;
}

.quantity button{
  width:36px;
  height:36px;
  border:0;
  background:#eee;
  border-radius:50%;
  font-size:20px;
}

.quantity strong{
  min-width:25px;
  text-align:center;
}


/* DELETE */

.delete{
  margin-right:auto !important;
  width:auto !important;
  min-width:0 !important;
  height:auto !important;
  padding:6px 10px !important;
  border:0 !important;
  background:#eee !important;
  border-radius:20px !important;
  font-size:12px !important;
}


/* FORM */

.customer-form{
  margin-top:25px;
  padding-top:20px;
  border-top:2px solid #111;
}

.customer-form h3{
  font-size:21px;
  margin-bottom:18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:15px;
  font-family:Arial;
  background:white;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}


/* TOTAL */

.cart-total{
  border-top:2px solid #111;
  margin-top:20px;
  padding-top:20px;
}

.cart-total h3{
  font-size:22px;
}

.delivery-info{
  margin-top:12px;
  padding:12px;
  background:#f4f1ea;
  border-radius:12px;
  text-align:center;
  font-size:14px;
}

.more-products-button,
.whatsapp-button{
  width:100%;
  margin-top:12px;
  border:0;
  padding:15px;
  border-radius:30px;
  font-size:15px;
}

.more-products-button{
  background:#eee;
}

.whatsapp-button{
  background:#111;
  color:white;
  font-size:16px;
}


/* LOADING */

.loading{
  text-align:center;
  padding:50px 20px;
  color:#777;
}


/* FOOTER */

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:35px;
  margin-top:40px;
}


/* MOBILE */

@media(max-width:600px){

  header{
    padding:16px 4%;
  }

  .logo{
    font-size:25px;
  }

  nav{
    display:none;
  }

  .hero{
    padding:50px 20px;
  }

  .hero h1{
    font-size:32px;
  }

  .main{
    height:420px;
  }

  .info{
    padding:22px;
  }

  .info h2{
    font-size:24px;
  }

  .price{
    font-size:25px;
  }

  .cart{
    max-width:100%;
  }

}

</style>

</head>


<body>


<header>

  <div class="logo">
    AMO
  </div>

  <nav>
    <a href="#home">الرئيسية</a>
    <a href="#products">الحقائب</a>
    <a href="#contact">تواصل معنا</a>
  </nav>

  <button
    class="cart-button"
    onclick="openCart()">

    🛒 السلة

    <span
      id="cartCount"
      class="cart-count">
      0
    </span>

  </button>

</header>


<section
  class="hero"
  id="home">

  <h1>
    اختاري شنطتك بستايلك الخاص
  </h1>

  <p>
    حقائب أنيقة تناسب كل إطلالة ✨
  </p>

  <a
    href="#products"
    class="btn">

    اكتشفي الحقائب

  </a>

</section>


<section
  class="products"
  id="products">

  <h2 class="title">
    أحدث الحقائب
  </h2>

  <div
    id="productsGrid"
    class="grid">

    <div class="loading">
      جاري تحميل المنتجات...
    </div>

  </div>

</section>


<!-- IMAGE VIEWER -->

<div
  id="lightbox"
  class="lightbox"
  onclick="closeLightbox(event)">

  <button
    class="lightbox-close"
    onclick="closeLightbox()">

    ×

  </button>

    onclick="previousImage(event)">

  <img

    alt="">

  <button

  </button>

<!-- CART OVERLAY -->

<div
  id="cartOverlay"
  class="cart-overlay"
  onclick="closeCart()">
</div>


<!-- CART -->

<div

  class="cart"
  style="display:none;">

  <div class="cart-header">

    <h2>
      🛒 سلة المشتريات
    </h2>

  <p style="margin-top:10px;">
    متجر الحقائب
  </p>

<script>

/* =========================
   SETTINGS
========================= */

const whatsappNumber =
  "962790780914";

const productsAPI =
  "https://api.github.com/repos/llvll0/AMO/contents/products?ref=main";


/* =========================
   VARIABLES
========================= */

const grid =
  document.getElementById(
    "productsGrid"
  );

let products = [];

let cart =
  JSON.parse(
    localStorage.getItem("amoCart") || "[]"
  );

let currentImages = [];

let currentImageIndex = 0;


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    const response =
      await fetch(productsAPI);

    if(!response.ok){
      throw new Error(
        "تعذر تحميل المنتجات"
      );
    }

    const files =
      await response.json();


    const jsFiles =
      files.filter(
        file =>
          file.type === "file" &&
          file.name.endsWith(".js")
      );


    const loadedProducts =
      await Promise.all(

        jsFiles.map(
          async file => {

            const sourceResponse =
              await fetch(
                file.download_url
              );

            const source =
              await sourceResponse.text();


            /*
              كل ملف منتج يحتوي:
              const product = {...};

              نرجع المتغير product
            */

            const getProduct =
              new Function(
                source +
                "\nreturn product;"
              );


            return getProduct();

          }
        )

      );


    products =
      loadedProducts.filter(
        Boolean
      );


    products.sort(
      (a,b) =>
        Number(a.id) -
        Number(b.id)
    );


    renderProducts();

  }catch(error){

    console.error(error);

    grid.innerHTML = `

      <div class="loading">

        حدث خطأ في تحميل المنتجات.

        <br><br>

        تأكدي من ملفات المنتجات.

      </div>

    `;

  }

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

  grid.innerHTML = "";


  if(products.length === 0){

    grid.innerHTML = `

      <div class="loading">

        لا توجد منتجات حاليًا.

      </div>

    `;

    return;

  }


  products.forEach(
    product => {

      renderProduct(product);

    }
  );

}


/* =========================
   RENDER ONE PRODUCT
========================= */

function renderProduct(product){

  let images = [
    ...(product.gallery || [])
  ];


  if(product.image){
    images.push(
      product.image
    );
  }


  (product.colors || [])
    .forEach(color => {

      if(color.image){
        images.push(
          color.image
        );
      }

    });


  images = [
    ...new Set(images)
  ];


  const firstImage =
    product.colors?.[0]?.image ||
    product.image ||
    images[0] ||
    "";


  const firstColor =
    product.colors?.[0]?.name ||
    "";


  const card =
    document.createElement("div");

  card.className =
    "card";


  const galleryHTML =
    images.map(
      (image,index) => `

        <img
          src="${image}"
          class="${
            index === 0
            ? "active"
            : ""
          }"
          alt="${product.name}"
          onclick="changeImage(
            this,
            '${image}',
            ${JSON.stringify(images)}
          )">

      `
    ).join("");


  const colorsHTML =
    (product.colors || [])
      .map(
        (color,index) => `

          <button
            class="color-option ${
              index === 0
              ? "selected"
              : ""
            }"
            onclick="selectColor(
              this,
              '${color.name}',
              '${color.image || ""}'
            )">

            <span
              class="color-circle"
              style="
                background:${color.value};
              ">
            </span>

            <span class="color-name">
              ${color.name}
            </span>

          </button>

        `
      ).join("");


  card.innerHTML = `

    <img
      class="main"
      src="${firstImage}"
      alt="${product.name}">


    <div class="gallery">

      ${galleryHTML}

    </div>


    <div class="info">

      <h2>
        ${product.name}
      </h2>


      <div class="price">

        ${product.price}
        دينار

      </div>


      <div class="product-size-box">

        <div class="product-size-row">

          <span>
            📏 الحجم
          </span>

          <strong>
            ${product.size || "غير محدد"}
          </strong>

        </div>


        ${
          product.dimensions
          ? `

          <div class="product-size-row">

            <span>
              📐 الأبعاد
            </span>

            <strong>
              ${product.dimensions}
            </strong>

          </div>

          `
          : ""
        }

      </div>


      ${
        colorsHTML
        ? `

        <div class="color-title">
          اختاري اللون:
        </div>

        <div class="colors">
          ${colorsHTML}
        </div>

        `
        : ""
      }


      <button
        class="btn add-button">

        🛒 أضف إلى السلة

      </button>

    </div>

  `;


  card.dataset.color =
    firstColor;


  card.dataset.image =
    firstImage;


  card.dataset.images =
    JSON.stringify(images);


  const mainImage =
    card.querySelector(".main");


  mainImage.onclick =
    () => {

      openLightbox(
        0,
        images
      );

    };


  const addButton =
    card.querySelector(
      ".add-button"
    );


  addButton.onclick =
    () => {

      addProductToCart(
        addButton,
        product
      );

    };


  grid.appendChild(card);

}


/* =========================
   CHANGE IMAGE
========================= */

function changeImage(
  button,
  image,
  images
){

  const card =
    button.closest(".card");


  card.querySelector(
    ".main"
  ).src =
    image;


  card.querySelectorAll(
    ".gallery img"
  ).forEach(
    img =>
      img.classList.remove(
        "active"
      )
  );


  button.classList.add(
    "active"
  );


  card.dataset.image =
    image;


  card.querySelector(
    ".main"
  ).onclick =
    () => {

      openLightbox(
        images.indexOf(image),
        images
      );

    };

}


/* =========================
   SELECT COLOR
========================= */

function selectColor(
  button,
  color,
  image
){

  const card =
    button.closest(".card");


  card.querySelectorAll(
    ".color-option"
  ).forEach(
    item =>
      item.classList.remove(
        "selected"
      )
  );


  button.classList.add(
    "selected"
  );


  card.dataset.color =
    color;


  if(image){

    card.querySelector(
      ".main"
    ).src =
      image;


    card.dataset.image =
      image;


    const images =
      JSON.parse(
        card.dataset.images || "[]"
      );


    card.querySelector(
      ".main"
    ).onclick =
      () => {

        openLightbox(
          Math.max(
            images.indexOf(image),
            0
          ),
          images
        );

      };

  }

}


/* =========================
   LIGHTBOX
========================= */

function openLightbox(
  index,
  images
){

  if(!images.length)
    return;


  currentImages =
    images;

  currentImageIndex =
    Math.max(index,0);


  updateLightbox();


  document
    .getElementById(
      "lightbox"
    )
    .classList.add(
      "show"
    );


  document.body.style.overflow =
    "hidden";

}


function updateLightbox(){

  document.getElementById(
    "lightboxImage"
  ).src =
    currentImages[
      currentImageIndex
    ];


  document.getElementById(
    "lightboxCounter"
  ).textContent =
    `${currentImageIndex + 1} / ${currentImages.length}`;

}


function closeLightbox(event){

  if(
    event &&
    event.target.id !==
    "lightbox"
  ){
    return;
  }


  document
    .getElementById(
      "lightbox"
    )
    .classList.remove(
      "show"
    );


  document.body.style.overflow =
    "";

}


function nextImage(event){

  if(event)
    event.stopPropagation();


  currentImageIndex++;


  if(
    currentImageIndex >=
    currentImages.length
  ){
    currentImageIndex = 0;
  }


  updateLightbox();

}


function previousImage(event){

  if(event)
    event.stopPropagation();


  currentImageIndex--;


  if(currentImageIndex < 0){

    currentImageIndex =
      currentImages.length - 1;

  }


  updateLightbox();

}


document.addEventListener(
  "keydown",
  event => {

    if(
      !document
        .getElementById(
          "lightbox"
        )
        .classList.contains(
          "show"
        )
    ){
      return;
    }


    if(
      event.key ===
      "ArrowLeft"
    ){
      nextImage();
    }


    if(
      event.key ===
      "ArrowRight"
    ){
      previousImage();
    }


    if(
      event.key ===
      "Escape"
    ){
      closeLightbox();
    }

  }
);


/* =========================
   CART
========================= */

function addProductToCart(
  button,
  product
){

  const card =
    button.closest(".card");


  const color =
    card.dataset.color || "";


  const image =
    card.dataset.image ||
    product.image ||
    "";


  const existing =
    cart.find(
      item =>
        item.id === product.id &&
        item.color === color
    );


  if(existing){

    existing.quantity++;

    existing.image =
      image;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:product.price,

      color:color,

      image:image,

      size:
        product.size ||
        "غير محدد",

      dimensions:
        product.dimensions ||
        "",

      quantity:1

    });

  }


  saveCart();

  openCart();

}


function saveCart(){

  localStorage.setItem(
    "amoCart",
    JSON.stringify(cart)
  );

  updateCartCount();

}


function updateCartCount(){

  const count =
    cart.reduce(
      (sum,item) =>
        sum + item.quantity,
      0
    );


  document.getElementById(
    "cartCount"
  ).textContent =
    count;

}


function openCart(){

  document.getElementById(
    "cartBox"
  ).style.display =
    "block";


  document.getElementById(
    "cartOverlay"
  ).style.display =
    "block";


  renderCart();

}


function closeCart(){

  document.getElementById(
    "cartBox"
  ).style.display =
    "none";


  document.getElementById(
    "cartOverlay"
  ).style.display =
    "none";

}


function addMoreProducts(){

  closeCart();


  setTimeout(
    () => {

      document
        .getElementById(
          "products"
        )
        .scrollIntoView({
          behavior:"smooth"
        });

    },
    100
  );

}


/* =========================
   TOTALS
========================= */

function getProductsTotal(){

  return cart.reduce(
    (sum,item) =>
      sum +
      item.price *
      item.quantity,
    0
  );

}


function getDeliveryFee(){

  return getProductsTotal() >= 49
    ? 0
    : 2;

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

  const container =
    document.getElementById(
      "cartItems"
    );


  const totalElement =
    document.getElementById(
      "cartTotal"
    );


  const deliveryInfo =
    document.getElementById(
      "deliveryInfo"
    );


  if(!cart.length){

    container.innerHTML = `

      <div class="loading">

        السلة فارغة 🛒

      </div>

    `;

    totalElement.textContent =
      "0";

    return;

  }


  let total = 0;


  container.innerHTML = "";


  cart.forEach(
    (item,index) => {

      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      container.innerHTML += `

        <div class="cart-item">

          <div class="cart-product">

            <img
              class="cart-product-image"
              src="${item.image || ""}"
              alt="${item.name}">

            <div
              class="cart-product-info">

              <h3>
                ${item.name}
              </h3>

              <p>
                رقم المنتج: #${item.id}
              </p>

              <p>
                🎨 اللون:
                ${item.color}
              </p>

              <p>
                📏 الحجم:
                ${item.size || "غير محدد"}
              </p>

              ${
                item.dimensions
                ? `
                <p>
                  📐 الأبعاد:
                  ${item.dimensions}
                </p>
                `
                : ""
              }

              <p>
                💵 السعر:
                ${item.price}
                دينار
              </p>

            </div>

          </div>


          <div class="quantity">

            <button
              onclick="
                changeQuantity(
                  ${index},
                  -1
                )
              ">

              −

            </button>

            <strong>
              ${item.quantity}
            </strong>

            <button
              onclick="
                changeQuantity(
                  ${index},
                  1
                )
              ">

              +

            </button>

            <button
              class="delete"
              onclick="
                removeFromCart(
                  ${index}
                )
              ">

              حذف

            </button>

          </div>


          <p
            style="
              margin-top:12px;
              font-weight:bold;
            ">

            المجموع:
            ${itemTotal}
            دينار

          </p>

        </div>

      `;

    }
  );


  const delivery =
    total >= 49
    ? 0
    : 2;


  totalElement.textContent =
    total + delivery;


  deliveryInfo.innerHTML =
    total >= 49
    ? "🎉 مبروك! التوصيل مجاني لطلبك"
    : "🚚 التوصيل 2 دينار — يصبح مجانيًا عند 49 دينار فأكثر";


  updateCartCount();

}


function changeQuantity(
  index,
  amount
){

  cart[index].quantity +=
    amount;


  if(
    cart[index].quantity <= 0
  ){

    cart.splice(
      index,
      1
    );

  }


  saveCart();

  renderCart();

}


function removeFromCart(
  index
){

  cart.splice(
    index,
    1
  );


  saveCart();

  renderCart();

}
