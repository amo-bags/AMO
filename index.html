<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AMO | متجر الحقائب</title>

<style>

/* =========================
   GENERAL
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f8f6f1;
  color:#171717;
}

button{
  font-family:Arial,sans-serif;
}


/* =========================
   HEADER
========================= */

header{
  background:#111;
  color:white;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  letter-spacing:4px;
}

nav a{
  color:white;
  text-decoration:none;
  margin-right:18px;
  font-size:14px;
}

.cart-button{
  background:white;
  color:#111;
  border:0;
  padding:10px 16px;
  border-radius:25px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
}

.cart-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#111;
  color:white;
  width:22px;
  height:22px;
  border-radius:50%;
  margin-right:5px;
  font-size:12px;
}


/* =========================
   HERO
========================= */

.hero{
  text-align:center;
  padding:65px 20px;
  background:#eee9df;
}

.hero h1{
  font-size:40px;
  margin-bottom:18px;
}

.hero p{
  font-size:18px;
  color:#555;
  margin-bottom:25px;
}

.btn{
  background:#111;
  color:white;
  border:0;
  padding:14px 25px;
  border-radius:30px;
  font-size:15px;
  cursor:pointer;
  text-decoration:none;
}


/* =========================
   PRODUCTS
========================= */

.products{
  padding:50px 5%;
}

.title{
  text-align:center;
  font-size:30px;
  margin-bottom:35px;
}

.grid{
  max-width:700px;
  margin:auto;
}


/* =========================
   PRODUCT CARD
========================= */

.card{
  background:white;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 5px 25px #0001;
  margin-bottom:30px;
}

.main{
  width:100%;
  height:500px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}


/* =========================
   GALLERY
========================= */

.gallery{
  display:flex;
  gap:9px;
  padding:12px;
  overflow-x:auto;
  background:white;
}

.gallery img{
  width:70px;
  height:70px;
  min-width:70px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid transparent;
  cursor:pointer;
  transition:.2s;
}

.gallery img:hover{
  transform:scale(1.04);
}

.gallery img.active{
  border-color:#111;
}


/* =========================
   PRODUCT INFO
========================= */

.info{
  padding:25px;
}

.info h2{
  font-size:27px;
  margin-bottom:14px;
}

.price{
  font-size:27px;
  font-weight:bold;
  margin-bottom:20px;
}


/* =========================
   SIZE
========================= */

.product-size-box{
  background:#f7f5f0;
  border-radius:15px;
  padding:15px;
  margin-bottom:20px;
}

.product-size-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 0;
  font-size:15px;
}

.product-size-row span{
  color:#666;
}

.product-size-row strong{
  color:#111;
}


/* =========================
   COLORS
========================= */

.color-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:12px;
}

.colors{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:22px;
}

.color-option{
  display:flex;
  align-items:center;
  gap:8px;
  background:white;
  border:1px solid #ddd;
  padding:8px 13px;
  border-radius:30px;
  cursor:pointer;
  transition:.2s;
  font-size:14px;
}

.color-option:hover{
  border-color:#999;
}

.color-option.selected{
  border:2px solid #111;
  padding:7px 12px;
  background:#f7f7f7;
}

.color-circle{
  width:24px;
  height:24px;
  min-width:24px;
  border-radius:50%;
  border:2px solid white;
  box-shadow:0 0 0 1px #aaa;
}

.color-name{
  font-weight:bold;
}


/* =========================
   ADD BUTTON
========================= */

.add-button{
  width:100%;
  font-size:16px;
  padding:16px;
}


/* =========================
   IMAGE LIGHTBOX
========================= */

.lightbox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  z-index:10000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.lightbox.show{
  display:flex;
}

.lightbox-image{
  max-width:92vw;
  max-height:88vh;
  object-fit:contain;
  border-radius:10px;
}

.lightbox-close{
  position:absolute;
  top:18px;
  right:20px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:white;
  color:#111;
  font-size:28px;
  cursor:pointer;
  z-index:10002;
}

.lightbox-prev,
.lightbox-next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:white;
  color:#111;
  font-size:25px;
  cursor:pointer;
  z-index:10002;
}

.lightbox-prev{
  right:20px;
}

.lightbox-next{
  left:20px;
}

.lightbox-counter{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:#0008;
  padding:8px 15px;
  border-radius:20px;
  font-size:14px;
}


/* =========================
   CART OVERLAY
========================= */

.cart-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0007;
  z-index:9998;
}


/* =========================
   CART
========================= */

.cart{
  position:fixed;
  top:0;
  right:0;
  width:100%;
  max-width:450px;
  height:100vh;
  background:white;
  z-index:9999;
  padding:22px;
  overflow-y:auto;
  box-shadow:-5px 0 25px #0004;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  padding-bottom:15px;
  border-bottom:1px solid #ddd;
}

.cart-header h2{
  font-size:24px;
}

.close-cart{
  width:38px;
  height:38px;
  border:0;
  background:#eee;
  border-radius:50%;
  font-size:22px;
  cursor:pointer;
}


/* =========================
   CART ITEM
========================= */

.cart-item{
  border-bottom:1px solid #ddd;
  padding:18px 0;
}

.cart-product{
  display:flex;
  gap:12px;
  align-items:center;
}

.cart-product-image{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:12px;
  flex-shrink:0;
}

.cart-product-info{
  flex:1;
}

.cart-item h3{
  font-size:18px;
  margin-bottom:8px;
}

.cart-item p{
  margin:5px 0;
  color:#555;
}


/* =========================
   QUANTITY
========================= */

.quantity{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:12px;
}

.quantity button{
  width:36px;
  height:36px;
  border:0;
  background:#eee;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.quantity strong{
  min-width:25px;
  text-align:center;
}


/* =========================
   DELETE
========================= */

.delete{
  margin-right:auto !important;
  width:auto !important;
  min-width:0 !important;
  height:auto !important;
  padding:6px 10px !important;
  border:0 !important;
  background:#eee !important;
  border-radius:20px !important;
  cursor:pointer !important;
  font-size:12px !important;
  line-height:1 !important;
  font-weight:normal !important;
}


/* =========================
   CUSTOMER FORM
========================= */

.customer-form{
  margin-top:25px;
  padding-top:20px;
  border-top:2px solid #111;
}

.customer-form h3{
  font-size:21px;
  margin-bottom:18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:15px;
  font-family:Arial;
  background:white;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}


/* =========================
   TOTAL
========================= */

.cart-total{
  border-top:2px solid #111;
  margin-top:20px;
  padding-top:20px;
}

.cart-total h3{
  font-size:22px;
}


/* =========================
   DELIVERY
========================= */

.delivery-info{
  margin-top:12px;
  padding:12px;
  background:#f4f1ea;
  border-radius:12px;
  text-align:center;
  font-size:14px;
  color:#444;
}


/* =========================
   MORE PRODUCTS
========================= */

.more-products-button{
  width:100%;
  margin-top:12px;
  background:#eee;
  color:#111;
  border:0;
  padding:14px;
  border-radius:30px;
  font-size:15px;
  cursor:pointer;
}


/* =========================
   WHATSAPP
========================= */

.whatsapp-button{
  width:100%;
  margin-top:12px;
  background:#111;
  color:white;
  border:0;
  padding:15px;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
}


/* =========================
   EMPTY CART
========================= */

.empty-cart{
  text-align:center;
  padding:50px 10px;
  color:#777;
  font-size:18px;
}


/* =========================
   FOOTER
========================= */

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:35px;
  margin-top:40px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  header{
    padding:16px 4%;
  }

  .logo{
    font-size:25px;
  }

  nav{
    display:none;
  }

  .hero{
    padding:50px 20px;
  }

  .hero h1{
    font-size:32px;
  }

  .main{
    height:420px;
  }

  .info{
    padding:22px;
  }

  .info h2{
    font-size:24px;
  }

  .price{
    font-size:25px;
  }

  .lightbox{
    padding:10px;
  }

  .lightbox-image{
    max-width:96vw;
    max-height:82vh;
  }

  .lightbox-prev,
  .lightbox-next{
    width:42px;
    height:42px;
    font-size:21px;
  }

  .lightbox-prev{
    right:10px;
  }

  .lightbox-next{
    left:10px;
  }

  .cart{
    max-width:100%;
  }

}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="logo">
    AMO
  </div>

  <nav>

    <a href="#home">
      الرئيسية
    </a>

    <a href="#products">
      الحقائب
    </a>

    <a href="#contact">
      تواصل معنا
    </a>

  </nav>

  <button
    class="cart-button"
    onclick="openCart()">

    🛒 السلة

    <span
      id="cartCount"
      class="cart-count">
      0
    </span>

  </button>

</header>


<!-- =========================
     HERO
========================= -->

<section
  class="hero"
  id="home">

  <h1>
    اختاري شنطتك بستايلك الخاص
  </h1>

  <p>
    حقائب أنيقة تناسب كل إطلالة ✨
  </p>

  <a
    href="#products"
    class="btn">

    اكتشفي الحقائب

  </a>

</section>


<!-- =========================
     PRODUCTS
========================= -->

<section
  class="products"
  id="products">

  <h2 class="title">
    أحدث الحقائب
  </h2>

  <div
    class="grid"
    id="productsGrid">
  </div>

</section>


<!-- =========================
     IMAGE LIGHTBOX
========================= -->

<div
  id="lightbox"
  class="lightbox"
  onclick="closeLightbox(event)">

  <button
    class="lightbox-close"
    onclick="closeLightbox()">

    ×

  </button>

  <button
    class="lightbox-prev"
    onclick="previousImage(event)">

    ❯

  </button>

  <img
    id="lightboxImage"
    class="lightbox-image"
    src=""
    alt="">

  <button
    class="lightbox-next"
    onclick="nextImage(event)">

    ❮

  </button>

  <div
    id="lightboxCounter"
    class="lightbox-counter">

    1 / 1

  </div>

</div>


<!-- =========================
     CART OVERLAY
========================= -->

<div
  id="cartOverlay"
  class="cart-overlay"
  onclick="closeCart()">
</div>


<!-- =========================
     CART
========================= -->

<div
  id="cartBox"
  class="cart"
  style="display:none;">

  <div class="cart-header">

    <h2>
      🛒 سلة المشتريات
    </h2>

    <button
      class="close-cart"
      onclick="closeCart()">

      ×

    </button>

  </div>


  <div id="cartItems">
  </div>


  <!-- CUSTOMER -->

  <div
    id="customerForm"
    class="customer-form">

    <h3>

    </h3>


    <div class="form-group">

      <label>

      <input
        id="customerName"
        type="text"
        placeholder="اكتبي اسمك الكامل">

    </div>


    <div class="form-group">

      <label>

      </label>

      <input
        id="customerPhone"
        type="tel"

    </div>


    <div class="form-group">

      <label>
        المحافظة *
      </label>

        <option value="">
          اختاري المحافظة
        </option>

        <option>عمّان</option>
        <option>الزرقاء</option>
        <option>إربد</option>
        <option>البلقاء</option>
        <option>مادبا</option>
        <option>جرش</option>
        <option>عجلون</option>
        <option>المفرق</option>
        <option>الكرك</option>
        <option>الطفيلة</option>

    <div

      للطلبات الأقل من 49 دينار

      class="more-products-button"
      onclick="addMoreProducts()">

      🛍️ إضافة المزيد من المنتجات

    </button>

    </button>

<!-- =========================
     FOOTER
========================= -->

<footer id="contact">

  <div class="logo">
    AMO
  </div>

  <p style="margin-top:10px;">
    متجر الحقائب
  </p>

</footer>


<!-- =========================
     PRODUCTS DATA
========================= -->

<script src="products.js"></script>


<script>

/* =========================
   VARIABLES
========================= */

const grid =
  document.getElementById("productsGrid");

let cart =
  JSON.parse(
    localStorage.getItem("amoCart") || "[]"
  );


/* =========================
   LIGHTBOX VARIABLES
========================= */

let currentImages = [];
let currentImageIndex = 0;


/* =========================
   DISPLAY PRODUCTS
========================= */

products.forEach(product => {

  let images = [
    ...(product.gallery || [])
  ];


  (product.colors || []).forEach(color => {

    if(color.image){
      images.push(color.image);
    }

  });


  if(product.image){
    images.push(product.image);
  }


  images = [
    ...new Set(images)
  ];


  const firstImage =
    product.colors?.[0]?.image ||
    product.image ||
    images[0] ||
    "";


  const firstColor =
    product.colors?.[0]?.name ||
    "";


  const card =
    document.createElement("div");

  card.className = "card";


  /* =========================
     GALLERY
  ========================= */

  const galleryHTML =
    images.map((image,index) => {

      return `

        <img
          src="${image}"
          class="${index === 0 ? "active" : ""}"
          alt="${product.name}"
          onclick="changeImage(
            this,
            '${image}',
            ${JSON.stringify(images)}
          )">

      `;

    }).join("");


  /* =========================
     COLORS
  ========================= */

  const colorsHTML =
    (product.colors || [])
      .map((color,index) => {

        return `

          <button
            class="color-option ${
              index === 0 ? "selected" : ""
            }"
            onclick="selectColor(
              this,
              '${color.name}',
              '${color.image || ""}'
            )">

            <span
              class="color-circle"
              style="background:${color.value}">
            </span>

            <span class="color-name">
              ${color.name}
            </span>

          </button>

        `;

      }).join("");


  /* =========================
     CARD
  ========================= */

  card.innerHTML = `

    <img
      class="main"
      src="${firstImage}"
      alt="${product.name}"
      onclick='openLightbox(
        0,
        ${JSON.stringify(images)}
      )'>


    <div class="gallery">

      ${galleryHTML}

    </div>


    <div class="info">

      <h2>
        ${product.name}
      </h2>


      <div class="price">

        ${product.price}
        دينار

      </div>


      <!-- SIZE -->

      <div class="product-size-box">

        <div class="product-size-row">

          <span>
            📏 الحجم
          </span>

          <strong>
            ${product.size || "غير محدد"}
          </strong>

        </div>


        ${
          product.dimensions
          ? `
          <div class="product-size-row">

            <span>
              📐 الأبعاد
            </span>

            <strong>
              ${product.dimensions}
            </strong>

          </div>
          `
          : ""
        }

      </div>


      <!-- COLORS -->

      ${
        colorsHTML
        ? `
        <div class="color-title">
          اختاري اللون:
        </div>

        <div class="colors">
          ${colorsHTML}
        </div>
        `
        : ""
      }


      <button
        class="btn add-button"
        onclick="
          addProductToCart(
            this,
            '${product.id}',
            '${product.name}',
            ${product.price}
          )
        ">

        🛒 أضف إلى السلة

      </button>

    </div>

  `;


  card.dataset.color =
    firstColor;


  card.dataset.image =
    firstImage;


  card.dataset.images =
    JSON.stringify(images);


  grid.appendChild(card);

});


/* =========================
   CHANGE IMAGE
========================= */

function changeImage(
  button,
  image,
  images
){

  const card =
    button.closest(".card");


  card.querySelector(".main").src =
    image;


  card.querySelectorAll(
    ".gallery img"
  ).forEach(img => {

    img.classList.remove("active");

  });


  button.classList.add("active");


  card.dataset.image =
    image;


  const index =
    images.indexOf(image);


  card.querySelector(".main")
    .onclick = function(){

      openLightbox(
        index >= 0 ? index : 0,
        images
      );

    };

}


/* =========================
   SELECT COLOR
========================= */

function selectColor(
  button,
  color,
  image
){

  const card =
    button.closest(".card");


  card.querySelectorAll(
    ".color-option"
  ).forEach(item => {

    item.classList.remove(
      "selected"
    );

  });


  button.classList.add(
    "selected"
  );


  card.dataset.color =
    color;


  if(image){

    card.querySelector(".main").src =
      image;

    card.dataset.image =
      image;


    const images =
      JSON.parse(
        card.dataset.images || "[]"
      );


    const index =
      images.indexOf(image);


    card.querySelector(".main")
      .onclick = function(){

        openLightbox(
          index >= 0 ? index : 0,
          images
        );

      };

  }

}


/* =========================
   OPEN LIGHTBOX
========================= */

function openLightbox(
  index,
  images
){

  if(!images || images.length === 0){
    return;
  }


  currentImages =
    images;


  currentImageIndex =
    index;


  updateLightbox();


  document
    .getElementById("lightbox")
    .classList.add("show");


  document.body.style.overflow =
    "hidden";

}


/* =========================
   UPDATE LIGHTBOX
========================= */

function updateLightbox(){

  const image =
    document.getElementById(
      "lightboxImage"
    );

  const counter =
    document.getElementById(
      "lightboxCounter"
    );


  image.src =
    currentImages[
      currentImageIndex
    ];


  counter.textContent =
    `${currentImageIndex + 1} / ${currentImages.length}`;

}


/* =========================
   CLOSE LIGHTBOX
========================= */

function closeLightbox(event){

  if(
    event &&
    event.target &&
    event.target.id !== "lightbox"
  ){
    return;
  }


  document
    .getElementById("lightbox")
    .classList.remove("show");


  document.body.style.overflow =
    "";

}


/* =========================
   NEXT IMAGE
========================= */

function nextImage(event){

  if(event){
    event.stopPropagation();
  }


  if(currentImages.length === 0){
    return;
  }


  currentImageIndex++;


  if(
    currentImageIndex >=
    currentImages.length
  ){

    currentImageIndex = 0;

  }


  updateLightbox();

}


/* =========================
   PREVIOUS IMAGE
========================= */

function previousImage(event){

  if(event){
    event.stopPropagation();
  }


  if(currentImages.length === 0){
    return;
  }


  currentImageIndex--;


  if(currentImageIndex < 0){

    currentImageIndex =
      currentImages.length - 1;

  }


  updateLightbox();

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  function(event){

    const lightbox =
      document.getElementById(
        "lightbox"
      );


    if(
      !lightbox.classList.contains(
        "show"
      )
    ){
      return;
    }


    if(event.key === "ArrowLeft"){
      nextImage();
    }


    if(event.key === "ArrowRight"){
      previousImage();
    }


    if(event.key === "Escape"){
      document
        .getElementById("lightbox")
        .classList.remove("show");

      document.body.style.overflow =
        "";

    }

  }
);


/* =========================
   ADD TO CART
========================= */

function addProductToCart(
  button,
  id,
  name,
  price
){

  const card =
    button.closest(".card");


  const color =
    card.dataset.color || "";


  const image =
    card.dataset.image ||
    card.querySelector(".main").src;


  const product =
    products.find(
      item => item.id === id
    );


  const size =
    product?.size ||
    "غير محدد";


  const dimensions =
    product?.dimensions ||
    "";


  const existing =
    cart.find(
      item =>
        item.id === id &&
        item.color === color
    );


  if(existing){

    existing.quantity += 1;

    existing.image =
      image;

    existing.size =
      size;

    existing.dimensions =
      dimensions;

  }else{

    cart.push({

      id:id,

      name:name,

      price:price,

      color:color,

      image:image,

      size:size,

      dimensions:dimensions,

      quantity:1

    });

  }


  saveCart();

  openCart();

}


/* =========================
   SAVE CART
========================= */

function saveCart(){

  localStorage.setItem(
    "amoCart",
    JSON.stringify(cart)
  );


  updateCartCount();

}


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

  const count =
    cart.reduce(
      (total,item) =>
        total + item.quantity,
      0
    );


  document.getElementById(
    "cartCount"
  ).textContent =
    count;

}


/* =========================
   OPEN CART
========================= */

function openCart(){

  document.getElementById(
    "cartBox"
  ).style.display =
    "block";


  document.getElementById(
    "cartOverlay"
  ).style.display =
    "block";


  renderCart();

}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

  document.getElementById(
    "cartBox"
  ).style.display =
    "none";


  document.getElementById(
    "cartOverlay"
  ).style.display =
    "none";

}


/* =========================
   ADD MORE
========================= */

function addMoreProducts(){

  closeCart();


  setTimeout(() => {

    document
      .getElementById("products")
      .scrollIntoView({
        behavior:"smooth"
      });

  },100);

}


/* =========================
   PRODUCTS TOTAL
========================= */

function getProductsTotal(){

  return cart.reduce(
    (total,item) => {

      return total +
        (
          item.price *
          item.quantity
        );

    },
    0
  );

}


/* =========================
   DELIVERY
========================= */

function getDeliveryFee(){

  const total =
    getProductsTotal();


  if(total >= 49){
    return 0;
  }


  return 2;

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

  const container =
    document.getElementById(
      "cartItems"
    );


  const totalElement =
    document.getElementById(
      "cartTotal"
    );


  const deliveryInfo =
    document.getElementById(
      "deliveryInfo"
    );


  if(cart.length === 0){

    container.innerHTML = `

      <div class="empty-cart">

        السلة فارغة 🛒

      </div>

    `;


    totalElement.textContent =
      "0";


    deliveryInfo.innerHTML =
      "🚚 التوصيل 2 دينار للطلبات الأقل من 49 دينار";


    updateCartCount();

    return;

  }


  let total = 0;


  container.innerHTML =
    "";


  cart.forEach(
    (item,index) => {


      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      container.innerHTML += `

        <div class="cart-item">

          <div class="cart-product">

            <img
              class="cart-product-image"
              src="${item.image || ""}"
              alt="${item.name}">


            <div
              class="cart-product-info">

              <h3>
                ${item.name}
              </h3>


              <p>
                رقم المنتج:
                #${item.id}
              </p>


              <p>
                🎨 اللون:
                ${item.color}
              </p>


              <p>
                📏 الحجم:
                ${item.size || "غير محدد"}
              </p>


              ${
                item.dimensions
                ? `
                <p>
                  📐 الأبعاد:
                  ${item.dimensions}
                </p>
                `
                : ""
              }


              <p>
                💵 السعر:
                ${item.price}
                دينار
              </p>

            </div>

          </div>


          <div class="quantity">

            <button
              onclick="
                changeQuantity(
                  ${index},
                  -1
                )
              ">

              −

            </button>


            <strong>
              ${item.quantity}
            </strong>


            <button
              onclick="
                changeQuantity(
                  ${index},
                  1
                )
              ">

              +

            </button>


            <button
              class="delete"
              onclick="
                removeFromCart(
                  ${index}
                )
              ">

              حذف

            </button>

          </div>


          <p
            style="
              margin-top:12px;
              font-weight:bold;
            ">

            المجموع:

            ${itemTotal}

            دينار

          </p>

        </div>

      `;

    }
  );


  const deliveryFee =
    getDeliveryFee();


  const finalTotal =
    total +
    deliveryFee;


  totalElement.textContent =
    finalTotal;


  if(total >= 49){

    deliveryInfo.innerHTML =
      "🎉 مبروك! التوصيل مجاني لطلبك";

  }else{

    deliveryInfo.innerHTML =
      "🚚 التوصيل 2 دينار — يصبح مجانيًا عند 49 دينار فأكثر";

  }


  updateCartCount();

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(
  index,
  amount
){

  cart[index].quantity +=
    amount;


  if(
    cart[index].quantity <= 0
  ){

    cart.splice(
      index,
      1
    );

  }


  saveCart();

  renderCart();

}


/* =========================
   REMOVE
========================= */

function removeFromCart(
  index
){

  cart.splice(
    index,
    1
  );


  saveCart();

  renderCart();

}
