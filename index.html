<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMO | متجر الحقائب</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f8f6f2;
  color:#222;
  min-height:100vh
}

button,input,textarea{
  font-family:inherit
}

button{
  cursor:pointer
}

/* ================= HEADER ================= */

header{
  background:#fff;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:100
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:2px
}

.icon-btn{
  border:1px solid #ddd;
  background:#fff;
  border-radius:50%;
  width:45px;
  height:45px;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center
}

.cart-btn{
  position:relative
}

.cart-count{
  position:absolute;
  top:-5px;
  left:-5px;
  background:#111;
  color:#fff;
  width:21px;
  height:21px;
  border-radius:50%;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center
}

/* ================= MAIN ================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 15px 50px
}

.page-title{
  text-align:center;
  margin:10px 0 25px
}

.page-title h1{
  font-size:30px;
  margin-bottom:8px
}

.page-title p{
  color:#777
}

.search-box{
  max-width:600px;
  margin:0 auto 30px;
  position:relative
}

.search-box input{
  width:100%;
  padding:15px 50px 15px 18px;
  border:1px solid #ddd;
  border-radius:14px;
  background:#fff;
  outline:none;
  font-size:16px
}

.search-box span{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:20px
}

.products-count{
  margin-bottom:15px;
  color:#777
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px
}

.product-card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #eee;
  transition:.25s;
  cursor:pointer
}

.product-card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(0,0,0,.08)
}

.product-image-wrap{
  height:300px;
  background:#f4f4f4;
  position:relative;
  overflow:hidden
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.product-info{
  padding:15px
}

.product-name{
  font-size:18px;
  font-weight:bold;
  margin-bottom:7px
}

.product-price{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px
}

.colors{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:13px
}

.color-option{
  width:29px;
  height:29px;
  border-radius:50%;
  border:2px solid #ddd;
  position:relative;
  padding:0
}

.color-option.active{
  border:2px solid #111
}

.color-option.active::after{
  content:"✓";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  color:#fff;
  text-shadow:0 1px 2px #000
}

.add-btn{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  font-weight:bold
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#777;
  display:none
}

/* ================= PRODUCT DETAILS ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px
}

.modal.show{
  display:flex
}

.modal-content{
  background:#fff;
  width:min(950px,100%);
  max-height:95vh;
  overflow:auto;
  border-radius:22px;
  position:relative
}

.modal-close{
  position:absolute;
  top:12px;
  left:12px;
  z-index:10;
  width:42px;
  height:42px;
  border-radius:50%;
  border:0;
  background:#fff;
  box-shadow:0 3px 15px rgba(0,0,0,.15);
  font-size:24px
}

.modal-body{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:25px;
  padding:25px
}

.main-image-box{
  width:100%;
  height:550px;
  background:#f5f5f5;
  border-radius:18px;
  overflow:hidden
}

.main-image{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  cursor:zoom-in
}

.gallery-thumbs{
  display:flex;
  gap:8px;
  margin-top:12px;
  overflow-x:auto;
  padding-bottom:5px
}

.gallery-thumb{
  width:75px;
  height:75px;
  min-width:75px;
  border-radius:10px;
  overflow:hidden;
  border:2px solid transparent;
  background:#f5f5f5;
  padding:0
}

.gallery-thumb.active{
  border-color:#111
}

.gallery-thumb img{
  width:100%;
  height:100%;
  object-fit:cover
}

.details{
  padding:15px 5px
}

.details h2{
  font-size:27px;
  margin-bottom:12px
}

.details-price{
  font-size:23px;
  font-weight:bold;
  margin-bottom:22px
}

.detail-row{
  margin-bottom:20px
}

.detail-title{
  font-weight:bold;
  margin-bottom:9px
}

.detail-value{
  color:#666;
  line-height:1.7
}

.modal-colors{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.modal-color{
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:8px
}

.modal-color.active{
  border-color:#111
}

.modal-color-dot{
  width:22px;
  height:22px;
  border-radius:50%;
  border:1px solid #ccc
}

.modal-add{
  width:100%;
  background:#111;
  color:#fff;
  border:0;
  padding:15px;
  border-radius:13px;
  font-size:16px;
  font-weight:bold;
  margin-top:10px
}

/* ================= IMAGE VIEWER ================= */

.image-viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.96);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px
}

.image-viewer.show{
  display:flex
}

.viewer-image{
  max-width:95vw;
  max-height:90vh;
  object-fit:contain
}

.viewer-close,
.viewer-prev,
.viewer-next{
  position:absolute;
  border:0;
  border-radius:50%;
  background:#fff;
  z-index:5
}

.viewer-close{
  top:15px;
  left:15px;
  width:48px;
  height:48px;
  font-size:28px
}

.viewer-prev,
.viewer-next{
  top:50%;
  transform:translateY(-50%);
  width:50px;
  height:50px;
  font-size:27px
}

.viewer-prev{
  right:20px
}

.viewer-next{
  left:20px
}

.viewer-counter{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  background:rgba(0,0,0,.5);
  padding:8px 15px;
  border-radius:20px
}

/* ================= CART ================= */

.side-panel{
  position:fixed;
  top:0;
  right:-500px;
  width:min(500px,100%);
  height:100vh;
  background:#fff;
  z-index:700;
  box-shadow:-10px 0 40px rgba(0,0,0,.15);
  transition:.3s;
  display:flex;
  flex-direction:column
}

.side-panel.show{
  right:0
}

.panel-header{
  padding:18px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.panel-header h2{
  font-size:21px
}

.panel-close{
  border:0;
  background:#f4f4f4;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px
}

.cart-items{
  flex:1;
  overflow:auto;
  padding:15px
}

.cart-item{
  display:flex;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #eee
}

.cart-item img{
  width:80px;
  height:80px;
  border-radius:12px;
  object-fit:cover;
  background:#f5f5f5
}

.cart-item-info{
  flex:1
}

.cart-item-name{
  font-weight:bold;
  margin-bottom:5px
}

.cart-item-color{
  color:#777;
  font-size:13px;
  margin-bottom:5px
}

.cart-item-price{
  font-weight:bold
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px
}

.qty button{
  width:30px;
  height:30px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px
}

.remove-item{
  border:0;
  background:none;
  color:#c00;
  margin-top:5px;
  font-size:12px
}

.cart-footer{
  border-top:1px solid #eee;
  padding:15px
}

.total-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px
}

.total-row.final{
  font-size:19px;
  font-weight:bold;
  padding-top:8px;
  border-top:1px solid #eee;
  margin-top:10px
}

.checkout-btn{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  padding:15px;
  border-radius:13px;
  margin-top:12px;
  font-size:16px;
  font-weight:bold
}

/* ================= CHECKOUT ================= */

.checkout{
  position:fixed;
  inset:0;
  background:#f8f6f2;
  z-index:800;
  display:none;
  overflow:auto
}

.checkout.show{
  display:block
}

.checkout-inner{
  max-width:700px;
  margin:auto;
  padding:20px 15px 50px
}

.checkout-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px
}

.checkout-header button{
  border:0;
  background:#fff;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:20px
}

.checkout-box{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px
}

.checkout-box h3{
  margin-bottom:15px
}

.form-group{
  margin-bottom:14px
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:7px
}

.form-group input,
.form-group textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:11px;
  outline:none;
  font-size:15px
}

.form-group textarea{
  min-height:90px;
  resize:vertical
}

.whatsapp-btn{
  width:100%;
  background:#111;
  color:#fff;
  border:0;
  padding:16px;
  border-radius:13px;
  font-size:17px;
  font-weight:bold
}

/* ================= OVERLAY / TOAST ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:650;
  display:none
}

.overlay.show{
  display:block
}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#111;
  color:#fff;
  padding:13px 20px;
  border-radius:30px;
  z-index:1500;
  transition:.3s;
  opacity:0;
  max-width:90%;
  text-align:center
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .products-grid{
    grid-template-columns:repeat(3,1fr)
  }

  .modal-body{
    grid-template-columns:1fr
  }

  .main-image-box{
    height:500px
  }
}

@media(max-width:650px){

  .header-inner{
    padding:12px 14px
  }

  .logo{
    font-size:24px
  }

  .container{
    padding:20px 10px 40px
  }

  .products-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px
  }

  .product-image-wrap{
    height:230px
  }

  .product-info{
    padding:11px
  }

  .product-name{
    font-size:15px
  }

  .product-price{
    font-size:16px
  }

  .color-option{
    width:25px;
    height:25px
  }

  .add-btn{
    padding:11px 5px;
    font-size:13px
  }

  .modal{
    padding:0
  }

  .modal-content{
    width:100%;
    height:100%;
    max-height:100vh;
    border-radius:0
  }

  .modal-body{
    padding:12px
  }

  .main-image-box{
    height:55vh;
    min-height:330px
  }

  .details{
    padding:5px
  }

  .details h2{
    font-size:23px
  }

  .viewer-prev,
  .viewer-next{
    width:42px;
    height:42px
  }

  .viewer-prev{
    right:10px
  }

  .viewer-next{
    left:10px
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">AMO</div>

    <button
      class="icon-btn cart-btn"
      onclick="openCart()"
      aria-label="السلة"
    >
      🛒
      <span class="cart-count" id="cartCount">0</span>
    </button>

  </div>
</header>

<main class="container">

  <div class="page-title">
    <h1>AMO Bags</h1>
    <p>اختاري شنطتك المفضلة</p>
  </div>

  <div class="search-box">
    <span>🔍</span>

    <input
      id="searchInput"
      type="search"
      placeholder="ابحثي باسم أو رقم الشنطة..."
      oninput="searchProducts()"
    >
  </div>

  <div
    class="products-count"
    id="productsCount"
  >
    جاري تحميل المنتجات...
  </div>

  <div
    class="products-grid"
    id="productsGrid"
  ></div>

  <div
    class="empty"
    id="emptyProducts"
  >
    لا يوجد منتج مطابق للبحث.
  </div>

</main>

<!-- ================= DETAILS ================= -->

<div
  class="modal"
  id="productModal"
  onclick="closeModalFromOutside(event)"
>

  <div class="modal-content">

    <button
      class="modal-close"
      onclick="closeProductModal()"
    >
      ×
    </button>

    <div class="modal-body">

      <div>

        <div class="main-image-box">

          <img
            id="modalMainImage"
            class="main-image"
            src=""
            alt=""
            onclick="openImageViewer()"
          >

        </div>

        <div
          class="gallery-thumbs"
          id="galleryThumbs"
        ></div>

      </div>

      <div class="details">

        <h2 id="modalProductName"></h2>

        <div
          class="details-price"
          id="modalProductPrice"
        ></div>

        <div class="detail-row">

          <div class="detail-title">
            اللون
          </div>

          <div
            class="modal-colors"
            id="modalColors"
          ></div>

        </div>

        <div class="detail-row">

          <div class="detail-title">
            الحجم
          </div>

          <div
            class="detail-value"
            id="modalSizes"
          ></div>

        </div>

        <div class="detail-row">

          <div class="detail-title">
            الأبعاد
          </div>

          <div
            class="detail-value"
            id="modalDimensions"
          ></div>

        </div>

        <button
          class="modal-add"
          onclick="addSelectedProductToCart()"
        >
          إضافة إلى السلة
        </button>

      </div>

    </div>

  </div>

</div>

<!-- ================= IMAGE VIEWER ================= -->

<div
  class="image-viewer"
  id="imageViewer"
  onclick="closeViewerFromOutside(event)"
>

  <button
    class="viewer-close"
    onclick="closeImageViewer()"
  >
    ×
  </button>

  <button
    class="viewer-prev"
    onclick="viewerPrev(event)"
  >
    ❯
  </button>

  <img
    id="viewerImage"
    class="viewer-image"
    src=""
    alt=""
  >

  <button
    class="viewer-next"
    onclick="viewerNext(event)"
  >
    ❮
  </button>

  <div
    class="viewer-counter"
    id="viewerCounter"
  >
    1 / 1
  </div>

</div>

<div
  class="overlay"
  id="overlay"
  onclick="closeCart()"
></div>

<!-- ================= CART ================= -->

<aside
  class="side-panel"
  id="cartPanel"
>

  <div class="panel-header">

    <h2>
      سلة المشتريات
    </h2>

    <button
      class="panel-close"
      onclick="closeCart()"
    >
      ×
    </button>

  </div>

  <div
    class="cart-items"
    id="cartItems"
  ></div>

  <div class="cart-footer">

    <div class="total-row">
      <span>المجموع</span>
      <strong id="subtotal">
        0.00 د.أ
      </strong>
    </div>

    <div class="total-row">
      <span>التوصيل</span>
      <strong id="delivery">
        2.00 د.أ
      </strong>
    </div>

    <div class="total-row final">
      <span>الإجمالي</span>
      <strong id="grandTotal">
        0.00 د.أ
      </strong>
    </div>

    <button
      class="checkout-btn"
      onclick="openCheckout()"
    >
      متابعة الطلب
    </button>

  </div>

</aside>

<!-- ================= CHECKOUT ================= -->

<div
  class="checkout"
  id="checkout"
>

  <div class="checkout-inner">

    <div class="checkout-header">

      <h2>
        معلومات التوصيل
      </h2>

      <button
        onclick="closeCheckout()"
      >
        ×
      </button>

    </div>

    <div class="checkout-box">

      <h3>
        بيانات العميل
      </h3>

      <div class="form-group">

        <label>
          الاسم
        </label>

        <input
          id="customerName"
          type="text"
          placeholder="الاسم الكامل"
        >

      </div>

      <div class="form-group">

        <label>
          رقم الهاتف
        </label>

        <input
          id="customerPhone"
          type="tel"
          placeholder="07XXXXXXXX"
        >

      </div>

      <div class="form-group">

        <label>
          المحافظة
        </label>

        <input
          id="customerCity"
          type="text"
          placeholder="مثال: عمان"
        >

      </div>

      <div class="form-group">

        <label>
          العنوان بالتفصيل
        </label>

        <textarea
          id="customerAddress"
          placeholder="المنطقة، الشارع، أقرب نقطة دالة..."
        ></textarea>

      </div>

      <div class="form-group">

        <label>
          ملاحظات
        </label>

        <textarea
          id="customerNotes"
          placeholder="أي ملاحظات إضافية على الطلب..."
        ></textarea>

      </div>

    </div>

    <div class="checkout-box">

      <h3>
        ملخص الطلب
      </h3>

      <div id="checkoutSummary"></div>

      <br>

      <div class="total-row">
        <span>المجموع</span>
        <strong id="checkoutSubtotal">
          0.00 د.أ
        </strong>
      </div>

      <div class="total-row">
        <span>التوصيل</span>
        <strong id="checkoutDelivery">
          2.00 د.أ
        </strong>
      </div>

      <div class="total-row final">
        <span>الإجمالي</span>
        <strong id="checkoutTotal">
          0.00 د.أ
        </strong>
      </div>

    </div>

    <button
      class="whatsapp-btn"
      onclick="sendWhatsAppOrder()"
    >
      إرسال الطلب عبر واتساب
    </button>

  </div>

</div>

<div
  class="toast"
  id="toast"
></div>

<script>

/* =========================================================
   AMO STORE CONFIG
========================================================= */

const REPO_OWNER = "llvll0";
const REPO_NAME = "AMO";
const BRANCH = "main";

const WHATSAPP_NUMBER = "962790780914";

const DELIVERY_PRICE = 2;
const FREE_DELIVERY_FROM = 49;

const CART_KEY = "amo_cart";


/* =========================================================
   GLOBAL DATA
========================================================= */

let products = [];

let cart = loadCart();

let currentProduct = null;

let selectedModalColor = null;

let currentGallery = [];

let currentViewerIndex = 0;

let toastTimer = null;


/* =========================================================
   IMAGE URL
========================================================= */

function makeImageUrl(path, folder="") {

  if (!path) return "";

  path = String(path).trim();

  if (/^(https?:\/\/|data:)/i.test(path)) {
    return path;
  }

  path = path.replace(/^\/+/, "");

  /*
    منتجات products-new
  */

  if (folder) {

    /*
      دعم الصور المكتوبة بالخطأ:
      images/file.jpg
    */

    path = path.replace(/^images\//i, "");

    return `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/products-new/${encodeURIComponent(folder)}/${encodeURIComponent(path)}`;
  }

  /*
    المنتجات القديمة
  */

  if (
    path.startsWith("products/") ||
    path.startsWith("images/")
  ) {

    return `https://${REPO_OWNER}.github.io/${REPO_NAME}/${path}`;
  }

  return `https://${REPO_OWNER}.github.io/${REPO_NAME}/images/${path}`;
}


function productImage(product,image) {

  return makeImageUrl(
    image,
    product && product.folder
      ? product.folder
      : ""
  );

}


/* =========================================================
   LOAD OLD PRODUCTS
========================================================= */

async function loadOldProducts() {

  try {

    const url =
      `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/products.js?v=${Date.now()}`;

    const response =
      await fetch(url);

    if (!response.ok) {
      return [];
    }

    const source =
      await response.text();

    const match =
      source.match(
        /(?:const|let|var)\s+products\s*=\s*(\[[\s\S]*\]);/
      );

    if (!match) {
      return [];
    }

    try {

      const loaded =
        Function(
          `"use strict"; return (${match[1]})`
        )();

      return Array.isArray(loaded)
        ? loaded
        : [];

    } catch(error) {

      console.error(
        "products.js parse error",
        error
      );

      return [];
    }

  } catch(error) {

    console.error(
      "products.js load error",
      error
    );

    return [];
  }
}


/* =========================================================
   LOAD NEW PRODUCTS AUTOMATICALLY
========================================================= */

async function loadNewProducts() {

  try {

    const api =
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/products-new?ref=${BRANCH}`;

    const response =
      await fetch(api);

    if (!response.ok) {
      return [];
    }

    const folders =
      await response.json();

    if (!Array.isArray(folders)) {
      return [];
    }

    /*
      فقط المجلدات الرقمية:
      1
      7
      8
      9
      10
      11
      ...
    */

    const productFolders =
      folders
        .filter(
          item =>
            item.type === "dir" &&
            /^\d+$/.test(item.name)
        )
        .sort(
          (a,b) =>
            Number(a.name) -
            Number(b.name)
        );

    const loaded = [];

    for (
      const folder of productFolders
    ) {

      try {

        const fileResponse =
          await fetch(folder.url);

        if (!fileResponse.ok) {
          continue;
        }

        const files =
          await fileResponse.json();

        const jsFile =
          files.find(
            file =>
              file.type === "file" &&
              file.name === "product.js"
          );

        if (!jsFile) {
          continue;
        }

        const jsResponse =
          await fetch(
            jsFile.download_url +
            `?v=${Date.now()}`
          );

        if (!jsResponse.ok) {
          continue;
        }

        const source =
          await jsResponse.text();

        const match =
          source.match(
            /(?:const|let|var)\s+product\s*=\s*(\{[\s\S]*\});/
          );

        if (!match) {
          continue;
        }

        const product =
          Function(
            `"use strict"; return (${match[1]})`
          )();

        if (
          !product ||
          !product.id
        ) {
          continue;
        }

        /*
          نربط المنتج بالمجلد
          حتى يعرف الموقع مكان الصور
        */

        product.folder =
          folder.name;

        loaded.push(product);

      } catch(error) {

        console.error(
          "Product folder error:",
          folder.name,
          error
        );
      }
    }

    return loaded;

  } catch(error) {

    console.error(
      "New products error:",
      error
    );

    return [];
  }
}


/* =========================================================
   LOAD ALL PRODUCTS
========================================================= */

async function loadProducts() {

  document.getElementById(
    "productsCount"
  ).textContent =
    "جاري تحميل المنتجات...";

  const oldProducts =
    await loadOldProducts();

  const newProducts =
    await loadNewProducts();

  /*
    Map يمنع تكرار نفس رقم المنتج
  */

  const map =
    new Map();

  oldProducts.forEach(
    product => {

      map.set(
        String(product.id),
        {
          ...product,
          folder:
            product.folder || ""
        }
      );

    }
  );

  newProducts.forEach(
    product => {

      /*
        المنتج الموجود داخل products-new
        يأخذ الأولوية
      */

      map.set(
        String(product.id),
        product
      );

    }
  );

  products =
    Array.from(
      map.values()
    ).sort(
      (a,b) => {

        const na =
          Number(a.id);

        const nb =
          Number(b.id);

        if (
          !Number.isNaN(na) &&
          !Number.isNaN(nb)
        ) {

          return nb - na;
        }

        return String(b.id)
          .localeCompare(
            String(a.id)
          );
      }
    );

  renderProducts(products);
}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

  }

      card.className =

            product.id
          );
        }
      );

      const colors =
        Array.isArray(
          product.colors
        )
          ? product.colors
          : [];

      /*
        الصورة الأولى هي صورة اللون الأول
      */

      const firstColor =
        colors[0] || null;

      const image =
        firstColor?.image ||
        product.image ||
        product.gallery?.[0] ||
        "";

      card.innerHTML = `

        <div class="product-image-wrap">

          <img
            class="product-image"
            src="${escapeHtml(
              productImage(
                product,
                image
              )
            )}"
            alt="${escapeHtml(
              product.name || ""
            )}"
            onerror="this.style.display='none'"
          >

        </div>

        <div class="product-info">

          <div class="product-name">
            ${escapeHtml(
              product.name ||
              `شنطة AMO #${product.id}`
            )}
          </div>

          <div class="product-price">
            ${Number(
              product.price || 0
            ).toFixed(2)} د.أ
          </div>

          <div class="colors">

            ${colors.map(
              (color,index) => `

                <button
                  class="color-option ${
                    index === 0
                      ? "active"
                      : ""
                  }"
                  title="${escapeHtml(
                    color.name || ""
                  )}"
                  data-color-name="${escapeHtml(
                    color.name || ""
                  )}"
                  style="background:${escapeHtml(
                    color.value || "#ddd"
                  )}"
                  onclick="
                    event.stopPropagation();
                    changeCardColor(
                      '${escapeJs(product.id)}',
                      '${escapeJs(color.image || "")}',
                      this
                    )
                  "
                ></button>

              `
            ).join("")}

          </div>

          <button
            class="add-btn"
            onclick="
              event.stopPropagation();
              addToCartFromCard(
                '${escapeJs(product.id)}'
              )

        </div>
      `;

      grid.appendChild(card);
    }
  );
}


/* =========================================================
   SEARCH
========================================================= */

function searchProducts() {

  const value =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();

  if (!value) {

    renderProducts(products);

    return;
  }

  const filtered =
    products.filter(
      product => {

        const text = [

          product.name || "",

          product.id || "",

          ...(product.colors || [])
            .map(
              c => c.name || ""
            )

        ]
          .join(" ")
          .toLowerCase();

        return text.includes(
          value
        );
      }
    );

  renderProducts(
    filtered
  );
}


/* =========================================================
   CHANGE CARD COLOR
========================================================= */

function changeCardColor(
  productId,
  image,
  button
) {

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(productId)
    );

  if (!product) {
    return;
  }

  const card =
    button.closest(
      ".product-card"
    );

  const img =
    card.querySelector(
      ".product-image"
    );

  if (img && image) {

    img.style.display =
      "block";

    img.src =
      productImage(
        product,
        image
      );
  }

  card
    .querySelectorAll(
      ".color-option"
    )
    .forEach(
      el =>
        el.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );
}


/* =========================================================
   ADD FROM CARD
========================================================= */

function addToCartFromCard(
  productId
) {

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(productId)
    );

  if (!product) {
    return;
  }

  /*
    نحدد البطاقة من المنتج
  */

  const cards =
    document.querySelectorAll(
      ".product-card"
    );

  let card = null;

  cards.forEach(
    currentCard => {

      const name =
        currentCard.querySelector(
          ".product-name"
        )?.textContent || "";

      if (
        name.trim() ===
        String(
          product.name ||
          `شنطة AMO #${product.id}`
        ).trim()
      ) {

        card =
          currentCard;
      }
    }
  );

  let color =
    null;

  if (card) {

    const active =
      card.querySelector(
        ".color-option.active"
      );

    if (active) {

      const name =
        active.dataset.colorName ||
        "";

      color =
        (product.colors || [])
          .find(
            c =>
              String(c.name) ===
              String(name)
          ) || null;
    }
  }

  /*
    إذا لم يجد لونًا
    نستخدم أول لون
  */

  if (
    !color &&
    product.colors?.length
  ) {

    color =
      product.colors[0];
  }

  addToCart(
    product,
    color
  );
}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(
  product,
  color=null
) {

  if (!product) {
    return;
  }

  const colorName =
    color?.name || "";

  const colorImage =
    color?.image ||
    product.image ||
    product.gallery?.[0] ||
    "";

  /*
    نفس المنتج + نفس اللون
    = نفس السطر
  */

  const existing =
    cart.find(
      item =>
        String(item.productId) ===
          String(product.id) &&

        String(item.color || "") ===
          String(colorName)
    );

  if (existing) {

    existing.qty += 1;

  } else {

    cart.push({

      productId:
        String(product.id),

      name:
        product.name,

      price:
        Number(
          product.price || 0
        ),

      color:
        colorName,

      image:
        colorImage,

      folder:
        product.folder || "",

      qty:1

    });
  }

  saveCart();

  updateCartUI();

  showToast(
    `تمت إضافة ${product.name}${
      colorName
        ? ` - ${colorName}`
        : ""
    } إلى السلة`
  );
}


/* =========================================================
   PRODUCT DETAILS
========================================================= */

function openProduct(
  productId
) {

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(productId)
    );

  if (!product) {
    return;
  }

  currentProduct =
    product;

  selectedModalColor =
    product.colors?.length
      ? product.colors[0]
      : null;

  currentGallery =
    Array.isArray(
      product.gallery
    ) &&
    product.gallery.length
      ? [...product.gallery]
      : [
          product.image
        ].filter(Boolean);

  document.getElementById(
    "modalProductName"
  ).textContent =
    product.name ||
    `شنطة AMO #${product.id}`;

  document.getElementById(
    "modalProductPrice"
  ).textContent =
    `${Number(
      product.price || 0
    ).toFixed(2)} د.أ`;

  document.getElementById(
    "modalSizes"
  ).textContent =
    Array.isArray(
      product.sizes
    )
      ? product.sizes.join("، ")
      : (
          product.size ||
          "غير محدد"
        );

  document.getElementById(
    "modalDimensions"
  ).textContent =
    product.dimensions ||
    "غير محددة";

  renderModalColors();

  /*
    نعرض صورة اللون المحدد
    كأول صورة
  */

  if (
    selectedModalColor &&
    selectedModalColor.image
  ) {

    currentGallery = [
      selectedModalColor.image,
      ...currentGallery.filter(
        image =>
          image !==
          selectedModalColor.image
      )
    ];
  }

  renderGallery();

  document.getElementById(
    "productModal"
  ).classList.add(
    "show"
  );

  document.body.style.overflow =
    "hidden";
}


/* =========================================================
   MODAL COLORS
========================================================= */

function renderModalColors() {

  const box =
    document.getElementById(
      "modalColors"
    );

  box.innerHTML = "";

  if (
    !currentProduct?.colors?.length
  ) {

    box.innerHTML =
      `<span class="detail-value">
        غير محدد
      </span>`;

    return;
  }

  currentProduct.colors.forEach(
    color => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "modal-color";

      if (
        selectedModalColor &&
        selectedModalColor.name ===
          color.name
      ) {

        button.classList.add(
          "active"
        );
      }

      button.innerHTML = `

        <span
          class="modal-color-dot"
          style="background:${escapeHtml(
            color.value ||
            "#ddd"
          )}"
        ></span>

        <span>
          ${escapeHtml(
            color.name || ""
          )}
        </span>

      `;

      button.addEventListener(
        "click",
        () => {

          selectedModalColor =
            color;

          renderModalColors();

          if (color.image) {

            currentGallery = [
              color.image,
              ...currentGallery.filter(
                img =>
                  img !==
                  color.image
              )
            ];

            setGalleryImage(0);
          }

        }
      );

      box.appendChild(
        button
      );
    }
  );
}


/* =========================================================
   GALLERY
========================================================= */

function renderGallery() {

  const main =
    document.getElementById(
      "modalMainImage"
    );

  const thumbs =
    document.getElementById(
      "galleryThumbs"
    );

  thumbs.innerHTML = "";

  if (!currentGallery.length) {

    main.removeAttribute(
      "src"
    );

    return;
  }

  currentViewerIndex = 0;

  main.src =
    productImage(
      currentProduct,
      currentGallery[0]
    );

  currentGallery.forEach(
    (image,index) => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "gallery-thumb";

      if (index === 0) {

        button.classList.add(
          "active"
        );
      }

      button.innerHTML = `

        <img
          src="${escapeHtml(
            productImage(
              currentProduct,
              image
            )
          )}"
          alt=""
          onerror="
            this.style.display='none'
          "
        >

      `;

      button.addEventListener(
        "click",
        () => {

          setGalleryImage(
            index
          );

        }
      );

      thumbs.appendChild(
        button
      );
    }
  );
}


function setGalleryImage(
  index
) {

  if (
    !currentGallery.length ||
    index < 0 ||
    index >= currentGallery.length
  ) {
    return;
  }

  currentViewerIndex =
    index;

  document.getElementById(
    "modalMainImage"
  ).src =
    productImage(
      currentProduct,
      currentGallery[index]
    );

  document
    .querySelectorAll(
      ".gallery-thumb"
    )
    .forEach(
      (thumb,i) => {

        thumb.classList.toggle(
          "active",
          i === index
        );

      }
    );
}


/* =========================================================
   IMAGE VIEWER
========================================================= */

function openImageViewer() {

  if (
    !currentProduct ||
    !currentGallery.length
  ) {
    return;
  }

  document.getElementById(
    "viewerImage"
  ).src =
    productImage(
      currentProduct,
      currentGallery[
        currentViewerIndex
      ]
    );

  document.getElementById(
    "viewerCounter"
  ).textContent =
    `${currentViewerIndex + 1} / ${currentGallery.length}`;

  document.getElementById(
    "imageViewer"
  ).classList.add(
    "show"
  );
}


function closeImageViewer() {

  document.getElementById(
    "imageViewer"
  ).classList.remove(
    "show"
  );
}


function viewerPrev(event) {

  event.stopPropagation();

  if (!currentGallery.length) {
    return;
  }

  currentViewerIndex--;

  if (
    currentViewerIndex < 0
  ) {

    currentViewerIndex =
      currentGallery.length - 1;
  }

  updateViewerImage();
}


function viewerNext(event) {

  event.stopPropagation();

  if (!currentGallery.length) {
    return;
  }

  currentViewerIndex++;

  if (
    currentViewerIndex >=
    currentGallery.length
  ) {

    currentViewerIndex = 0;
  }

  updateViewerImage();
}


function updateViewerImage() {

  document.getElementById(
    "viewerImage"
  ).src =
    productImage(
      currentProduct,
      currentGallery[
        currentViewerIndex
      ]
    );

  document.getElementById(
    "viewerCounter"
  ).textContent =
    `${currentViewerIndex + 1} / ${currentGallery.length}`;

  setGalleryImage(
    currentViewerIndex
  );
}

   CLOSE MODAL
========================================================= */

function closeProductModal() {

  document.getElementById(
    "productModal"
  ).classList.remove(
    "show"
  );

  document.body.style.overflow =

}


function closeModalFromOutside(

function closeViewerFromOutside(

  }
}

function addSelectedProductToCart() {

/* =========================================================
   CART
========================================================= */

function loadCart() {

  try {

    const saved =
      localStorage.getItem(
        CART_KEY
      );

    if (!saved) {
      return [];
    }

    const parsed =
      JSON.parse(saved);

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch {

    return [];
  }
}


function saveCart() {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );
}


function updateCartUI() {

  const count =
    cart.reduce(
      (sum,item) =>
        sum +
        Number(
          item.qty || 0
        ),
      0
    );

  document.getElementById(
    "cartCount"
  ).textContent =
    count;

  renderCart();
}

   RENDER CART
========================================================= */

  const box =

    );

  if (!cart.length) {

    box.innerHTML = `

        "

      </div>

    `;

  }

  cart.forEach(
    (item,index) => {

      const product =
        products.find(
          p =>
            String(p.id) ===
            String(item.productId)
        );

      /*
        الصورة المحفوظة مع اللون
        هي الصورة التي ستظهر
        في السلة
      */

      const image =
        product
          ? productImage(
              product,

            )
          : makeImageUrl(

              item.folder || ""
            );

        document.createElement(

        );

        >

            ${escapeHtml(
              item.name
            )}

                  ${escapeHtml(
                    item.color
                  )}
                </div>
              `
              : ""
          }

            ${Number(
              item.price
            ).toFixed(2)}

          </div>

          <div class="qty">

            <button
              onclick="
                changeQty(
                  ${index},
                  -1
                )
              "
            >
              −
            </button>

            <strong>
              ${item.qty}
            </strong>

            <button
              onclick="
                changeQty(
                  ${index},
                  1
                )
              "
            >
              +
            </button>

          </div>

          <button
            class="remove-item"
            onclick="
              removeCartItem(
                ${index}
              )
            "

            حذف
          </button>

      );
    }

/* =========================================================
   QUANTITY
========================================================= */

function changeQty(
  index,
  change
) {

  if (!cart[index]) {
    return;
  }

  cart[index].qty +=
    change;

  if (
    cart[index].qty <= 0
  ) {

    cart.splice(
      index,
      1
    );
  }

  saveCart();

  updateCartUI();
}


function removeCartItem(
  index
) {

  cart.splice(
    index,
    1
  );

  saveCart();

  updateCartUI();
}


/* =========================================================
   TOTALS
========================================================= */

function getSubtotal() {

  return cart.reduce(
    (sum,item) =>
      sum +
      Number(
        item.price || 0
      ) *
      Number(
        item.qty || 0
      ),
    0
  );
}


function getDelivery() {

  const subtotal =
    getSubtotal();

  if (
    subtotal >=
    FREE_DELIVERY_FROM
  ) {

    return 0;
  }

  return cart.length
    ? DELIVERY_PRICE
    : 0;
}

function buildWhatsAppMessage() {

  const phone =
    document.getElementById(
      "customerPhone"

  const city =
    document.getElementById(

    document.getElementById(
      "customerAddress"
    ).value.trim();

  const notes =
    document.getElementById(
      "customerNotes"
    ).value.trim();

  const subtotal =
    getSubtotal();

  const delivery =
    getDelivery();

  const total =
    subtotal +
    delivery;

  let message =
    `🛍️ طلب جديد من AMO\n\n` +

    `👤 الاسم: ${name}\n` +

    `📞 الهاتف: ${phone}\n` +

    `📍 المحافظة: ${city}\n` +

    `🏠 العنوان: ${address}\n`;

  if (notes) {

    message +=
      `📝 الملاحظات: ${notes}\n`;
  }

  message +=
    `\n━━━━━━━━━━━━\n` +
    `🛒 المنتجات:\n\n`;

  cart.forEach(
    item => {

      message +=
        `• ${item.name}` +

        (
          item.color
            ? ` | اللون: ${item.color}`
            : ""
        ) +

        ` | الكمية: ${item.qty}` +

        ` | ${(
          Number(item.price) *
          Number(item.qty)
        ).toFixed(2)} د.أ\n`;
    }
  );

  message +=
    `\n💰 المجموع: ${subtotal.toFixed(2)} د.أ\n` +

    `🚚 التوصيل: ${delivery.toFixed(2)} د.أ\n` +

    `💵 الإجمالي: ${total.toFixed(2)} د.أ`;

  return message;
}


/* =========================================================
   GET ORDER IMAGES
========================================================= */

async function getOrderImages() {

  const files = [];

  const usedImages =
    new Set();

  for (
    const item of cart
  ) {

    const product =
      products.find(
        p =>
          String(p.id) ===
          String(item.productId)
      );

    if (!product) {
      continue;
    }

    /*
      أهم نقطة:
      item.image هو صورة اللون
      الذي اختاره الزبون.
    */

    const imageName =
      item.image ||
      product.image ||
      product.gallery?.[0];

    if (!imageName) {
      continue;
    }

    const imageUrl =
      productImage(
        product,
        imageName
      );

    if (
      usedImages.has(
        imageUrl
      )
    ) {
      continue;
    }

    usedImages.add(
      imageUrl
    );

    try {

      const response =
        await fetch(
          imageUrl
        );

      if (!response.ok) {
        continue;
      }

      const blob =
        await response.blob();

      /*
        نحافظ على نوع الصورة
      */

      const type =
        blob.type ||
        "image/jpeg";

      let extension =
        "jpg";

      if (
        type.includes("png")
      ) {

        extension =
          "png";
      }

      if (
        type.includes("webp")
      ) {

        extension =
          "webp";
      }

      const safeColor =
        String(
          item.color ||
          "product"
        )
          .replace(
            /[^\u0600-\u06FFa-zA-Z0-9_-]/g,
            "_"
          );

      const file =
        new File(
          [blob],
          `AMO-${item.productId}-${safeColor}.${extension}`,
          {
            type
          }
        );

      files.push(
        file
      );

    } catch(error) {

      console.error(
        "Image fetch error:",
        error
      );
    }
  }

  return files;
}


/* =========================================================
   SEND ORDER TO WHATSAPP
========================================================= */

async function sendWhatsAppOrder() {

  if (!cart.length) {

    showToast(
      "السلة فارغة"
    );

    return;
  }

  const name =
    document.getElementById(
      "customerName"
    ).value.trim();

  const phone =
    document.getElementById(
      "customerPhone"
    ).value.trim();

  const city =
    document.getElementById(
      "customerCity"
    ).value.trim();

  const address =
    document.getElementById(
      "customerAddress"
    ).value.trim();

  if (
    !name ||
    !phone ||
    !city ||
    !address
  ) {

    showToast(
      "يرجى تعبئة جميع البيانات المطلوبة"
    );

    return;
  }

  const message =
    buildWhatsAppMessage();

  /*
    نحاول الحصول على صور
    الألوان المطلوبة
  */

  showToast(
    "جاري تجهيز صور الطلب..."
  );

  try {

    const files =
      await getOrderImages();

    /*
      إذا كان الجهاز يدعم
      مشاركة الملفات والصور
    */

    if (
      files.length > 0 &&
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({
        files
      })
    ) {

      try {

        await navigator.share({

          title:
            "طلب جديد من AMO",

          text:
            message,

          files:
            files

        });

        /*
          إذا تمت المشاركة
          بنجاح لا نفتح واتساب مرة ثانية
        */

        return;

      } catch(error) {

        /*
          المستخدم قد يكون ضغط إلغاء
          المشاركة.
        */

        if (
          error &&
          error.name ===
            "AbortError"
        ) {

          return;
        }

        console.error(
          "Share error:",
          error
        );
      }
    }

    /*
      إذا الجهاز لا يدعم
      إرسال صورة عبر Share API
    */

    const whatsappUrl =
      `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(
        message
      )}`;

    window.location.href =
      whatsappUrl;

  } catch(error) {

    console.error(
      "WhatsApp order error:",
      error
    );

    /*
      الحل الاحتياطي
    */

    const whatsappUrl =
      `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(
        message
      )}`;

    window.location.href =
      whatsappUrl;
  }
}

function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );
}


/* =========================================================
   SECURITY HELPERS
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


function escapeJs(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /"/g,
      '\\"'
    );
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    const viewer =
      document.getElementById(
        "imageViewer"
      );

    if (
      !viewer.classList.contains(
        "show"
      )
    ) {
      return;
    }

    if (
      event.key ===
      "Escape"
    ) {

      closeImageViewer();
    }

    if (
      event.key ===
      "ArrowLeft"
    ) {

      viewerNext(event);
    }

    if (
      event.key ===
      "ArrowRight"
    ) {

      viewerPrev(event);
    }

  }
);
