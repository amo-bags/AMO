<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMO | شنط نسائية</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Arial,Tahoma,sans-serif;background:#f7f5f1;color:#222}
body.no-scroll{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #eee}
.header{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:28px;font-weight:800;letter-spacing:2px}
.cart-btn{border:0;background:#111;color:#fff;border-radius:24px;padding:11px 17px}
.cart-count{display:inline-flex;min-width:22px;height:22px;align-items:center;justify-content:center;margin-right:5px;background:#fff;color:#111;border-radius:50%;font-size:12px;font-weight:bold}

.hero{max-width:1200px;margin:18px auto;padding:55px 20px;background:#e9e2d8;border-radius:20px;text-align:center}
.hero h1{font-size:34px;margin-bottom:10px}
.hero p{color:#666;font-size:16px}

.section{max-width:1200px;margin:35px auto;padding:0 15px}
.section-title{text-align:center;font-size:28px;margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}

.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.main-img{width:100%;height:310px;display:block;object-fit:cover;cursor:zoom-in}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:9px;background:#fff}
.thumbs img{width:55px;height:55px;object-fit:cover;border:2px solid transparent;border-radius:8px;flex:0 0 auto;cursor:zoom-in}
.thumbs img.active{border-color:#111}
.info{padding:15px}
.name{font-size:19px;font-weight:700;margin-bottom:6px}
.price{font-size:20px;font-weight:800;margin-bottom:10px}
.details{color:#666;font-size:13px;line-height:1.8;margin-bottom:10px}

.option-title{font-size:13px;color:#555;margin:8px 0 6px}
.options{display:flex;flex-wrap:wrap;gap:7px}
.option{border:1px solid #ddd;background:#fff;border-radius:20px;padding:7px 11px;display:flex;align-items:center;gap:6px;font-size:13px}
.option.selected{border-color:#111;box-shadow:0 0 0 1px #111}
.swatch{width:17px;height:17px;border-radius:50%;border:1px solid #bbb;display:inline-block}
.add{width:100%;border:0;background:#111;color:#fff;padding:13px;border-radius:10px;margin-top:13px;font-weight:700}
.add:active{transform:scale(.98)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000;display:none}
.overlay.show{display:block}

.cart{position:fixed;top:0;right:-480px;width:min(470px,100%);height:100dvh;background:#fff;z-index:3100;transition:.3s;display:flex;flex-direction:column;overflow:hidden}
.cart.show{right:0}
.cart-head{height:64px;flex:0 0 64px;padding:12px 17px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}
.cart-head h2{font-size:20px}
.close{border:0;background:transparent;font-size:30px;line-height:1}
.cart-body{flex:1;min-height:0;overflow-y:auto;padding:12px 15px}
.cart-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.cart-item img{width:75px;height:85px;object-fit:cover;border-radius:10px;flex:0 0 75px}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-weight:700;margin-bottom:4px}
.cart-meta{font-size:12px;color:#777;line-height:1.7}
.qty{display:flex;align-items:center;gap:8px;margin-top:7px}
.qty button{width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:6px}
.remove{margin-right:auto;border:0;background:transparent;color:#b00020;font-size:18px}
.empty{text-align:center;color:#777;padding:45px 10px}

.checkout{padding:12px 15px;border-top:1px solid #eee;background:#fff;flex:0 0 auto}
.checkout h3{font-size:17px;margin-bottom:9px}
.form-grid{display:grid;gap:8px;max-height:31vh;overflow-y:auto}
.checkout input,.checkout textarea,.checkout select{width:100%;border:1px solid #ddd;border-radius:9px;padding:11px;background:#fff;outline:none}
.checkout textarea{min-height:60px;resize:vertical}
.summary{padding:10px 0 0}
.line{display:flex;justify-content:space-between;gap:10px;margin:5px 0}
.final{font-size:20px;font-weight:800;margin-top:8px}
.delivery-note{text-align:center;background:#f4f0e8;border-radius:9px;padding:8px;margin:8px 0;font-size:12px}
.review-btn{width:100%;border:0;background:#111;color:#fff;padding:13px;border-radius:10px;font-weight:700;margin-top:9px}
.continue{width:100%;border:1px solid #111;background:#fff;padding:10px;border-radius:9px;margin-bottom:8px}

.modal{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.modal-box{width:min(520px,100%);max-height:92dvh;overflow-y:auto;background:#fff;border-radius:20px;padding:18px}
.modal-title{text-align:center;font-size:23px;font-weight:800;margin-bottom:5px}
.modal-sub{text-align:center;color:#777;font-size:13px;margin-bottom:15px}
.review-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.review-item img{width:68px;height:78px;object-fit:cover;border-radius:9px}
.review-info{flex:1;font-size:13px;line-height:1.7}
.customer-box{background:#f7f5f1;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;line-height:1.9}
.modal-total{border-top:1px solid #ddd;margin-top:12px;padding-top:10px}
.modal-actions{display:flex;gap:8px;margin-top:15px}
.edit-btn,.send-btn{flex:1;padding:13px;border-radius:10px}
.edit-btn{border:1px solid #111;background:#fff}
.send-btn{border:0;background:#25d366;color:#fff;font-weight:800}
.success{text-align:center;padding:22px 8px}
.success-icon{font-size:52px}
.success h2{margin:8px 0}
.success p{color:#666;line-height:1.8}
.success button{width:100%;border:0;background:#111;color:#fff;padding:13px;border-radius:10px;margin-top:15px}

.lightbox{position:fixed;inset:0;z-index:6000;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center}
.lightbox.show{display:flex}
.lightbox img{max-width:90vw;max-height:88vh;object-fit:contain}
.lb-close,.lb-prev,.lb-next{position:absolute;border:0;color:#fff;background:rgba(255,255,255,.14);border-radius:50%;width:45px;height:45px;font-size:28px}
.lb-close{top:15px;right:15px}
.lb-prev{left:15px;top:50%;transform:translateY(-50%)}
.lb-next{right:15px;top:50%;transform:translateY(-50%)}

footer{text-align:center;color:#777;padding:35px 15px}

@media(max-width:600px){
  .hero{margin:12px;padding:38px 14px}
  .hero h1{font-size:26px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .main-img{height:225px}
  .info{padding:10px}
  .name{font-size:16px}
  .price{font-size:18px}
  .thumbs img{width:48px;height:48px}
  .cart{width:100%}
  .cart-body{padding:10px 13px}
  .form-grid{max-height:29vh}
  .checkout{padding:10px 13px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .modal-actions{flex-direction:column}
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">AMO</div>
    <button class="cart-btn" onclick="openCart()">🛒 السلة <span id="cartCount" class="cart-count">0</span></button>
  </div>
</header>

<section class="hero">
  <h1>اختاري شنطتك بستايلك الخاص</h1>
  <p>شنط AMO بتصاميم أنيقة تناسب كل إطلالة</p>
</section>

<section class="section">
  <h2 class="section-title">أحدث الحقائب</h2>
  <div id="productsGrid" class="grid">
    <p style="width:100%;text-align:center">جاري تحميل المنتجات...</p>
  </div>
</section>

<footer>AMO © جميع الحقوق محفوظة</footer>

<div id="cartOverlay" class="overlay" onclick="closeCart()"></div>

<aside id="cart" class="cart">
  <div class="cart-head">
    <h2>🛒 سلة التسوق</h2>
    <button class="close" onclick="closeCart()">×</button>
  </div>

  <div id="cartBody" class="cart-body"></div>

  <div class="checkout">
    <h3>📦 معلومات التوصيل</h3>

    <div class="form-grid">
      <input id="customerName" placeholder="الاسم الكامل *">
      <input id="customerPhone" type="tel" placeholder="رقم الهاتف *">

      <select id="customerCity">
        <option value="">اختاري المحافظة *</option>
        <option>عمّان</option>
        <option>الزرقاء</option>
        <option>إربد</option>
        <option>البلقاء</option>
        <option>الكرك</option>
        <option>الطفيلة</option>
        <option>معان</option>
        <option>العقبة</option>
        <option>مادبا</option>
        <option>جرش</option>
        <option>عجلون</option>
        <option>المفرق</option>
      </select>

      <textarea id="customerAddress" placeholder="العنوان بالتفصيل *"></textarea>
      <textarea id="customerNotes" placeholder="ملاحظات إضافية"></textarea>
    </div>

    <div class="summary">
      <div class="line"><span>مجموع المنتجات</span><strong id="productsTotal">0.00 د.أ</strong></div>
      <div class="line"><span>التوصيل</span><strong id="deliveryTotal">0.00 د.أ</strong></div>
      <div class="delivery-note">🚚 التوصيل 2 دينار — مجاني عند 49 دينار فأكثر</div>
      <div class="line final"><span>المجموع</span><strong id="finalTotal">0.00 د.أ</strong></div>
    </div>

    <button class="continue" onclick="closeCart()">🛍️ إضافة المزيد من المنتجات</button>
    <button class="review-btn" onclick="reviewOrder()">✅ مراجعة وتأكيد الطلب</button>
  </div>
</aside>

<div id="reviewModal" class="modal">
  <div id="reviewBox" class="modal-box"></div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
  <button class="lb-close" onclick="closeLightbox()">×</button>
  <button class="lb-prev" onclick="prevLightbox(event)">‹</button>
  <img id="lightboxImg" src="" onclick="event.stopPropagation()">
  <button class="lb-next" onclick="nextLightbox(event)">›</button>
</div>

<script>
const PRODUCTS_API="https://api.github.com/repos/llvll0/AMO/contents/products?ref=main";
const WHATSAPP="962790780914";
const CART_KEY="amo_cart_v3";

let products=[];
let cart=[];
let lbGallery=[];
let lbIndex=0;

function esc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function jsesc(v){
  return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}
function imgUrl(url){
  if(!url)return "";
  if(/^https?:\/\//i.test(url))return url;
  return "https://llvll0.github.io/AMO/"+url.replace(/^\/+/,"");
}
function normalize(p){
  p.image=imgUrl(p.image);
  if(p.gallery)p.gallery=p.gallery.map(imgUrl);
  if(p.colors)p.colors=p.colors.map(c=>({...c,image:imgUrl(c.image),gallery:c.gallery?c.gallery.map(imgUrl):null}));
  return p;
}

function loadCart(){
  try{
    const x=JSON.parse(localStorage.getItem(CART_KEY)||"[]");
    cart=Array.isArray(x)?x:[];
  }catch(e){cart=[]}
}
function saveCart(){
  localStorage.setItem(CART_KEY,JSON.stringify(cart));
}

async function loadProducts(){
  try{
    const r=await fetch(PRODUCTS_API);
    if(!r.ok)throw new Error("GitHub API");
    const files=await r.json();

    const list=files
      .filter(f=>/^product-\d+\.js$/i.test(f.name))
      .sort((a,b)=>{
        const A=parseInt(a.name.match(/\d+/)[0]);
        const B=parseInt(b.name.match(/\d+/)[0]);
        return B-A;
      });

    products=[];

    for(const file of list){
      try{
        const source=await fetch(file.download_url).then(r=>r.text());
        const product=new Function(source+"\nreturn product;")();
        if(product&&product.id)products.push(normalize(product));
      }catch(e){console.error("Product:",file.name,e)}
    }

    renderProducts();
    renderCart();
  }catch(e){
    document.getElementById("productsGrid").innerHTML="<p style='width:100%;text-align:center'>تعذر تحميل المنتجات</p>";
  }
}

function productGallery(p,colorIndex=null){
  if(colorIndex!==null && p.colors?.[colorIndex]?.gallery?.length){
    return p.colors[colorIndex].gallery;
  }
  if(colorIndex!==null && p.colors?.[colorIndex]?.image){
    return [p.colors[colorIndex].image,...(p.gallery||[]).filter(x=>x!==p.colors[colorIndex].image)];
  }
  return p.gallery?.length?p.gallery:[p.image];
}

function renderProducts(){
  const grid=document.getElementById("productsGrid");

  grid.innerHTML=products.map(p=>{
    const colors=p.colors||[];
    const sizes=p.sizes||[];
    const gallery=productGallery(p);

    return `
    <article class="card" data-id="${esc(p.id)}">

      <img id="main-${esc(p.id)}" class="main-img"
        src="${esc(p.image)}"
        onclick="openLightbox('${jsesc(p.id)}',0)">

      <div class="thumbs">
        ${gallery.map((im,i)=>`
          <img src="${esc(im)}" class="${i===0?"active":""}"
            onclick="changeImage('${jsesc(p.id)}',${i})">
        `).join("")}
      </div>

      <div class="info">
        <div class="name">${esc(p.name)}</div>
        <div class="price">${Number(p.price).toFixed(2)} د.أ</div>

        <div class="details">
          ${p.size?`الحجم: ${esc(p.size)}<br>`:""}
          ${p.dimensions?`الأبعاد: ${esc(p.dimensions)}`:""}
        </div>

        ${colors.length?`
          <div class="option-title">اختاري اللون:</div>
          <div class="options" id="colors-${esc(p.id)}">
            ${colors.map((c,i)=>`
              <button class="option ${i===0?"selected":""}"
                onclick="selectColor('${jsesc(p.id)}',${i})">
                <span class="swatch" style="background:${esc(c.value||"#ccc")}"></span>
                ${esc(c.name)}
              </button>
            `).join("")}
          </div>
        `:""}

        ${sizes.length?`
          <div class="option-title">اختاري الحجم:</div>
          <div class="options" id="sizes-${esc(p.id)}">
            ${sizes.map((s,i)=>`
              <button class="option ${i===0?"selected":""}"
                onclick="selectSize('${jsesc(p.id)}',${i})">
                ${esc(typeof s==="string"?s:s.name)}
              </button>
            `).join("")}
          </div>
        `:""}

        <button class="add" onclick="addToCart('${jsesc(p.id)}')">
          أضف إلى السلة 🛒
        </button>
      </div>
    </article>`;
  }).join("");
}

function selectedColorIndex(id){
  const buttons=[...document.querySelectorAll(`#colors-${CSS.escape(id)} .option`)];
  const selected=buttons.findIndex(b=>b.classList.contains("selected"));
  return selected<0?0:selected;
}
function selectedSizeValue(id){
  const p=products.find(x=>x.id===id);
  if(!p?.sizes?.length)return "";
  const buttons=[...document.querySelectorAll(`#sizes-${CSS.escape(id)} .option`)];
  const index=buttons.findIndex(b=>b.classList.contains("selected"));
  const s=p.sizes[index<0?0:index];
  return typeof s==="string"?s:(s?.name||"");
}

function selectColor(id,index){
  const p=products.find(x=>x.id===id);
  if(!p?.colors?.[index])return;

  document.querySelectorAll(`#colors-${CSS.escape(id)} .option`).forEach((b,i)=>b.classList.toggle("selected",i===index));

  const color=p.colors[index];
  const main=document.getElementById(`main-${id}`);
  if(main&&color.image)main.src=color.image;
}
function selectSize(id,index){
  document.querySelectorAll(`#sizes-${CSS.escape(id)} .option`).forEach((b,i)=>b.classList.toggle("selected",i===index));
}

function changeImage(id,index){
  const p=products.find(x=>x.id===id);
  if(!p)return;
  const ci=p.colors?.length?selectedColorIndex(id):null;
  const gallery=productGallery(p,ci);
  const main=document.getElementById(`main-${id}`);
  if(main&&gallery[index])main.src=gallery[index];

  const card=document.querySelector(`[data-id="${CSS.escape(id)}"]`);
  card?.querySelectorAll(".thumbs img").forEach((x,i)=>x.classList.toggle("active",i===index));

  openLightbox(id,index);
}

function openLightbox(id,index){
  const p=products.find(x=>x.id===id);
  if(!p)return;
  const ci=p.colors?.length?selectedColorIndex(id):null;
  lbGallery=productGallery(p,ci);
  lbIndex=Math.min(index,lbGallery.length-1);
  document.getElementById("lightboxImg").src=lbGallery[lbIndex]||"";
  document.getElementById("lightbox").classList.add("show");
  document.body.classList.add("no-scroll");
}
function closeLightbox(e){
  if(e&&e.target.id!=="lightbox")return;
  document.getElementById("lightbox").classList.remove("show");
  document.body.classList.remove("no-scroll");
}
function nextLightbox(e){
  e?.stopPropagation();
  if(!lbGallery.length)return;
  lbIndex=(lbIndex+1)%lbGallery.length;
  document.getElementById("lightboxImg").src=lbGallery[lbIndex];
}
function prevLightbox(e){
  e?.stopPropagation();
  if(!lbGallery.length)return;
  lbIndex=(lbIndex-1+lbGallery.length)%lbGallery.length;
  document.getElementById("lightboxImg").src=lbGallery[lbIndex];
}

function getColor(p,id){
  if(!p.colors?.length)return null;
  return p.colors[selectedColorIndex(id)]||p.colors[0];
}

function addToCart(id){
  const p=products.find(x=>x.id===id);
  if(!p)return;

  const color=getColor(p,id);
  const size=selectedSizeValue(id);

  const colorName=color?.name||"";
  const key=id+"|"+colorName+"|"+size;

  const existing=cart.find(x=>x.key===key);

  if(existing){
    existing.quantity++;
  }else{
    cart.push({
      key,
      productId:p.id,
      name:p.name,
      price:Number(p.price),
      image:color?.image||p.image,
      colorName,
      size,
      dimensions:p.dimensions||"",
      quantity:1
    });
  }

  saveCart();
  renderCart();
  openCart();
}

function changeQty(i,n){
  if(!cart[i])return;
  cart[i].quantity+=n;
  if(cart[i].quantity<=0)cart.splice(i,1);
  saveCart();
  renderCart();
}
function removeItem(i){
  cart.splice(i,1);
  saveCart();
  renderCart();
}

function productsTotal(){
  return cart.reduce((s,x)=>s+x.price*x.quantity,0);
}
function delivery(){
  const t=productsTotal();
  return t<=0?0:(t>=49?0:2);
}
function updateTotals(){
  const t=productsTotal(),d=delivery();
  document.getElementById("productsTotal").textContent=t.toFixed(2)+" د.أ";
  document.getElementById("deliveryTotal").textContent=d===0?"مجاني":d.toFixed(2)+" د.أ";
  document.getElementById("finalTotal").textContent=(t+d).toFixed(2)+" د.أ";
  document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.quantity,0);
}

function renderCart(){
  const body=document.getElementById("cartBody");

  if(!cart.length){
    body.innerHTML=`<div class="empty">السلة فارغة 🛍️<br><small>أضيفي المنتجات التي تعجبك وستظهر هنا.</small></div>`;
  }else{
    body.innerHTML=cart.map((x,i)=>`
      <div class="cart-item">
        <img src="${esc(x.image)}">
        <div class="cart-item-info">
          <div class="cart-item-name">${esc(x.name)}</div>
          <div class="cart-meta">
            ${x.colorName?`اللون: ${esc(x.colorName)}<br>`:""}
            ${x.size?`الحجم: ${esc(x.size)}<br>`:""}
            ${x.dimensions?`الأبعاد: ${esc(x.dimensions)}<br>`:""}
            السعر: ${x.price.toFixed(2)} د.أ
          </div>
          <div class="qty">
            <button onclick="changeQty(${i},-1)">−</button>
            <b>${x.quantity}</b>
            <button onclick="changeQty(${i},1)">+</button>
            <button class="remove" onclick="removeItem(${i})">🗑️</button>
          </div>
        </div>
      </div>
    `).join("");
  }

  updateTotals();
}

function openCart(){
  document.getElementById("cart").classList.add("show");
  document.getElementById("cartOverlay").classList.add("show");
  document.body.classList.add("no-scroll");
}
function closeCart(){
  document.getElementById("cart").classList.remove("show");
  document.getElementById("cartOverlay").classList.remove("show");
  document.body.classList.remove("no-scroll");
}

function customerData(){
  return {
    name:document.getElementById("customerName").value.trim(),
    phone:document.getElementById("customerPhone").value.trim(),
    city:document.getElementById("customerCity").value.trim(),
    address:document.getElementById("customerAddress").value.trim(),
    notes:document.getElementById("customerNotes").value.trim()
  };
}

function validateCustomer(){
  if(!cart.length){alert("السلة فارغة.");return false}
  const c=customerData();
  if(!c.name){alert("يرجى كتابة الاسم الكامل.");return false}
  if(!c.phone){alert("يرجى كتابة رقم الهاتف.");return false}
  if(!c.city){alert("يرجى اختيار المحافظة.");return false}
  if(!c.address){alert("يرجى كتابة العنوان بالتفصيل.");return false}
  return true;
}

function reviewOrder(){
  if(!validateCustomer())return;

  const c=customerData();
  const t=productsTotal(),d=delivery();

  document.getElementById("reviewBox").innerHTML=`
    <div class="modal-title">🧾 مراجعة الطلب</div>
    <div class="modal-sub">تأكدي من المنتجات والبيانات قبل الإرسال</div>

    ${cart.map(x=>`
      <div class="review-item">
        <img src="${esc(x.image)}">
        <div class="review-info">
          <b>${esc(x.name)}</b><br>
          ${x.colorName?`🎨 اللون: ${esc(x.colorName)}<br>`:""}
          ${x.size?`📏 الحجم: ${esc(x.size)}<br>`:""}
          الكمية: ${x.quantity}<br>
          سعر القطعة: ${x.price.toFixed(2)} د.أ<br>
          المجموع: ${(x.price*x.quantity).toFixed(2)} د.أ
        </div>
      </div>
    `).join("")}

    <div class="customer-box">
      <b>📦 معلومات التوصيل</b><br>
      الاسم: ${esc(c.name)}<br>
      الهاتف: ${esc(c.phone)}<br>
      المحافظة: ${esc(c.city)}<br>
      العنوان: ${esc(c.address)}
      ${c.notes?`<br>الملاحظات: ${esc(c.notes)}`:""}
    </div>

    <div class="modal-total">
      <div class="line"><span>مجموع المنتجات</span><b>${t.toFixed(2)} د.أ</b></div>
      <div class="line"><span>التوصيل</span><b>${d===0?"مجاني":d.toFixed(2)+" د.أ"}</b></div>
      <div class="line final"><span>المجموع النهائي</span><b>${(t+d).toFixed(2)} د.أ</b></div>
    </div>

    <div class="modal-actions">
      <button class="edit-btn" onclick="closeReview()">✏️ تعديل الطلب</button>
      <button class="send-btn" onclick="confirmOrder()">✅ تأكيد وإرسال</button>
    </div>
  `;

  document.getElementById("reviewModal").classList.add("show");
}

function closeReview(){
  document.getElementById("reviewModal").classList.remove("show");
}

function confirmOrder(){
  if(!validateCustomer())return;

  const c=customerData();
  const t=productsTotal(),d=delivery();

  let msg="🛍️ طلب جديد من AMO\n\n";
  msg+="👤 الاسم: "+c.name+"\n";
  msg+="📱 الهاتف: "+c.phone+"\n";
  msg+="📍 المحافظة: "+c.city+"\n";
  msg+="🏠 العنوان: "+c.address+"\n";
  if(c.notes)msg+="📝 الملاحظات: "+c.notes+"\n";

  msg+="\n━━━━━━━━━━━━━━\n🛒 تفاصيل الطلب:\n";

  cart.forEach((x,i)=>{
    msg+=`\n${i+1}. ${x.name}\n`;
    if(x.colorName)msg+=`🎨 اللون: ${x.colorName}\n`;
    if(x.size)msg+=`📏 الحجم: ${x.size}\n`;
    if(x.dimensions)msg+=`📐 الأبعاد: ${x.dimensions}\n`;
    msg+=`🔢 الكمية: ${x.quantity}\n`;
    msg+=`💰 سعر القطعة: ${x.price.toFixed(2)} د.أ\n`;
    msg+=`💵 المجموع: ${(x.price*x.quantity).toFixed(2)} د.أ\n`;
  });

  msg+="\n━━━━━━━━━━━━━━\n";
  msg+=`💰 مجموع المنتجات: ${t.toFixed(2)} د.أ\n`;
  msg+=`🚚 التوصيل: ${d===0?"مجاني":d.toFixed(2)+" د.أ"}\n`;
  msg+=`💳 المجموع النهائي: ${(t+d).toFixed(2)} د.أ\n`;
  msg+="\nشكراً لطلبك من AMO 🤍";

  const url="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);

  window.open(url,"_blank");

  cart=[];
  saveCart();
  renderCart();
  closeCart();

  document.getElementById("reviewBox").innerHTML=`
    <div class="success">
      <div class="success-icon">🎉</div>
      <h2>تم إرسال طلبك</h2>
      <p>
        شكراً لطلبك من <b>AMO</b> 🤍<br>
        تم إرسال تفاصيل الطلب عبر واتساب.<br>
        سيتم التواصل معك لتأكيد الطلب والتوصيل.
      </p>
      <button onclick="closeReview()">حسناً</button>
    </div>
  `;
  document.getElementById("reviewModal").classList.add("show");
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    closeLightbox();
    closeReview();
  }
  if(document.getElementById("lightbox").classList.contains("show")){
    if(e.key==="ArrowLeft")prevLightbox();
    if(e.key==="ArrowRight")nextLightbox();
  }
});

loadCart();
renderCart();
loadProducts();
</script>
</body>
</html>
