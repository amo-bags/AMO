<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AMO | متجر الحقائب</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f6f1;
      color: #171717;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
      font-size: 14px;
    }

    .hero {
      padding: 85px 20px;
      text-align: center;
      background: #eee9df;
    }

    .hero h1 {
      font-size: 44px;
      margin-bottom: 18px;
    }

    .hero p {
      font-size: 18px;
      color: #555;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      font-size: 15px;
    }

    .products {
      padding: 60px 6%;
    }

    .section-title {
      text-align: center;
      font-size: 30px;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .product-image {
      width: 100%;
      height: 320px;
      background: #e9e6df;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 20px;
    }

    .product-info h3 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .colors {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .color {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 0 1px #aaa;
      cursor: pointer;
    }

    .selected {
      box-shadow: 0 0 0 2px #111;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 35px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 32px;
      }

      nav a {
        display: none;
      }

      .products {
        padding: 45px 5%;
      }

      .product-image {
        height: 330px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">AMO</div>

  <nav>
    <a href="#home">الرئيسية</a>
    <a href="#products">الحقائب</a>
    <a href="#contact">تواصل معنا</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>اختاري شنطتك بستايلك الخاص</h1>

  <p>
    حقائب أنيقة تناسب كل إطلالة ✨
  </p>

  <a href="#products" class="btn">
    اكتشفي الحقائب
  </a>
</section>

<section class="products" id="products">

  <h2 class="section-title">
    أحدث الحقائب
  </h2>

  <div class="grid" id="productsGrid"></div>

</section>

<footer id="contact">

  <div class="logo">AMO</div>

  <p style="margin-top:10px;">
    متجر الحقائب
  </p>

</footer>

<script src="products.js"></script>

<script>

  const grid = document.getElementById("productsGrid");

  products.forEach(product => {

    const card = document.createElement("div");

    card.className = "card";

    let imageHTML = "";

    if (product.image) {
      imageHTML =
        `<img src="${product.image}" alt="${product.name}">`;
    } else {
      imageHTML =
        `<span>صورة الشنطة #${product.id}</span>`;
    }

    const colorsHTML = product.colors.map((color, index) => {

      return `
        <button
          class="color ${index === 0 ? "selected" : ""}"
          style="background:${color.value}"
          title="${color.name}"
          onclick="selectColor(this, '${color.name}')">
        </button>
      `;

    }).join("");

    const firstColor = product.colors[0]?.name || "";

    card.innerHTML = `

      <div class="product-image">
        ${imageHTML}
      </div>

      <div class="product-info">

        <h3>${product.name}</h3>

        <div class="price">
          ${product.price} دينار
        </div>

        <p style="margin-bottom:10px;">
          اختاري اللون:
        </p>

        <div class="colors">
          ${colorsHTML}
        </div>

        <button
          class="btn"
          onclick="orderProduct('${product.id}', '${product.name}', ${product.price}, '${firstColor}')">

          اطلب عبر واتساب

        </button>

      </div>
    `;

    grid.appendChild(card);
  });


  function selectColor(button, color) {

    const parent = button.parentElement;

    parent.querySelectorAll(".color")
      .forEach(item => item.classList.remove("selected"));

    button.classList.add("selected");

    parent.dataset.selectedColor = color;
  }


  function orderProduct(id, name, price, defaultColor) {

    const card = event.target.closest(".card");

    const colorsBox = card.querySelector(".colors");

    const selectedColor =
      colorsBox.dataset.selectedColor || defaultColor;

    const message =
      "مرحباً AMO 👋\n\n" +
      "أرغب بطلب:\n" +
      "المنتج: " + name + "\n" +
      "رقم المنتج: #" + id + "\n" +
      "اللون: " + selectedColor + "\n" +
      "السعر: " + price + " دينار";

    const url =
      "https://wa.me/" +
      whatsappNumber +
      "?text=" +
      encodeURIComponent(message);

    window.open(url, "_blank");
  }

</script>

</body>
</html>
